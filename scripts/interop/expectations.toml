# tst-interop expectations file.
#
# Each `[[expect]]` block declares a known outcome for a (cell, profile)
# pair so `report merge` doesn't fail the whole interop matrix on a
# documented, already-understood gap. Every FAIL that has no matching
# block here stays fatal — see crates/tst-interop/src/report.rs's module
# doc for why that's the load-bearing property of this file.
#
# Grammar (hand-parsed by `report::parse_expectations` — read that
# function for the exact rules; every line is either a `#` comment, a
# blank line, a literal `[[expect]]` block marker, or a `key = "value"`
# line inside a block):
#
#   [[expect]]
#   cell = "decode/mpv"                  # exact cell id, or a trailing "*" glob (e.g. "decode/*")
#   profile = "baseline"                 # exact profile name (see crates/tst-interop/src/profiles.rs)
#   verdict = "expected_unsupported"     # or "known_flaky"
#   reason = "mpv has no async KLV support (see linked ticket)"
#   ref = "https://example.invalid/TICKET-123"       # optional
#   failure_contains = "some substring"              # optional, see below
#
# `expected_unsupported`: this (cell, profile) pair is known to fail and
# is not expected to ever pass — if it starts passing, `report merge`
# flags the expectation as stale and FAILS THE RUN (exit 1) — a stale
# row is a real drift finding, not a warning, and the fix is to remove
# it in the same change. `results.json` IS still written in this case
# (with the stale row listed under `summary.stale_expectations`), so
# the offending row can be found and removed; this is different from an
# inventory mismatch (missing/duplicate/extra/undeclared-skip cell),
# which is exit 2 with no `results.json` written at all.
#
# `known_flaky`: this (cell, profile) pair intermittently fails; a FAIL
# is reported non-fatally (labeled KNOWN-FLAKY in the rendered report)
# and a PASS is simply normal — never flagged stale.
#
# `failure_contains` (optional): narrows this block to only match a
# `FAIL` whose failures text (the raw cell's `failures` array, joined
# with "; ") contains this substring. A `FAIL` on the same (cell,
# profile) whose text does NOT contain it is not matched by this block —
# it falls through to a later block (if any matches) or, if none do,
# surfaces as an unexpected FAIL. Use this whenever a (cell, profile)
# pair can genuinely fail for more than one distinct, already-understood
# reason and a plain (cell, profile) match would blanket over a
# DIFFERENT failure mode than the one this block's `reason` describes.
# Omit it (the common case) to match any FAIL on the (cell, profile)
# pair regardless of text, exactly as before this key existed. Never
# applied to a PASS staleness check — an expectation is checked for
# staleness by (cell, profile) alone.
#
# Matching rules: `cell` may only use `*` as a trailing prefix-match glob
# (e.g. "decode/*" — never mid-string); `profile` is always an exact
# match, never a glob; `failure_contains`, when present, is always a
# literal substring match, never a glob or regex.
#
# Ambiguity rejection: `parse_expectations` REJECTS the whole file (a
# hard error, before any cell is even read) if two blocks share a
# `profile` and their `cell` patterns overlap (equal, or one a
# prefix-glob of the other) unless both carry a `failure_contains` and
# the two strings differ. First-match-wins is not how this file is
# read — an ambiguous pair must be resolved by giving each block a
# distinct `failure_contains` (the genuinely-two-reasons case this key
# exists for) or by removing/narrowing one of the blocks.
#
# Every real row below is authored from actual run-log evidence (a full
# --profiles run at --seconds 8, all 12 profiles, every peer tool
# installed — see task 12's report / README.md's "Known,
# already-evidenced gaps" section for the full mechanism + repro per
# cluster). No row exists without a run that reproduced its exact
# (cell, profile) FAIL first.

[[expect]]
cell = "hls/ffmpeg-pull"
profile = "baseline"
verdict = "expected_unsupported"
reason = "ffmpeg -c copy -copy_unknown strips the leading 5 bytes of every KLV record's payload when remuxing this codebase's async/PrivateData KLV PID (stream_type 0x06) — verified byte-for-byte with tsp -P pes --save-es on a pure file-to-file remux: the 16-byte SMPTE UL key 06 0E 2B 34 02 0B 01 01 0E 01 03 01 01 00 00 00 becomes 0B 01 01 0E 01 03 01 01 00 00 00 (5 leading bytes gone), corrupting the UL key this codebase's demuxer requires. The PMT (stream_type + KLVA registration descriptor) survives the remux intact; this is an ffmpeg mpegts-demux payload bug with the klv codec_id, not a PMT/classification loss and not something a more-lenient demuxer could legitimately accept (the bytes are genuinely gone). See README.md's 'Known, already-evidenced gaps' item 1. Verified on ffmpeg 6.1.1."
failure_contains = "KLV records: got 0"

