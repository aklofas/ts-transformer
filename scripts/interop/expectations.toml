[[expect]]
cell = "srt-live/us-to-ffmpeg/klv-sync"
profile = "klv-sync"
verdict = "expected_unsupported"
reason = "Companion finding to the async-KLV payload truncation (see the baseline reason on this same cell axis): for SynchronousMetadata KLV (stream_type 0x15, real H.222.0 5-byte Metadata_AU_cell header + real PES PTS), ffmpeg's remux strips that AU-cell header (the same 5-byte consumption, this time removing genuine wrapper bytes instead of UL-key bytes) AND downgrades the PMT's KLV stream_type from 0x15 to 0x06 on write-back, even though it correctly read 0x15 + the KLVA descriptor on input. This codebase's own demuxer then classifies the remuxed PID as Async carriage, matching what the wire PMT now says — self-consistent, not a demuxer bug. Verified byte-for-byte with tsp -P pes --save-es + tspsi PMT diff on a file-to-file remux. See README.md's 'Known, already-evidenced gaps' item 1. Verified on ffmpeg 6.1.1."
failure_contains = "expected Sync, observed"

