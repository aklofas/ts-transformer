reason = "ffmpeg's default (no -map 0) auto-stream-selection excludes both of this profile's PIDs: this codebase's AV1 carriage uses PMT stream_type 0x06 (PES-private-data), the same generic classification as this codebase's own KLV PrivateData convention — ffmpeg's stderr confirms ('Stream 0, codec bin_data, is muxed as a private data stream and may not be recognized upon reading'), and with neither PID auto-selected, ffmpeg refuses to even open its output ('Output file does not contain any stream', exit 234) — its SRT connection never establishes, so tst-interop recv times out on accept. Matches the plan's expected 'AV1-in-TS vs several tools' gap; this cell's peer command (srt-live/ffmpeg-to-us's shape) intentionally mirrors the transport-axis srt/ffmpeg-to-us cell verbatim (task 11), which never surfaced this because baseline's H.264 video auto-selects fine even without -map 0 — only an all-private-data profile like AV1 hits it. Verified on ffmpeg 6.1.1."

