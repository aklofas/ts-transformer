profile = "baseline"
verdict = "known_flaky"
reason = "VLC's --sout RTSP serving ('#rtp{sdp=rtsp://:PORT/s}') returned a 5XX Server Error to ffmpeg's DESCRIBE in local testing — wired as known_flaky from day one per the plan; this cell has no tst-interop transport leg at all (peer-to-peer only, VLC serves + ffmpeg pulls), so it doesn't exercise this codebase's own RTSP code either way. See README.md's 'Known, already-evidenced gaps' item 4."

[[expect]]
cell = "rtsp-serve/vlc-probe"
profile = "baseline"
verdict = "expected_unsupported"
reason = "VLC 'main decoder error: buffer deadlock prevented' — this codebase's synthetic H.264 fixture only builds a real, decodable SPS/PPS/IDR on keyframes (every 30th frame); every inter-frame AU is filler bytes wrapped in a bare NAL header, which VLC's decoder cannot handle over an RTSP session. The decode/vlc/* format-axis cells (task 12) reproduce the identical 'buffer deadlock prevented' message on a bare local file with no transport at all, corroborating that this is about the synthetic fixture's filler content, not the RTSP wire protocol. See README.md's 'Known, already-evidenced gaps' item 5."

[[expect]]
cell = "rtsp-serve/ffmpeg-pull"
profile = "baseline"
verdict = "expected_unsupported"
reason = "Two independent, already-evidenced gaps compound on this cell: (1) the async-KLV payload-truncation finding (this same reason applies on every ffmpeg -c copy cell touching this codebase's KLV PID — see item 1), and (2) a real video-AU shortfall (149/240, just under the 70% floor) plausibly from RTSP's TCP-interleaved SETUP/PLAY handshake costing more startup time than a direct SRT/TCP connect. Left as an expectation rather than special-cased with a longer --seconds for RTSP specifically — that would diverge this one cell's timing from every other cell's shared --seconds budget for a margin call this close to the floor. See README.md's 'Known, already-evidenced gaps' item 5. Verified on ffmpeg 6.1.1."

