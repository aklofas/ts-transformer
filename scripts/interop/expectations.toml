profile = "baseline"
verdict = "expected_unsupported"
reason = "Peer-side (ffmpeg/librist-input-path) issue, not a tst-interop send-side one: ffmpeg either registers a peer/flow that goes dead (RIST) or successfully probes the stream but never writes a byte before being force-killed (UDP) — reproduces identically with -fflags nobuffer and longer settle times, so it isn't a startup-race artifact of this harness's own timing. The identical send calls against tsp listeners on the same two transports, same run, PASS byte-perfect. See README.md's 'Known, already-evidenced gaps' item 3. Verified on ffmpeg 6.1.1."

