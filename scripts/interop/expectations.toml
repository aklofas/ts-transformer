[[expect]]
cell = "srt-live/us-to-ffmpeg/h266-klv"
profile = "h266-klv"
verdict = "expected_unsupported"
reason = "ffmpeg's stderr explicitly rejects this codebase's H.266/VVC VPS: 'vps_video_parameter_set_id out of range: 0, but must be in [1,15]' on every parsed unit, including keyframes — the VPS RBSP bytes are tst-core's own tested vps_main10 fixture (crates/tst-interop/src/fixtures.rs's h266_au, byte 0's top 4 bits = vps_video_parameter_set_id = 0). H.266/VVC (unlike HEVC) reserves vps_id=0 to mean a single-layer bitstream with no VPS referenced — plausibly ffmpeg's VVC parser (recently added, still maturing) doesn't implement that special case, though this was not independently verified against the H.266 V4 spec text in this session. Either way ffmpeg never establishes valid codec parameters for the PID and writes/receives nothing at all ('Output file is empty, nothing was encoded' / zero video AUs on the recv side) — a total failure, not merely the KLV-payload-truncation finding above. Potential library follow-up: confirm vps_id=0's H.266 spec meaning and consider whether tst-core's own fixture should use a nonzero id for broader third-party-decoder compatibility (out of scope for this scripts-only task — not changed here). Verified on ffmpeg 6.1.1."

