[[expect]]
cell = "srt-live/tsp-to-us/baseline"
profile = "baseline"
verdict = "expected_unsupported"
reason = "SRT-specific tail loss with a paced (tsp -P regulate --linger 5) sender: tst-interop recv's Teeing tap (below the demuxer, i.e. what libsrt actually delivered) already shows the shortfall, ruling out post-receipt processing loss. Tripling the sender's --linger to 15s reproduced the identical byte count, ruling out a sender-drain problem. A later fix-round re-review tested and DISPROVED an initial 'recv's own deadline' theory: giving recv --seconds 20 (2.5x the peer's real 8s content) reproduces the identical byte shortfall for both tsp and gst senders — recv's own natural end-of-stream detection fires within ~1ms of the sender's own process exit regardless of the extra deadline margin, so no receive-side wait recovers bytes the sender's own -O srt/srtsink output path never queued for srt_sendmsg() in the first place. Narrowed to tsp's/GStreamer's own SRT output-plugin closing behavior (not reproduced over RIST/UDP with the identical -P regulate pacing over the same recv code) — exact upstream mechanism not independently confirmed against their source. No script-only fix exists; residual work is upstream or needs send-side reproduction outside this driver, not a tst-interop recv change. See README.md's 'Known, already-evidenced gaps' item 2."
failure_contains = "stream_sha256 mismatch"

