name: jvm-build
description: >-
  Builds and tests the JVM binding on one platform, rebuilds the probe-free
  native lib, runs the module-path smoke and uploads the lib as
  native-<triple>. Check the repository out (with submodules) and run
  ./.github/actions/rust-setup first: a local action is read from the
  checkout, and this action does not call another local action.
inputs:
  triple:
    description: "linux-x86_64 | linux-aarch64 | macos-aarch64 | windows-x86_64"
    required: true
  runner:
    description: "The job's runs-on label (ubuntu-24.04 | ubuntu-24.04-arm | macos-15 | windows-latest)"
    required: true
runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    # librist (tst-rist, behind org.tstrans.shells' rist:// dispatch) builds with
    # meson + ninja and needs pkg-config; cmake is pre-installed. On Linux the
    # runner image ships ninja and pkg-config; meson comes from the hashed pip file.
    - name: Install build prerequisites (Linux)
      if: inputs.runner == 'ubuntu-24.04' || inputs.runner == 'ubuntu-24.04-arm'
      shell: bash
      run: bash scripts/ci/install-build-tools.sh

    - name: Install build prerequisites (macOS)
      if: inputs.runner == 'macos-15'
      shell: bash
      run: |
        for pkg in meson ninja pkg-config; do
          brew list --formula "$pkg" >/dev/null 2>&1 || brew install "$pkg"
        done

    - name: Install build prerequisites (Windows)
      if: inputs.runner == 'windows-latest'
      shell: bash
      run: |
        set -euo pipefail
        # pip drops meson, ninja and pkg-config into the Python Scripts dir;
        # a runner's already-running job does not re-read a registry PATH, so
        # export that dir for the later steps.
        python -m pip install --require-hashes -r scripts/ci/requirements-build-tools.txt
        scripts_dir=$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')
        echo "$scripts_dir" >> "$GITHUB_PATH"
        export PATH="$scripts_dir:$PATH"
        for tool in ninja meson pkg-config; do
          command -v "$tool" >/dev/null 2>&1 || { echo "FAIL: '$tool' not on PATH after prereq install"; exit 1; }
        done

    # Maven Central has answered a test dependency's POM with 429 and with
    # "not found": fetch everything in a retried call before the cargo build,
    # so a refused fetch is retried instead of failing the build minutes in.
    - name: Resolve Gradle dependencies (retried)
      shell: bash
      run: bash scripts/ci/gradle-resolve.sh -PjniTestHooks=true

    - name: Build + test JVM binding
      working-directory: bindings/jvm
      shell: bash
      env:
        SRT_FORCE_VENDORED: "1"
        RIST_FORCE_VENDORED: "1"
      # -PjniTestHooks=true builds the test-only panic probe and runs
      # PanicIsolationTest, proving a Rust panic is isolated as a thrown
      # RuntimeException instead of aborting the JVM.
      run: ./gradlew test --no-daemon --stacktrace -PjniTestHooks=true

    # The positive control of the hook guard below: the library the step above
    # built with the test hooks must hold them, so a guard that reads no symbol
    # cannot pass. The hook symbols are derived from bindings/jvm/src.
    - name: Hook guard sees the hooks in a hook build
      shell: bash
      run: bash scripts/ci/jvm-hook-guard.sh check --expect-hooks bindings/jvm/src/main/resources/native/${{ inputs.triple }}/libtstjni.*

    - name: Rebuild shippable native lib (probe-free)
      working-directory: bindings/jvm
      shell: bash
      env:
        SRT_FORCE_VENDORED: "1"
        RIST_FORCE_VENDORED: "1"
      # cargoBuild without -PjniTestHooks omits the jni-test-hooks feature;
      # cargo rebuilds (feature set changed) and copyNative re-stages the
      # probe-free lib into resources/ before the upload step copies it.
      run: ./gradlew copyNative --no-daemon --stacktrace

    # The suite once more against the library users get: a test that passes
    # only because a hook is compiled in fails here.
    - name: Test JVM binding without the test hooks
      if: inputs.triple == 'linux-x86_64'
      working-directory: bindings/jvm
      shell: bash
      env:
        SRT_FORCE_VENDORED: "1"
        RIST_FORCE_VENDORED: "1"
      run: ./gradlew test --rerun --no-daemon --stacktrace

    # A named module on the module path consumes this leg's jar, so a package
    # missing from module-info fails on every platform (path separators differ).
    - name: Module-path smoke (this platform's jar)
      working-directory: bindings/jvm
      shell: bash
      env:
        SRT_FORCE_VENDORED: "1"
        RIST_FORCE_VENDORED: "1"
      run: ./gradlew modulePathSmoke --no-daemon --stacktrace

    - name: check-jvm-jni-catch-coverage
      if: inputs.triple == 'linux-x86_64'
      shell: bash
      run: bash scripts/check/jvm/jni-catch-coverage.sh

    - name: check-jvm-publisher-interface-mirror
      if: inputs.triple == 'linux-x86_64'
      shell: bash
      run: bash scripts/check/jvm/publisher-interface-mirror.sh

    - name: check-jvm-ordinal-sites
      if: inputs.triple == 'linux-x86_64'
      shell: bash
      run: bash scripts/check/jvm/ordinal-sites.sh

    # The marked Java blocks of docs/languages/jvm.md compile against this
    # leg's jar (the module-path smoke above built it; javac only, nothing
    # loads the native library). The rail SKIPs without an input; here a SKIP
    # fails the step.
    - name: check-jvm-guide-snippets
      if: inputs.triple == 'linux-x86_64'
      shell: bash
      run: |
        set -euo pipefail
        jars=(bindings/jvm/build/libs/tstrans-jvm*.jar)
        [ "${#jars[@]}" -eq 1 ] && [ -f "${jars[0]}" ] || { echo "::error::want one jar under bindings/jvm/build/libs, found: ${jars[*]}"; exit 1; }
        out="$(bash scripts/check/repo/doc-snippets.sh java "${jars[0]}")"
        printf '%s\n' "$out"
        case "$out" in *SKIP*) echo "::error::doc-snippets did not compile the JVM guide's snippets"; exit 1 ;; esac

    # The dev-mode `test` task stages the cdylib into resources/native/<triple>/
    # already renamed to libtstjni.<ext>. Lay it out under native/ for upload.
    - name: Stage native lib for upload
      shell: bash
      run: |
        mkdir -p upload/native/${{ inputs.triple }}
        cp bindings/jvm/src/main/resources/native/${{ inputs.triple }}/libtstjni.* \
           upload/native/${{ inputs.triple }}/
        ls -la upload/native/${{ inputs.triple }}/

    # The rebuild above must have dropped every test-hook native: checked on
    # every platform by the symbol names, which ELF, Mach-O and PE all carry.
    - name: Shipped native lib has no test-hook symbol
      shell: bash
      run: bash scripts/ci/jvm-hook-guard.sh check upload/native/${{ inputs.triple }}/libtstjni.*

    - name: check-jvm-hook-guard self-test
      if: inputs.triple == 'linux-x86_64'
      shell: bash
      run: bash scripts/ci/tests/jvm-hook-guard-selftest.sh

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: native-${{ inputs.triple }}
        path: upload/
        if-no-files-found: error
        retention-days: 7
