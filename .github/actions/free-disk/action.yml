name: free-disk
description: >-
  Linux only. Removes preinstalled toolsets this repository never uses and
  prints the free space on / before and after, so a disk-full failure can be
  told apart as the runner image or our tree. Run it before any cache restore.
outputs:
  avail_before:
    description: Bytes available on / before the cleanup
    value: ${{ steps.before.outputs.avail_before }}
runs:
  using: composite
  steps:
    - id: before
      if: runner.os == 'Linux'
      shell: bash
      name: Disk before
      run: |
        df -h /
        echo "avail_before=$(df -B1 --output=avail / | tail -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"
    - if: runner.os == 'Linux'
      shell: bash
      name: Remove unused preinstalled toolsets
      run: |
        # Every removal is bounded and timed: this step prints nothing on its
        # own, so a wedged runner here looked like a slow rm (45 min to the job
        # cap, once). A bounded removal that times out costs the space it would
        # have freed, nothing else.
        for p in /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
          [ -e "$p" ] || continue
          t0=$SECONDS
          sudo timeout 300 rm -rf "$p" || echo "free-disk: rm $p exited $? (bounded at 300 s)"
          echo "free-disk: $p removed in $((SECONDS - t0)) s"
        done
        if command -v docker >/dev/null 2>&1; then
          t0=$SECONDS
          sudo timeout 120 docker image prune -af >/dev/null 2>&1 || echo "free-disk: docker image prune exited $? (bounded at 120 s)"
          echo "free-disk: docker images pruned in $((SECONDS - t0)) s"
        fi
    - if: runner.os == 'Linux'
      shell: bash
      name: Disk after
      env:
        BEFORE: ${{ steps.before.outputs.avail_before }}
      run: |
        df -h /
        after="$(df -B1 --output=avail / | tail -1 | tr -d ' ')"
        line="$(awk -v b="$BEFORE" -v a="$after" 'BEGIN{g=1073741824; printf "free-disk: %.1f GiB → %.1f GiB (+%.1f GiB)", b/g, a/g, (a-b)/g}')"
        echo "$line"
        echo "$line" >> "$GITHUB_STEP_SUMMARY"
