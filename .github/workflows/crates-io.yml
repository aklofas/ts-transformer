# crates.io publish via Trusted Publishing (OIDC).
#
# Publishes all 12 publishable workspace crates in dependency order,
# authenticating via OIDC (rust-lang/crates-io-auth-action) — no
# maintainer-held API token. The crates.io side trusts THIS workflow
# (filename crates-io.yml) running in the `crates-io` environment of
# aklofas/ts-transformer. Renaming this file or the environment breaks
# that binding — update every crate's Settings → Trusted Publishing on
# crates.io if either ever changes.
#
# Two jobs, one per trigger kind:
# - `publish` runs on a tag push `v*` only: version check, then the real
#   ordered publish. It alone enters the `crates-io` environment and holds
#   `id-token: write`, the identity crates.io trusts.
# - `rehearse` runs on workflow_dispatch and on a pull_request touching
#   this file or the release scripts: it packages and verify-builds every
#   crate in the same order (`cargo publish --dry-run`), uploads nothing,
#   and has neither the environment nor an OIDC token, so a rehearsal can
#   never publish. scripts/release/publish-crates-all.sh reads the layer
#   lists from the publish job's steps below, so both jobs walk the same
#   lists.
#
# Rehearsals resolve internal deps from the TREE, not the index: the
# "Point registry deps at the tree" step writes a `[patch.crates-io]`
# table (scripts/release/dry-run-patch-config.sh) so a rehearsal passes
# between a version sweep and its tag publish too; without it every
# layer-2+ dry run fails dependency resolution whenever the in-tree
# version is ahead of the index. The publish job never gets the patch
# table (it must resolve against the registry; layers land in order and
# cargo >=1.85 waits for index propagation).
#
# Token lifetime: OIDC-minted tokens live ~30 min and the full sequence
# (two vendored-C verify builds included) can exceed that, so each layer
# mints its OWN token; the action's post step revokes them at job end.
#
# Re-runs are idempotent: the layer script skips crates already live at
# their current version (crates.io publishes are immutable), so a
# mid-sequence failure recovers with a plain re-run of the publish job.

name: crates-io

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/crates-io.yml"
      - ".github/actions/rust-setup/**"
      - "rust-toolchain.toml"
      - "scripts/release/**"

env:
  # Vendored native builds for the sys crates' verify step, in both jobs.
  SRT_FORCE_VENDORED: "1"
  RIST_FORCE_VENDORED: "1"
  CARGO_TERM_COLOR: always

jobs:
  rehearse:
    name: rehearsal (12 crates, dry run)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The sys crates' verify builds compile the vendored
          # libsrt/librist/mbedTLS trees.
          submodules: recursive

      - name: Assert version consistency
        # Same rail ci/python-wheels/jvm-jar run (internal dep `version`
        # keys == workspace version).
        run: bash scripts/check/repo/release-version-consistency.sh

      - name: Install build prerequisites
        # librist's vendored build is meson-driven; libsrt + mbedTLS use
        # cmake (pre-installed on GitHub runners). Needed by the verify
        # builds of tstrans-{srt,rist}-sys / tst-srt / tst-rist.
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build

      - uses: ./.github/actions/rust-setup

      - name: Point registry deps at the tree
        # `cargo publish --dry-run` rewrites path deps to registry
        # requirements and resolves them against the index, which cannot
        # satisfy a bumped `version =` key before the tag publish. A
        # config-level [patch.crates-io] makes the resolver take the
        # in-tree copies instead (see the script header for the why and
        # the one case it cannot cover — a stale pin, which the version
        # rail above catches). The checkout-local .cargo/config.toml sits
        # outside every crate root, so cargo's uncommitted-changes check
        # ignores it.
        run: |
          mkdir -p .cargo
          bash scripts/release/dry-run-patch-config.sh >> .cargo/config.toml
          cat .cargo/config.toml

      - name: Rehearse every layer
        env:
          PUBLISH: "0"
        run: bash scripts/release/publish-crates-all.sh

  publish:
    name: ordered publish (12 crates)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every crate's crates.io Trusted Publishing config names this
    # environment (the OIDC claim carries it). Only this tag-only job
    # enters it; the environment's deployment policy admits `v*` tags.
    environment:
      name: crates-io
      url: https://crates.io/crates/tst-core
    permissions:
      contents: read
      # Required to mint the OIDC token crates.io exchanges for a
      # temporary publish token.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Assert version consistency
        # On a v* tag push this also forces source version == tag. Re-asserted
        # at publish time because it is the specific guard against stranding
        # the ordered publish mid-sequence (internal dep `version` keys ==
        # workspace version).
        run: bash scripts/check/repo/release-version-consistency.sh

      - name: Install build prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build

      - uses: ./.github/actions/rust-setup

      # Each layer step's argument list is the layer: the rehearsal reads
      # these lines, and the roster rail checks them against the roster.
      # ---- Layer 1: the base of the dependency chain ------------------
      - name: Mint crates.io token (layer 1)
        id: auth1
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      - name: Layer 1 — tstrans-mbedtls-src
        env:
          PUBLISH: "1"
          CARGO_REGISTRY_TOKEN: ${{ steps.auth1.outputs.token }}
        run: bash scripts/release/publish-crates-layer.sh tstrans-mbedtls-src

      # ---- Layer 2: sys crates (vendored-C verify builds, the slow ones)
      - name: Mint crates.io token (layer 2)
        id: auth2
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      - name: Layer 2 — tstrans-srt-sys, tstrans-rist-sys
        env:
          PUBLISH: "1"
          CARGO_REGISTRY_TOKEN: ${{ steps.auth2.outputs.token }}
        run: bash scripts/release/publish-crates-layer.sh tstrans-srt-sys tstrans-rist-sys

      # ---- Layer 3: core + pipeline ------------------------------------
      - name: Mint crates.io token (layer 3)
        id: auth3
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      - name: Layer 3 — tst-core, tst-pipeline
        env:
          PUBLISH: "1"
          CARGO_REGISTRY_TOKEN: ${{ steps.auth3.outputs.token }}
        run: bash scripts/release/publish-crates-layer.sh tst-core tst-pipeline

      # ---- Layer 4: the seven transports ---------------------------------
      - name: Mint crates.io token (layer 4)
        id: auth4
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      - name: Layer 4 — transports
        env:
          PUBLISH: "1"
          CARGO_REGISTRY_TOKEN: ${{ steps.auth4.outputs.token }}
        run: bash scripts/release/publish-crates-layer.sh tst-udp tst-tcp tst-hls tst-rtp tst-webrtc tst-srt tst-rist
