# crates.io publish via Trusted Publishing (OIDC).
#
# Publishes all 11 publishable workspace crates in dependency order,
# authenticating via OIDC (rust-lang/crates-io-auth-action) — no
# maintainer-held API token. The crates.io side trusts THIS workflow
# (filename crates-io.yml) running in the `crates-io` environment of
# aklofas/ts-transformer. Renaming this file or the environment breaks
# that binding — update every crate's Settings → Trusted Publishing on
# crates.io if either ever changes.
#
# Triggers (mirrors python-wheels.yml):
# - tag push `v*` — REL-01 preflight, then the real ordered publish.
# - workflow_dispatch — full dry-run rehearsal (packages + verify-builds
#   every crate in order, uploads nothing, needs no token).
# - pull_request touching this file — same dry-run, so workflow
#   regressions surface pre-merge.
#
# Dry-run caveat: rehearsals only fully pass while the workspace version
# is a PUBLISHED version — after a release version sweep (pre-tag),
# layer-2+ dry-runs fail dependency resolution because the index can't
# satisfy the bumped `version =` keys yet. Expected; rehearse between
# releases. The real tag publish is immune (layers land in order; cargo
# >=1.85 waits for index propagation).
#
# Token lifetime: OIDC-minted tokens live ~30 min and the full sequence
# (two vendored-C verify builds included) can exceed that, so each layer
# mints its OWN token; the action's post step revokes them at job end.
#
# Re-runs are idempotent: the layer script skips crates already live at
# their current version (crates.io publishes are immutable), so a
# mid-sequence failure recovers with a plain re-run of this job.

name: crates-io

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/crates-io.yml"

env:
  # Match the pin used elsewhere in the workspace.
  RUSTUP_TOOLCHAIN: "1.85"
  # Vendored native builds for the sys crates' verify step.
  SRT_FORCE_VENDORED: "1"
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: ordered publish (11 crates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every crate's crates.io Trusted Publishing config names this
    # environment (the OIDC claim carries it). No protection rules — the
    # tag is the gate. NOTE: the environment binds ALL runs of this job,
    # including PR/dispatch dry-run rehearsals; if protection rules
    # (required reviewers) are ever added, they will gate rehearsals too —
    # at that point split this into a dry-run job (no environment, no
    # id-token) and a tag-only publish job, not before (the split costs
    # duplicated setup steps and buys nothing while the environment is
    # unprotected).
    environment:
      name: crates-io
      url: https://crates.io/crates/tst-core
    permissions:
      contents: read
      # Required to mint the OIDC token crates.io exchanges for a
      # temporary publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The sys crates' verify builds compile the vendored
          # libsrt/librist/mbedTLS trees.
          submodules: recursive

      - name: Assert version consistency (REL-01)
        # Same rail ci/python-wheels/jvm-jar run. On a v* tag push it also
        # forces source version == tag. Re-asserted at publish time because
        # it is the specific guard against stranding the ordered publish
        # mid-sequence (internal dep `version` keys == workspace version).
        run: bash scripts/check/repo/release-version-consistency.sh

      - name: Install build prerequisites
        # librist's vendored build is meson-driven; libsrt + mbedTLS use
        # cmake (pre-installed on GitHub runners). Needed by the verify
        # builds of tstrans-{srt,rist}-sys / tst-srt / tst-rist.
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Resolve mode
        id: meta
        # publish=1 only on real v* tag pushes; every other trigger runs
        # the identical sequence as a dry-run. (Per-crate versions are
        # resolved inside the layer script from cargo metadata — some
        # crates carry build-metadata suffixes, so there is no single
        # workspace version string here.)
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "publish=1" >> "$GITHUB_OUTPUT"
            echo "mode: PUBLISH (tag ${{ github.ref_name }})"
          else
            echo "publish=0" >> "$GITHUB_OUTPUT"
            echo "mode: dry-run (${{ github.event_name }})"
          fi

      # ---- Layer 1: the base of the dependency chain ------------------
      - name: Mint crates.io token (layer 1)
        if: steps.meta.outputs.publish == '1'
        id: auth1
        uses: rust-lang/crates-io-auth-action@v1

      - name: Layer 1 — tstrans-mbedtls-src
        env:
          PUBLISH: ${{ steps.meta.outputs.publish }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth1.outputs.token }}
        run: bash scripts/release/publish-crates-layer.sh tstrans-mbedtls-src

      # ---- Layer 2: sys crates (vendored-C verify builds, the slow ones)
      - name: Mint crates.io token (layer 2)
        if: steps.meta.outputs.publish == '1'
        id: auth2
        uses: rust-lang/crates-io-auth-action@v1

      - name: Layer 2 — tstrans-srt-sys, tstrans-rist-sys
        env:
          PUBLISH: ${{ steps.meta.outputs.publish }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth2.outputs.token }}
        run: bash scripts/release/publish-crates-layer.sh tstrans-srt-sys tstrans-rist-sys

      # ---- Layer 3: core + pipeline ------------------------------------
      - name: Mint crates.io token (layer 3)
        if: steps.meta.outputs.publish == '1'
        id: auth3
        uses: rust-lang/crates-io-auth-action@v1

      - name: Layer 3 — tst-core, tst-pipeline
        env:
          PUBLISH: ${{ steps.meta.outputs.publish }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth3.outputs.token }}
        run: bash scripts/release/publish-crates-layer.sh tst-core tst-pipeline

      # ---- Layer 4: the six transports ---------------------------------
      - name: Mint crates.io token (layer 4)
        if: steps.meta.outputs.publish == '1'
        id: auth4
        uses: rust-lang/crates-io-auth-action@v1

      - name: Layer 4 — transports
        env:
          PUBLISH: ${{ steps.meta.outputs.publish }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth4.outputs.token }}
        run: bash scripts/release/publish-crates-layer.sh tst-udp tst-tcp tst-hls tst-rtp tst-srt tst-rist
