name: deps-advisory

# Weekly native-dependency advisory check (TRUST PASS item 3). The six vendored
# submodules (libsrt, librist, mbedTLS, FreeRTOS kernel, FreeRTOS-POSIX, lwIP)
# are pinned by SHA and invisible to cargo-deny; this job resolves each pin to
# its upstream tag and compares it against upstream releases, GitHub security
# advisories and NVD. Each finding becomes ONE issue labelled
# `dependency-advisory`, deduplicated by exact title against every open OR
# closed issue with that label — closing an issue records the decision
# ("stay on the 3.6 LTS line") and it is never reopened. A quiet week writes
# only the step summary.
#
# The `rustsec` job checks every Cargo workspace's lockfile against the LIVE
# RustSec advisory-db (scripts/dev/rustsec-report.sh). During a release freeze
# ci.yml's deny job reads the commit pinned in tests/coverage/advisory-db-pin.toml,
# so an advisory published since shows here, as ONE open issue labelled
# `dependency-advisory` that each week with an advisory comments on; it never
# fails ci.
#
# Its one write scope is `issues: write`, for opening the finding issues; it
# never commits.

on:
  schedule:
    # Mondays 07:00 UTC — after ci-health (06:00) and interop (05:00), so the
    # three weekly jobs never compete for runners.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print findings only; create no issues'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare submodule pins against upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No submodules: the pins are read from HEAD's tree with `git ls-tree`.

      - name: Unit tests for the checker
        run: python3 -m unittest scripts/dev/test_deps_advisory.py

      - name: Check pins against releases, GHSA and NVD
        env:
          GH_TOKEN: ${{ github.token }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python3 scripts/dev/deps_advisory.py \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

  rustsec:
    name: RustSec advisories in the lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-deny runs `cargo metadata` on the runner, so it needs the toolchain.
      - uses: ./.github/actions/rust-setup

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Self-test of the report
        run: bash scripts/ci/tests/rustsec-report-selftest.sh

      - name: Check every workspace against the live advisory-db
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/dev/rustsec-report.sh \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
