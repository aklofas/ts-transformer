name: release-qualify

# One run on one commit produces the qualification record of that commit:
# every test leg (called from the existing workflows in dry-run mode), the
# fuzz leg (fuzz.yml: every declared target for 60 s, for 600 s when the run
# qualifies a release), the C ABI comparison with the previous tag, the
# breaking-change report against that tag, the CI
# result on the same SHA, the SBOMs, then `qualification.json`, its rendered
# text, SHA256SUMS, build-provenance attestations and the C package.
#
# Nothing here publishes to a registry. Every called workflow that has a
# publish job gets `dry_run: true`; its publish jobs are skipped by that input
# (the callee rail scripts/check/repo/publish-guards.sh keeps it so). fuzz.yml
# has none. The only write is the Release attach job, on a pushed `v*` tag
# whose verdict is GO.
#
# No secrets are passed down: a called workflow gets none from this one.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to qualify (must be reachable from main or a v* tag)
        type: string
        required: true
      release:
        description: "qualify as a release: require the release soak (`[soak] required_duration_s`) and corpus archives for this tree"
        type: boolean
        default: false
  push:
    tags: ["v*"]
  # Rehearsal path: a change to this workflow or to the collector runs the
  # whole thing on the PR head. The release gate (reachable from main or a v*
  # tag) applies to the other two triggers.
  pull_request:
    paths:
      - ".github/workflows/release-qualify.yml"
      - ".github/workflows/fuzz.yml"
      - "scripts/ci/fuzz*"
      - "scripts/gen/qualification*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: resolve the commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      label: ${{ steps.r.outputs.label }}
      slug: ${{ steps.r.outputs.slug }}
      workflow_sha: ${{ steps.wf.outputs.workflow_sha }}
    steps:
      - name: the sha input is the full 40-hex commit
        # actions/checkout cannot resolve an abbreviated sha ("A branch or tag with
        # the name '<short>' could not be found"); fail here with the reason instead.
        if: github.event_name == 'workflow_dispatch'
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be the full 40-hex commit (got '$SHA'); use git rev-parse <ref>"; exit 2; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve the SHA and the label
        id: r
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          sha="$(git rev-parse HEAD)"
          short="${sha:0:8}"
          git fetch --tags --force origin
          tag="$(git tag --points-at "$sha" --list 'v*' | sort -V | tail -1)"
          on_main=false
          git merge-base --is-ancestor "$sha" origin/main && on_main=true
          has_tag=false
          [ -n "$(git tag --contains "$sha" --list 'v*')" ] && has_tag=true
          if [ "$EVENT" = pull_request ]; then
            label="PR #$PR_NUMBER at $short"
            slug="pr-$PR_NUMBER-$short"
          else
            if [ "$on_main" != true ] && [ "$has_tag" != true ]; then
              echo "::error::$sha is neither reachable from origin/main nor from a v* tag; refusing to qualify it"
              exit 1
            fi
            if [ -n "$tag" ]; then
              label="$tag"; slug="$tag"
            else
              label="main at $short"; slug="main-$short"
            fi
          fi
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "qualifying $sha as '$label'"

      - name: Bind the workflow definitions to the commit
        id: wf
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SHA: ${{ steps.r.outputs.ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "rehearsal: the workflow definitions at $WORKFLOW_SHA (the merge commit) are not compared"
          else
            git diff --quiet "$WORKFLOW_SHA" "$SHA" -- .github scripts/gen || {
              git diff --name-only "$WORKFLOW_SHA" "$SHA" -- .github scripts/gen
              echo "::error::the workflow definitions at $WORKFLOW_SHA differ from $SHA under .github/ or scripts/gen/; dispatch from a ref whose workflows match the commit"
              exit 1
            }
          fi
          echo "workflow_sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

  # The four test workflows, called with dry_run so none can publish.
  interop:
    needs: resolve
    uses: ./.github/workflows/interop.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      dry_run: true

  sanitizers:
    needs: resolve
    uses: ./.github/workflows/sanitizers.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      dry_run: true

  jvm-jar:
    needs: resolve
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/jvm-jar.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      dry_run: true

  python-wheels:
    needs: resolve
    # GitHub refuses a called workflow whose (skipped) publish job asks for
    # id-token when this caller does not grant it. dry_run keeps that job from
    # running; the grant only lets the workflow load. The same holds for the
    # attestations: read grants on the jvm-jar and python-wheels callers.
    permissions:
      contents: read
      id-token: write
      attestations: read
    uses: ./.github/workflows/python-wheels.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      dry_run: true

  fuzz:
    needs: resolve
    uses: ./.github/workflows/fuzz.yml
    with:
      sha: ${{ needs.resolve.outputs.ref }}
      # 600 s per target when the run qualifies a release (the condition that
      # gives the collector --release below, which then refuses less), 60 s
      # otherwise.
      seconds_per_target: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.release == true) && 600 || 60 }}

  abi:
    name: C ABI, C package, semver report
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      # gh attestation verify reads the previous package's provenance.
      attestations: read
    outputs:
      semver: ${{ steps.semver.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          submodules: recursive

      - name: Install build prerequisites and abigail-tools
        # Pinned to the version on the ubuntu-24.04 image; an image move makes
        # the pin fail loudly, then re-pin.
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build binutils jq abigail-tools=2.4-3build1

      - name: Rust toolchain, cargo cache
        uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-release-qualify-abi-${{ hashFiles('Cargo.lock') }}

      - name: Select the previous release tag
        id: prev
        run: bash scripts/dev/prev-c-library.sh select

      - name: Previous library from the tag's Release package
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ steps.prev.outputs.prev }}
        run: bash scripts/dev/prev-c-library.sh release

      - name: Previous library cache
        if: steps.release.outputs.lib == ''
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/prev-target/debug/libtstrans.so
          key: c-abi-${{ steps.prev.outputs.prev }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Previous library built from source at the tag
        if: steps.release.outputs.lib == '' && steps.cache.outputs.cache-hit != 'true'
        env:
          PREV: ${{ steps.prev.outputs.prev }}
        run: bash scripts/dev/prev-c-library.sh build

      - name: Stage the C package (debug profile) and its ABI corpus
        # The debug profile keeps the DWARF abidw and abidiff need; a release
        # strip would be refused by abi-compat.sh. c-package.sh leaves the
        # directory read-only: unlock it for the two extra files, then lock it.
        run: |
          bash scripts/dev/c-package.sh --all-features --profile debug --out "$RUNNER_TEMP/pkg"
          chmod -R u+w "$RUNNER_TEMP/pkg"
          abidw --out-file "$RUNNER_TEMP/pkg/tstrans.abi" "$RUNNER_TEMP/pkg/lib/libtstrans.so"
          cp bindings/c/abi-symbols.txt "$RUNNER_TEMP/pkg/"
          # manifest.json was written before the two extra files existed: add
          # their digests so it covers every file in the package.
          for f in tstrans.abi abi-symbols.txt; do
            h="$(sha256sum "$RUNNER_TEMP/pkg/$f" | cut -d' ' -f1)"
            jq --arg k "$f" --arg v "$h" '.files[$k] = $v' "$RUNNER_TEMP/pkg/manifest.json" > "$RUNNER_TEMP/manifest.new"
            cat "$RUNNER_TEMP/manifest.new" > "$RUNNER_TEMP/pkg/manifest.json"
          done
          chmod -R a-w "$RUNNER_TEMP/pkg"

      - name: Compare with the previous tag and write abi.json
        env:
          PREV: ${{ steps.prev.outputs.prev }}
          PREV_MINOR: ${{ steps.prev.outputs.prev_minor }}
          HEAD_MINOR: ${{ steps.prev.outputs.head_minor }}
          RELEASE_LIB: ${{ steps.release.outputs.lib }}
          FALLBACK: ${{ steps.release.outputs.fallback }}
        run: |
          mkdir -p "$RUNNER_TEMP/abi-record"
          old="$(bash scripts/dev/prev-c-library.sh resolve)"
          # `attested`, or `built: <why>`: a failed verification and a missing
          # package read differently in the record.
          how="$(bash scripts/dev/prev-c-library.sh source)"
          bash scripts/dev/prev-c-library.sh header "$RUNNER_TEMP/prev-tstrans.h"
          set +e
          bash scripts/check/c/abi-compat.sh "$old" "$RUNNER_TEMP/pkg/lib/libtstrans.so" "$PREV_MINOR" "$HEAD_MINOR" \
            --header "$RUNNER_TEMP/pkg/include/tstrans.h" --old-header "$RUNNER_TEMP/prev-tstrans.h" --old-tag "$PREV" 2>&1 | tee "$RUNNER_TEMP/abi-record/abi-report.txt"
          rc="${PIPESTATUS[0]}"
          set -e
          verdict=incompatible
          [ "$rc" -eq 0 ] && verdict=compatible
          symbols="$(sed -n 's/.* \/ \([0-9][0-9]*\) new tst_ symbols.*/\1/p' "$RUNNER_TEMP/abi-record/abi-report.txt" | head -1)"
          abidiff_exit="$(sed -n 's/^abi-compat: abidiff exit \([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/abi-record/abi-report.txt" | head -1)"
          # The rail ended before abidiff ran (a tool or input error): say so.
          [ -n "$abidiff_exit" ] || verdict=error
          jq -n --slurpfile m "$RUNNER_TEMP/pkg/manifest.json" \
            --arg prev "$PREV" --arg how "$how" --arg verdict "$verdict" \
            --arg symbols "${symbols:-}" --arg ax "${abidiff_exit:-}" \
            --arg abidiff "$(abidiff --version | sed 's/^abidiff: *//')" \
            '{major:$m[0].abi.major, minor:$m[0].abi.minor,
              symbols:(if $symbols == "" then null else ($symbols|tonumber) end),
              previous_tag:$prev, previous_source:$how,
              abidiff_exit:(if $ax == "" then null else ($ax|tonumber) end),
              verdict:$verdict, abidiff_version:$abidiff}' > "$RUNNER_TEMP/abi-record/abi.json"
          cat "$RUNNER_TEMP/abi-record/abi.json"
          exit "$rc"

      - name: Package the C library
        run: |
          version="$(jq -r .version "$RUNNER_TEMP/pkg/manifest.json")"
          name="tstrans-c-$version-linux-x86_64"
          mkdir -p "$RUNNER_TEMP/c-package"
          mv "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/$name"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
            -czf "$RUNNER_TEMP/c-package/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
          ls -l "$RUNNER_TEMP/c-package"

      - name: cargo-semver-checks report (judged by the collector)
        id: semver
        # Not skipped when the ABI comparison above failed: the report needs
        # nothing from it, and a candidate wants its break report most in
        # that run.
        if: ${{ !cancelled() }}
        # continue-on-error because the collector alone decides: this step's
        # outcome is the leg's conclusion, and a failure, a missing report or
        # a crate the tool did not analyse is a NO-GO for a release candidate
        # (release mode, or a workspace version off the previous tag's) and
        # informational for a development tree before its version sweep.
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/abi-record"
          rc=0
          { rustup toolchain install stable --profile minimal --no-self-update &&
            cargo +stable install cargo-semver-checks --version 0.51.0 --locked --quiet; } || rc=$?
          # Run the script even when the install failed: it names the previous
          # tag (semver-baseline.json) before it needs the tool, and without
          # that tag the collector cannot tell which kind of tree this is.
          bash scripts/dev/semver-checks.sh "$RUNNER_TEMP/semver" || rc=$?
          for f in semver-baseline.json semver-checks.json; do
            [ ! -f "$RUNNER_TEMP/semver/$f" ] || cp "$RUNNER_TEMP/semver/$f" "$RUNNER_TEMP/abi-record/"
          done
          [ "$rc" -eq 0 ] || exit "$rc"
          jq -n --arg v "$(cargo +stable semver-checks --version | sed 's/^cargo-semver-checks *//')" '{version:$v}' > "$RUNNER_TEMP/abi-record/semver-checks-tool.json"

      - name: Keep the ABI record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: abi-record
          path: ${{ runner.temp }}/abi-record
          if-no-files-found: ignore

      - name: Keep the C package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c-package
          path: ${{ runner.temp }}/c-package
          if-no-files-found: error

  bench-ir:
    name: instruction counts against the previous tag
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          # The previous release tag's commit is built beside this one.
          fetch-depth: 0

      - name: Install valgrind
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y valgrind

      - name: Rust toolchain
        uses: ./.github/actions/rust-setup

      - name: Compare tst-core's instruction counts with the previous release tag
        # Both commits are built and run on this runner, so only the code
        # differs. A workload that grew by more than 3 % fails unless
        # tests/coverage/bench-accepted.toml accepts it.
        run: |
          git fetch --tags --force origin
          prev="$(bash scripts/dev/prev-tag.sh)"
          [ -n "$prev" ] || { echo "::error::no previous release tag to compare with"; exit 1; }
          bash scripts/dev/bench-ir.sh "$prev" HEAD --out "$RUNNER_TEMP/bench-ir"

      - name: Keep the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-ir
          path: ${{ runner.temp }}/bench-ir/bench-ir.json
          if-no-files-found: ignore

  ci-lookup:
    name: ci result on this commit
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Wait for the ci workflow's newest full run on the SHA, then read it
        # ci runs on pushes to main, on PR heads and on dispatches, never on a tag
        # (a tag qualification reads the push run of the record PR's merge). Only
        # a push or workflow_dispatch run counts, because test-main-extra skips on
        # pull_request (ci.yml); a rehearsal on a PR head admits its own PR run.
        # The newest eligible run is waited for while it is queued or running.
        # Nothing is re-run. No eligible run at all (a dispatch on an unpushed
        # commit) is recorded as "missing", which is a NO-GO.
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.ref }}
          ALLOW_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-record"
          while :; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=50" > "$RUNNER_TEMP/ci-runs.json"
            jq -f scripts/ci/ci-run-select.jq --arg allow_pr "$ALLOW_PR" \
              "$RUNNER_TEMP/ci-runs.json" > "$RUNNER_TEMP/ci-record/ci-state.json"
            status="$(jq -r .status "$RUNNER_TEMP/ci-record/ci-state.json")"
            if [ "$status" = completed ]; then break; fi
            echo "ci on $SHA is $status; waiting 60 s"
            sleep 60
          done
          jq 'del(.status)' "$RUNNER_TEMP/ci-record/ci-state.json" > "$RUNNER_TEMP/ci-record/ci.json"
          rm "$RUNNER_TEMP/ci-record/ci-state.json"
          cat "$RUNNER_TEMP/ci-record/ci.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-record
          path: ${{ runner.temp }}/ci-record
          if-no-files-found: error

  sbom:
    name: CycloneDX SBOMs (C library, Python extension)
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: ./.github/actions/free-disk

      - name: Generate one SBOM per binding crate
        # cargo-cyclonedx walks the whole workspace and writes one file next to
        # every member's Cargo.toml; the two that bundle natives are tst-c (the
        # C package) and tst-py (the wheel). Dependency resolution only, no
        # build, so no submodules are needed.
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          cargo +stable install cargo-cyclonedx --version 0.5.9 --locked --quiet
          cargo +stable cyclonedx --all-features -f json --spec-version 1.5 --override-filename tstrans.cdx
          mkdir -p "$RUNNER_TEMP/sbom"
          cp bindings/c/tstrans.cdx.json "$RUNNER_TEMP/sbom/tstrans-c.cdx.json"
          cp bindings/python/tstrans.cdx.json "$RUNNER_TEMP/sbom/tstrans-py.cdx.json"
          jq -n --arg v "$(cargo +stable cyclonedx --version | awk '{print $NF}')" '{version:$v}' > "$RUNNER_TEMP/sbom/sbom-tool.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
          if-no-files-found: error

  qualify:
    name: qualification record
    needs: [resolve, interop, sanitizers, jvm-jar, python-wheels, fuzz, abi, bench-ir, ci-lookup, sbom]
    # Runs after every leg whatever its result: a failed leg is a line in the
    # record and a NO-GO, not a missing record.
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Pinned Rust toolchain
        uses: ./.github/actions/rust-setup

      - name: Record the source, toolchain and host
        # Written before any artefact is downloaded, so `dirty` describes the
        # checkout and nothing this job adds.
        env:
          LABEL: ${{ needs.resolve.outputs.label }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
          # On a pull request GITHUB_REF is the merge ref, but the tree under test
          # is the PR head, so record the head ref.
          REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          dirty=false
          [ -n "$(git status --porcelain)" ] && dirty=true
          sub() {
            jq -n --arg p "$1" --arg sha "$(git -C "$1" rev-parse HEAD)" \
              --arg d "$(git -C "$1" describe --tags --always)" \
              '{($p): {sha:$sha, describe:$d}}'
          }
          subs="$( { sub crates/srt-sys/vendor/srt; sub crates/rist-sys/vendor/librist; sub crates/mbedtls-src/vendor/mbedtls; } | jq -s add)"
          nightly="$(sed -n 's/.*rustup toolchain install \(nightly-[0-9-]*\).*/\1/p' .github/workflows/ci.yml | head -1)"
          cbindgen="$(awk '/^name = "cbindgen"$/ {getline; gsub(/[^0-9.]/, "", $0); print; exit}' Cargo.lock)"
          . /etc/os-release
          jq -n --arg label "$LABEL" --arg sha "$(git rev-parse HEAD)" --arg ref "$REF" --arg wsha "$WORKFLOW_SHA" \
            --argjson dirty "$dirty" --argjson subs "$subs" \
            --arg rust "$(rustc --version | awk '{print $1" "$2}')" --arg nightly "$nightly" --arg cbindgen "$cbindgen" \
            --arg runner "ubuntu-$VERSION_ID" --arg arch "$(uname -m)" --arg kernel "$(uname -r | cut -d- -f1)" \
            '{label:$label,
              source:{sha:$sha, workflow_sha:$wsha, ref:$ref, dirty:$dirty, submodules:$subs},
              toolchain:{rust:$rust, nightly_public_api:$nightly, cbindgen:$cbindgen, tools:{}},
              host:{runner:$runner, arch:$arch, kernel:$kernel}}' > "$RUNNER_TEMP/artifacts/context.json"

      - name: Download every leg's artefacts
        # Only the record-bearing artefacts: the wheels, the fat jar and the
        # native libraries of the called workflows are not part of the record.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "{interop-evidence,interop-census-aarch64,sanitizer-*,fuzz-result,abi-record,bench-ir,c-package,ci-record,sbom}"
          path: ${{ runner.temp }}/downloaded

      - name: Lay the artefacts out for the collector
        run: |
          D="$RUNNER_TEMP/downloaded"; A="$RUNNER_TEMP/artifacts"
          ls "$D" || true
          # Interop evidence and the four sanitizer one-liners keep their
          # artefact names as directories (the layout the collector reads).
          [ -d "$D/interop-evidence" ] && cp -r "$D/interop-evidence" "$A/interop-evidence"
          # The linux-aarch64 subset's census, recorded beside the x86_64 one.
          [ -f "$D/interop-census-aarch64/interop-census-aarch64.json" ] \
            && cp "$D/interop-census-aarch64/interop-census-aarch64.json" "$A/"
          for d in "$D"/sanitizer-*; do [ -d "$d" ] && cp -r "$d" "$A/"; done
          [ -f "$D/ci-record/ci.json" ] && cp "$D/ci-record/ci.json" "$A/ci.json"
          for f in abi.json semver-checks.json semver-baseline.json; do [ -f "$D/abi-record/$f" ] && cp "$D/abi-record/$f" "$A/$f"; done
          [ -f "$D/bench-ir/bench-ir.json" ] && cp "$D/bench-ir/bench-ir.json" "$A/bench-ir.json"
          # fuzz.yml's result job merged the shards into one fuzz.json. None
          # = no file = a missing leg, never a pass.
          [ -f "$D/fuzz-result/fuzz.json" ] && cp "$D/fuzz-result/fuzz.json" "$A/fuzz.json"
          # The tool versions the record names.
          abidiff="$(jq -r '.abidiff_version // empty' "$A/abi.json" 2>/dev/null || true)"
          semver="$(jq -r '.version // empty' "$D/abi-record/semver-checks-tool.json" 2>/dev/null || true)"
          cyclone="$(jq -r '.version // empty' "$D/sbom/sbom-tool.json" 2>/dev/null || true)"
          jq --arg a "$abidiff" --arg s "$semver" --arg c "$cyclone" \
            '.toolchain.tools = ({} + (if $a != "" then {abidiff:$a} else {} end)
                                    + (if $s != "" then {"cargo-semver-checks":$s} else {} end)
                                    + (if $c != "" then {"cargo-cyclonedx":$c} else {} end))' \
            "$A/context.json" > "$A/context.json.new" && mv "$A/context.json.new" "$A/context.json"

      - name: Record each leg's conclusion
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_INTEROP: ${{ needs.interop.result }}
          R_SANITIZERS: ${{ needs.sanitizers.result }}
          R_JVM: ${{ needs.jvm-jar.result }}
          R_WHEELS: ${{ needs.python-wheels.result }}
          R_FUZZ: ${{ needs.fuzz.result }}
          R_ABI: ${{ needs.abi.result }}
          R_BENCH_IR: ${{ needs.bench-ir.result }}
          R_SEMVER: ${{ needs.abi.outputs.semver }}
        run: |
          jq -n --arg u "$RUN_URL" \
            --arg interop "$R_INTEROP" --arg san "$R_SANITIZERS" --arg jvm "$R_JVM" --arg wheels "$R_WHEELS" \
            --arg fuzz "$R_FUZZ" --arg abi "$R_ABI" --arg benchir "$R_BENCH_IR" --arg semver "$R_SEMVER" \
            '{interop:{conclusion:$interop, run_url:$u},
              sanitizers:{conclusion:$san, run_url:$u},
              "jvm-jar":{conclusion:$jvm, run_url:$u},
              "python-wheels":{conclusion:$wheels, run_url:$u},
              fuzz:{conclusion:$fuzz, run_url:$u},
              "c-abi":{conclusion:$abi, run_url:$u},
              "bench-ir":{conclusion:$benchir, run_url:$u},
              "semver-checks":{conclusion:(if $semver == "" then "missing" else $semver end), run_url:$u}}' \
            > "$RUNNER_TEMP/artifacts/legs.json"
          cat "$RUNNER_TEMP/artifacts/legs.json"

      - name: Collect the qualification record
        # No continue-on-error: an empty or malformed artefact makes the
        # collector exit 2 with no record, and that must fail this job.
        # A v* tag push, or a dispatch with `release: true`, qualifies a
        # release: the record is GO only with a passing release-length soak archive
        # and a passing corpus archive for this tree (fetch-depth 0 above lets
        # the collector diff an earlier soaked tree against this one).
        env:
          RELEASE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.release == true }}
          TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          flags=()
          [ "$RELEASE" = "true" ] && flags+=(--release)
          [ -n "$TAG" ] && flags+=(--tag "$TAG")
          bash scripts/gen/qualification.sh collect --artifacts "$RUNNER_TEMP/artifacts" --out "$RUNNER_TEMP/bundle/qualification.json" "${flags[@]}"

      - name: Render the record, add the natives to the SBOMs, write the bundle
        run: |
          B="$RUNNER_TEMP/bundle"
          python3 - "$B/qualification.json" "$B/qualification.md" <<'PY'
          import json, sys
          sys.path.insert(0, "scripts/gen")
          import qualification
          rec = json.load(open(sys.argv[1]))
          open(sys.argv[2], "w").write(qualification.render_block(rec))
          PY
          # The three bundled native libraries are not Cargo dependencies, so the
          # SBOMs list them from the submodule commits the record names.
          for f in tstrans-c tstrans-py; do
            [ -f "$RUNNER_TEMP/downloaded/sbom/$f.cdx.json" ] || { echo "::warning::no $f SBOM was produced"; continue; }
            jq --slurpfile ctx "$RUNNER_TEMP/artifacts/context.json" --slurpfile rec "$B/qualification.json" '
              ($ctx[0].source.submodules) as $s | ($rec[0].natives) as $n |
              .components += [
                {type:"library", "bom-ref":"native:libsrt", name:"libsrt", version:$n.libsrt,
                 purl:("pkg:github/Haivision/srt@" + $s["crates/srt-sys/vendor/srt"].sha),
                 properties:[{name:"tstrans:submodule-commit", value:$s["crates/srt-sys/vendor/srt"].sha}]},
                {type:"library", "bom-ref":"native:librist", name:"librist", version:$n.librist,
                 purl:("pkg:generic/librist@" + $n.librist),
                 properties:[{name:"tstrans:submodule-commit", value:$s["crates/rist-sys/vendor/librist"].sha}]},
                {type:"library", "bom-ref":"native:mbedtls", name:"mbedtls", version:$n.mbedtls,
                 purl:("pkg:github/Mbed-TLS/mbedtls@" + $s["crates/mbedtls-src/vendor/mbedtls"].sha),
                 properties:[{name:"tstrans:submodule-commit", value:$s["crates/mbedtls-src/vendor/mbedtls"].sha}]}]' \
              "$RUNNER_TEMP/downloaded/sbom/$f.cdx.json" > "$B/$f.cdx.json"
          done
          cp "$RUNNER_TEMP"/downloaded/c-package/*.tar.gz "$B/" || echo "::warning::no C package was produced"
          # The tree-equivalence proof: the soaks ran on an earlier commit than the
          # one qualified, so the bundle states the collector's decision in words,
          # for the x86_64 soak and for the aarch64 soak: the paths that supersede
          # it (none for a GO), what the gate admitted (generators, a version
          # sweep), the release documents that changed, and every path that differs.
          bash scripts/gen/qualification.sh tree-equivalence --json "$B/qualification.json" > "$B/TREE-EQUIVALENCE.txt"
          bash scripts/gen/qualification.sh checksums --dir "$B"
          ls -l "$B"
          cat "$B/qualification.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the bundle (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/bundle/qualification.json
            ${{ runner.temp }}/bundle/qualification.md
            ${{ runner.temp }}/bundle/tstrans-c.cdx.json
            ${{ runner.temp }}/bundle/tstrans-py.cdx.json
            ${{ runner.temp }}/bundle/tstrans-c-*.tar.gz
            ${{ runner.temp }}/bundle/TREE-EQUIVALENCE.txt
            ${{ runner.temp }}/bundle/SHA256SUMS

      - name: Keep the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qualification-${{ needs.resolve.outputs.slug }}
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error

      - name: Verdict
        id: verdict
        run: |
          v="$(jq -r .verdict "$RUNNER_TEMP/bundle/qualification.json")"
          echo "verdict=$v" >> "$GITHUB_OUTPUT"
          echo "verdict: $v"
          jq -r '.verdict_reasons[]' "$RUNNER_TEMP/bundle/qualification.json"
          # A GO bundle is complete: both SBOMs and the C package are in it.
          B="$RUNNER_TEMP/bundle"
          for f in tstrans-c.cdx.json tstrans-py.cdx.json; do
            [ -f "$B/$f" ] || { echo "::error::$f is missing from the bundle"; exit 1; }
          done
          ls "$B"/tstrans-c-*-linux-x86_64.tar.gz >/dev/null || { echo "::error::the C package is missing from the bundle"; exit 1; }
          [ "$v" = GO ]

  attach:
    name: attach the bundle to the Release
    needs: [resolve, qualify]
    # Tag pushes only, and only for a GO. This job is an upload to the
    # project's own GitHub Release, not a registry publish; the called
    # workflows above never reach their publish jobs.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.qualify.outputs.verdict == 'GO'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qualification-${{ needs.resolve.outputs.slug }}
          path: ${{ runner.temp }}/bundle

      # The publish workflows do not wait for the tag's own qualification run
      # (releasing.md §6), so each one checks the committed record itself.
      - name: The committed record is release-eligible for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/gen/qualification.sh release-eligible --sha "$GITHUB_SHA"
          # The signed certificate identity carries the workflow path and the ref, so this
          # binds the same rule release-eligible applies to the payload.
          gh attestation verify docs/project/qualification.json -R "$GITHUB_REPOSITORY" \
            --cert-identity-regex "^https://github\.com/$GITHUB_REPOSITORY/\.github/workflows/release-qualify\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$"

      - name: Verify the checksums, then upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/bundle"
          sha256sum -c SHA256SUMS
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Only a draft may have its assets replaced: once the Release is
            # published, its bundle is what users verified against.
            draft="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)"
            if [ "$draft" != true ]; then
              echo "::error::the $TAG Release is published; its assets are not replaced"
              exit 1
            fi
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber ./*
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --notes "Draft: notes from the CHANGELOG to follow." ./*
          fi
