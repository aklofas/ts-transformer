name: sanitizers

# Sanitizers (ASan, TSan) run nightly + on-demand. NOT on every PR — the
# per-job runtime + sanitizer noise is too disruptive for the PR feedback
# loop. Two scopes:
#
#   * asan / tsan — the pure-Rust crates: tst-core, tst-pipeline, tst-rtp,
#     tst-udp, tst-tcp, tst-hls.
#   * asan-native / tsan-native — the native-linking crates: tst-srt,
#     tst-rist, tst-c. `TST_NATIVE_SANITIZER=address|thread` threads
#     -fsanitize through the srt-sys/rist-sys vendored cmake+meson builds
#     so libsrt, librist and BOTH static mbedTLS copies are instrumented
#     to match the Rust test binary (see the native_sanitizer_cflags
#     helper in either build.rs). tsan-native landed 2026-08-19
#     (WP-SAN-5, docs/plans/2026-07-24-native-sanitizer-coverage.md).
#
# Tests run under cargo-nextest with the `sanitizer` profile
# (.config/nextest.toml): sanitizer-scaled per-test timeouts (ASan ~2x,
# TSan 5-15x slower) so a wedged test is killed and reported by name
# instead of hanging the nightly job silently. nextest does not run
# doctests, so doctests are exercised by regular CI only — accepted
# trade-off for the per-test timeout + network-serialization behavior.

on:
  workflow_dispatch:
  schedule:
    # 03:00 UTC daily — well outside US/EU work hours so any failures
    # surface on the morning of the following workday without competing
    # with PR-driven CI for GHA capacity.
    - cron: '0 3 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  asan:
    name: ASan (pure-Rust crates, nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install nightly + rust-src
        # rust-src is required by -Z build-std so the sanitizer can
        # instrument std/core/alloc — without it, panics and allocator
        # paths go uninstrumented and false-negatives result.
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup component add --toolchain nightly rust-src

      - name: Install cargo-nextest
        # Prebuilt binary. The `sanitizer` nextest profile provides
        # per-test kills scaled to sanitizer slowdown — a wedged test
        # fails by name instead of hanging the nightly job.
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
            !target/debug/.fingerprint
            !target/debug/deps
            !target/x86_64-unknown-linux-gnu/debug/incremental
            !target/x86_64-unknown-linux-gnu/debug/.fingerprint
            !target/x86_64-unknown-linux-gnu/debug/deps
          key: cargo-asan-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-asan-${{ runner.os }}-

      - name: nextest run under ASan
        env:
          # `-Z sanitizer=address` injects ASan instrumentation. Combined
          # with `-Z build-std=std,panic_abort` so std is rebuilt with
          # the same instrumentation (otherwise std-level UAFs go
          # undetected).
          RUSTFLAGS: "-Z sanitizer=address"
          # Suppressions are split: LSAN_OPTIONS for leak suppressions
          # (LSan rides inside ASan), ASAN_OPTIONS for ASan-proper
          # tunables. detect_stack_use_after_return=1 catches a real
          # bug class; abort_on_error=0 lets the test-runner surface
          # multiple findings per run instead of bailing on the first.
          ASAN_OPTIONS: "detect_stack_use_after_return=1:abort_on_error=0:halt_on_error=0"
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/.sanitizer-suppressions/asan.txt"
        run: |
          cargo +nightly nextest run --profile sanitizer \
            -p tst-core -p tst-pipeline \
            -p tst-rtp -p tst-udp -p tst-tcp -p tst-hls \
            --no-fail-fast \
            -Z build-std=std,panic_abort \
            --target x86_64-unknown-linux-gnu

  asan-native:
    name: ASan (native-linking crates, nightly)
    runs-on: ubuntu-latest
    # Hard-fail since 2026-08-19 (phase-in complete: 21/22 nightly greens;
    # the one red was a peer-drop-before-option-read test race, fixed in the
    # same PR that removed the soft-fail).
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install native build tools + symbolizer
        # meson + ninja: librist's vendored build (mirrors ci.yml). llvm:
        # provides /usr/bin/llvm-symbolizer, which the sanitizer runtime
        # needs to symbolize C/C++ frames in reports — without it findings
        # arrive as bare module+offset addresses (clang alone doesn't ship
        # the unversioned binary). clang: preinstalled on today's
        # ubuntu-latest, listed explicitly so runner-image drift can't
        # silently remove the compiler CC/CXX point at.
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y meson ninja-build llvm clang

      - name: Install nightly + rust-src
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup component add --toolchain nightly rust-src

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache cargo artifacts
        # Separate key from the pure-Rust asan job: this target dir holds
        # SANITIZED vendored static libs (libsrt.a, librist.a, 2x libmbed*.a).
        # Sanitized and unsanitized native artifacts must never share a cache
        # (a restored unsanitized lib would un-instrument the run invisibly;
        # build.rs rerun-if-env-changed guards the local path, the key split
        # guards the CI path — both are required).
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
            !target/debug/.fingerprint
            !target/debug/deps
            !target/x86_64-unknown-linux-gnu/debug/incremental
            !target/x86_64-unknown-linux-gnu/debug/.fingerprint
            !target/x86_64-unknown-linux-gnu/debug/deps
          key: cargo-asan-native-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-asan-native-${{ runner.os }}-

      - name: nextest run under ASan (sanitized native libs)
        env:
          # TST_NATIVE_SANITIZER threads -fsanitize=address through the
          # srt-sys/rist-sys vendored builds (mbedTLS + libsrt cmake, librist
          # meson) so every native object matches the Rust instrumentation.
          # CC/CXX=clang: the C/C++ objects must reference the same LLVM
          # ASan runtime family rustc links — gcc pairs -fsanitize with
          # libgcc's incompatible runtime (srt-sys/build.rs warns on gcc).
          TST_NATIVE_SANITIZER: address
          SRT_FORCE_VENDORED: "1"
          RIST_FORCE_VENDORED: "1"
          CC: clang
          CXX: clang++
          RUSTFLAGS: "-Z sanitizer=address"
          ASAN_OPTIONS: "detect_stack_use_after_return=1:abort_on_error=0:halt_on_error=0"
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/.sanitizer-suppressions/asan.txt"
        # Scope: the three native-linking crates. tst-c runs with ALL six
        # transport features — the only configuration where the sanitized
        # dual-mbedTLS collapse (srt-sys + rist-sys each linking their own
        # static build of the same vendor/mbedtls sources) is continuously
        # exercised. The -E filter excludes exactly the three tst-c tests
        # that operate on the PREBUILT cdylib at target/debug/libtstrans.so:
        # nextest never builds a cdylib, `--target` moves the output dir out
        # from under their hardcoded path, and an uninstrumented `cc`-built
        # smoke binary cannot load a sanitized .so anyway. Everything else
        # links the tst-c rlib straight into the sanitized test binary,
        # which is the coverage this job exists for.
        run: |
          cargo +nightly nextest run --profile sanitizer \
            -p tst-srt -p tst-rist -p tst-c \
            --features tst-c/srt,tst-c/rtp,tst-c/udp,tst-c/tcp,tst-c/hls,tst-c/rist \
            -E 'not (test(smoke_c_compiles_links_runs) | test(cdylib_exports_only_prefixed_symbols) | test(srt_symbols_not_exported))' \
            --no-fail-fast \
            -Z build-std=std,panic_abort \
            --target x86_64-unknown-linux-gnu

  tsan-native:
    name: TSan (native-linking crates, nightly)
    runs-on: ubuntu-latest
    # Hard-gating since 2026-09-09 (phase-in closed on time after five
    # consecutive job-level-green nightlies from the 2026-09-04 tst-rist
    # stats-callback fix onward). A red here is a real finding or a new
    # native race to harvest, not a rerun case.
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install native build tools + symbolizer
        # Same toolchain rationale as asan-native: meson+ninja for librist,
        # llvm for the unversioned llvm-symbolizer the TSan runtime needs,
        # clang pinned explicitly against runner-image drift.
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y meson ninja-build llvm clang

      - name: Install nightly + rust-src
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup component add --toolchain nightly rust-src

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache cargo artifacts
        # Separate key from BOTH the pure-Rust tsan job and asan-native:
        # this target dir holds TSan-instrumented vendored static libs.
        # Sanitized flavors must never share a cache (a restored
        # differently-instrumented lib would corrupt the run invisibly).
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
            !target/debug/.fingerprint
            !target/debug/deps
            !target/x86_64-unknown-linux-gnu/debug/incremental
            !target/x86_64-unknown-linux-gnu/debug/.fingerprint
            !target/x86_64-unknown-linux-gnu/debug/deps
          key: cargo-tsan-native-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-tsan-native-${{ runner.os }}-

      - name: nextest run under TSan (sanitized native libs)
        env:
          # TST_NATIVE_SANITIZER threads -fsanitize=thread through the
          # srt-sys/rist-sys vendored builds so libsrt's own threads
          # (RcvQueue, TSBPD) and librist's pthreads participate in the
          # same happens-before graph as the Rust side — cross-boundary
          # races are exactly what this job exists to see.
          TST_NATIVE_SANITIZER: thread
          SRT_FORCE_VENDORED: "1"
          RIST_FORCE_VENDORED: "1"
          CC: clang
          CXX: clang++
          RUSTFLAGS: "-Z sanitizer=thread"
          TSAN_OPTIONS: "suppressions=${{ github.workspace }}/.sanitizer-suppressions/tsan.txt:halt_on_error=0:report_signal_unsafe=0"
        # Same scope + -E exclusions as asan-native (see that job's
        # comment for the cdylib-path rationale).
        run: |
          cargo +nightly nextest run --profile sanitizer \
            -p tst-srt -p tst-rist -p tst-c \
            --features tst-c/srt,tst-c/rtp,tst-c/udp,tst-c/tcp,tst-c/hls,tst-c/rist \
            -E 'not (test(smoke_c_compiles_links_runs) | test(cdylib_exports_only_prefixed_symbols) | test(srt_symbols_not_exported))' \
            --no-fail-fast \
            -Z build-std=std,panic_abort \
            --target x86_64-unknown-linux-gnu

  tsan:
    name: TSan (pure-Rust crates, nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install nightly + rust-src
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup component add --toolchain nightly rust-src

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
            !target/debug/.fingerprint
            !target/debug/deps
            !target/x86_64-unknown-linux-gnu/debug/incremental
            !target/x86_64-unknown-linux-gnu/debug/.fingerprint
            !target/x86_64-unknown-linux-gnu/debug/deps
          key: cargo-tsan-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-tsan-${{ runner.os }}-

      - name: nextest run under TSan
        env:
          # TSan instruments every memory access for the happens-before
          # graph; significantly slower than ASan but the ONLY way to
          # surface data races. Scope covers the pure-Rust transport
          # crates too: pipeline + transport threading (the loopback
          # tests spin real reader/writer threads) is the primary
          # race-exposure surface.
          RUSTFLAGS: "-Z sanitizer=thread"
          TSAN_OPTIONS: "suppressions=${{ github.workspace }}/.sanitizer-suppressions/tsan.txt:halt_on_error=0:report_signal_unsafe=0"
        run: |
          cargo +nightly nextest run --profile sanitizer \
            -p tst-core -p tst-pipeline \
            -p tst-rtp -p tst-udp -p tst-tcp -p tst-hls \
            --no-fail-fast \
            -Z build-std=std,panic_abort \
            --target x86_64-unknown-linux-gnu
