name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A stacked pull request (its base is another branch) gets no pull_request
  # run. Dispatch this workflow on its branch instead, naming the branch tip:
  #   gh workflow run ci.yml --ref <branch> -f sha="$(git rev-parse <branch>)"
  workflow_dispatch:
    inputs:
      sha:
        description: The full 40-hex commit to test; it must be the tip of the ref the run is dispatched on
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Every job either builds a crate that links vendored libsrt/librist (where
  # these force the vendored-cmake/meson path over the pkg-config probe) or
  # doesn't touch srt-sys/rist-sys at all (where the vars are simply inert) —
  # verified per-job before hoisting here from 17 duplicated step-level blocks.
  SRT_FORCE_VENDORED: "1"
  RIST_FORCE_VENDORED: "1"

jobs:
  # A run is recorded under the dispatched ref's tip (release-qualify reads ci
  # runs by head_sha), so a dispatch must test exactly that commit: the sha
  # input is the full 40-hex form and equals the tip. This job fails the run
  # otherwise; it is skipped on push and pull_request.
  dispatch-sha:
    name: the sha input is the full tip commit
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHA: ${{ inputs.sha }}
          TIP: ${{ github.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be the full 40-hex commit (got '$SHA'); use git rev-parse <ref>"; exit 2; }
          [ "$SHA" = "$TIP" ] || { echo "::error::sha $SHA is not the tip $TIP of ${GITHUB_REF}; dispatch on the branch whose tip it is"; exit 2; }

  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.continue }}
    # Backstop against a hung step. The job builds, lints and runs the rails;
    # the nextest passes run in the test-* jobs below, so a hung test no
    # longer counts against this budget.
    timeout-minutes: 45
    env:
      # Loopback multicast works on both Linux runners, so a multicast test
      # that skips there fails instead (tst_test_helpers::capability).
      TST_REQUIRE_MULTICAST: ${{ startsWith(matrix.name, 'linux-') && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # `phase` splits the slowest leg. Windows runs as two parallel legs
        # (measured 2026-10-02, run 37064257995, when the job still ran the
        # nextest passes): `default` = clippy + doc tests + the default build +
        # the tst-c per-feature builds; `features` = the no-default-features
        # and all-features builds. Everything else runs `all`. The nextest
        # passes run in the test-* jobs below.
        include:
          - name: linux-x86_64
            platform: linux-x86_64
            runner: ubuntu-latest
            continue: false
            phase: all
          - name: linux-aarch64
            platform: linux-aarch64
            runner: ubuntu-24.04-arm
            continue: false
            phase: all
          - name: macos-arm64
            platform: macos-arm64
            runner: macos-15
            continue: false
            phase: all
          - name: windows-msvc
            platform: windows-msvc
            runner: windows-latest
            continue: false
            phase: default
          - name: windows-msvc-features
            platform: windows-msvc
            runner: windows-latest
            continue: false
            phase: features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive

      - name: Name the capability-skip log
        # Every test that skips for a missing host capability appends a line
        # here; the last step lists them in the job summary. `runner.temp` is
        # not available to job-level env, hence the step.
        shell: bash
        run: echo "TST_CAPABILITY_LOG=$RUNNER_TEMP/capability-skips.txt" >> "$GITHUB_ENV"

      - uses: ./.github/actions/build-prereqs
        with:
          platform: ${{ matrix.platform }}
          abigail: ${{ matrix.name == 'linux-x86_64' }}

      - name: Rust toolchain, cargo-nextest, cargo cache
        # nextest: per-test `terminate-after` kills a hung test and keeps the
        # run going; the `network` group serialises loopback tests.
        uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy
          nextest: 'true'
          cache-key: cargo-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          cache-restore-key: cargo-${{ matrix.name }}-

      - name: Scrub guard (no pre-rename names in tree)
        # Fails the build if any pre-rename name (`srt-core`, `srt-rust`,
        # `srt-c`, `TsSender`, `TsReceiver`) or internal codeword (`v0`)
        # leaks into the published tree. The ignored maintainer notes
        # file is the one exception (glob below); vendor/, target/,
        # and Cargo.lock are excluded. `rg` is installed in the Linux
        # prerequisites step above (the GHA image no longer ships it).
        # Linux-only — rg / bash invocation differs on Windows and this is
        # a workspace-state check, so running it once is enough.
        if: matrix.name == 'linux-x86_64'
        run: |
          if rg 'srt[_-]core|srt[_-]rust|\bsrt[_-]c\b|TsSender|TsReceiver|\bv0\b' \
              --glob '!target' --glob '!CLAUDE.md' \
              --glob '!**/Cargo.lock' --glob '!vendor'; then
            echo "Pre-rename name regression detected" >&2
            exit 1
          fi

      - name: Scrub guard — sensitive denylist (supplied out-of-tree)
        # Enforces a denylist of sensitive private-corpus identifiers
        # (aircraft tail numbers, capture IDs) supplied via the SCRUB_DENYLIST
        # repo secret, so the tokens themselves never live in this public repo.
        # The secret value is a ripgrep alternation, e.g. 'AAA|BBB|CCC'. The
        # step is a no-op when the secret is unset (e.g. fork PRs). `rg -q`
        # prints nothing on a match, so a hit never echoes the token into the
        # build log — and GitHub masks registered secret values regardless.
        # Populate via: Settings → Secrets and variables → Actions → New
        # repository secret → SCRUB_DENYLIST.
        #
        # Fails CLOSED: branch on ripgrep's exit code so a malformed regex
        # (rg exit 2) reds the build instead of silently disabling the guard.
        # 0 = match → fail; 1 = clean → pass; anything else = error → fail.
        # `|| rc=$?` keeps the non-match/error path from tripping `set -e`.
        if: matrix.name == 'linux-x86_64'
        env:
          SCRUB_DENYLIST: ${{ secrets.SCRUB_DENYLIST }}
        run: |
          if [ -z "$SCRUB_DENYLIST" ]; then
            echo "note: SCRUB_DENYLIST unset — denylist guard inactive" >&2
            exit 0
          fi
          rc=0
          rg -q "$SCRUB_DENYLIST" \
            --glob '!target' --glob '!CLAUDE.md' \
            --glob '!**/Cargo.lock' --glob '!vendor' || rc=$?
          case "$rc" in
            0) echo "Sensitive denylisted identifier detected in tree" >&2; exit 1 ;;
            1) : ;;
            *) echo "denylist scan errored (rc=$rc; malformed regex?) — failing closed" >&2; exit 1 ;;
          esac

      - name: No process markers in the published tree
        # Internal work-package, arc, wave, review and pull-request
        # identifiers, maintainer memory-file names and out-of-tree paths
        # must not appear in any tracked file except CHANGELOG.md (history).
        # Patterns live in the script; domain-sense exceptions in
        # scripts/ratchets/process-markers-allowlist.txt. Linux-only like the
        # scrub guards above: a workspace-state check, run once.
        if: matrix.name == 'linux-x86_64'
        env:
          NO_PROCESS_MARKERS_MODE: fail
        run: bash scripts/check/repo/no-process-markers.sh

      - name: No process markers — rail self-test
        # Plants every pattern and a set of domain phrases; proves the rail
        # detects the former and not the latter.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/no-process-markers-selftest.sh

      - name: Stress port table (reservations never repeat within a step)
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/stress-port-table.sh

      - name: Interop analyze counters (the tsanalyze verdict gates per-PID leaps)
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/interop-analyze-counters.sh

      - name: Interop publish generation (a post-EOS send failure is a clean end)
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/interop-publish-generation.sh

      - name: Interop subset (--only-subset reads its cells from expectations.toml)
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/interop-subset.sh

      - name: No stale relocated-away package paths
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/no-stale-relocated-paths.sh

      - name: publish-package-sanity ratchet
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/rust/publish-package-sanity.sh

      - name: api-stability-coverage ratchet
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/rust/api-stability-coverage.sh

      - name: Reference WHEP player unit tests (node)
        # docs/webrtc/whep-klv.js and whep-sei-extract.js are pure modules.
        # The browser cells (interop.yml) load the player only with its
        # de-duplication off, so the default path is covered here alone.
        # Node ships on the ubuntu-latest image; no setup step.
        if: matrix.name == 'linux-x86_64'
        # `ls` first: a glob that matches nothing makes node report 0
        # tests and exit 0.
        run: ls docs/webrtc/test/*.test.js >/dev/null && node --version && node --test 'docs/webrtc/test/*.test.js'

      - name: check-close-contract-presence
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/rust/close-contract-presence.sh

      - name: check-no-public-usize
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/rust/no-public-usize.sh

      - name: Kind-equivalence rail (C ≡ Python ≡ JVM per BindingErrorKind)
        # Generated == committed: the TSV and both hosts' kind-enum blocks are rendered from kind.rs by print-kinds --check.
        if: matrix.name == 'linux-x86_64'
        env:
          SRT_FORCE_VENDORED: "1"
          RIST_FORCE_VENDORED: "1"
        run: bash scripts/check/repo/kind-equivalence.sh
      - name: binding records (generated == committed)
        if: matrix.name == 'linux-x86_64'
        env:
          SRT_FORCE_VENDORED: "1"
          RIST_FORCE_VENDORED: "1"
        run: bash scripts/check/repo/binding-records.sh
      - name: URL key table (generated == committed)
        if: matrix.name == 'linux-x86_64'
        env:
          SRT_FORCE_VENDORED: "1"
          RIST_FORCE_VENDORED: "1"
        run: bash scripts/check/repo/url-keys.sh
      - name: Check no direct NotAvailable/NotFound casts
        run: bash scripts/check/c/no-direct-not-available-not-found-cast.sh

      - name: Check no slot-taking construction-constant getters in bindings
        # A getter that is constant after `_open` must read the handle's
        # snapshot, never the shell slot a parked recv/accept holds, so it
        # never blocks behind a parked call. Covers every binding under
        # bindings/. In the Python binding it also checks that no lock is
        # taken with the GIL held unless allowlisted in
        # scripts/ratchets/gil-held-locks.tsv.
        run: bash scripts/check/c/snapshot-getters.sh

      - name: Check extern C ffi_catch coverage
        # Every `pub unsafe
        # extern "C" fn` in bindings/c/core/src/ must isolate panics via
        # ffi_catch, Handle::with_inner_{mut,ref}, or be in the
        # trivially-infallible allowlist. Caught tst_demux_config_free
        # which had bypassed the lifecycle ratchet by being named
        # _free.
        # Linux-only: platform-independent source scan whose ffi_catch guard
        # uses GNU-grep `\s`, which BSD grep on macOS would mis-match.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/c/extern-c-ffi-catch-coverage.sh

      - name: Check doc ABI and ST 1910 currency
        # Fails on any non-current `ABI version 0.N` in README/docs/crate
        # docs (current = TST_ABI_VERSION_MINOR; an earlier regex was
        # hard-coded to 0.[0-4] and went blind above it),
        # on bare `ST 1910` mis-cites in README/crates (correct cite for
        # MPEG-TS Metadata_AU_cell is H.222.0 §2.12.4.2; `ST 1910.1` with the
        # .1 suffix is allowed everywhere since it's a distinct CMAF/HLS
        # standard), and on `receiver-surface ... pending` wording in tst-c
        # crate docs. Rule 4 (docs deep edit 2026-07-12) pins README /
        # languages/c.md / binding-authors.md current-version sites to the
        # source constants.
        run: bash scripts/check/repo/doc-abi-and-st1910-currency.sh

      - name: Check docs internal links
        # Docs deep-edit rail (2026-07-12) — every intra-repo markdown link
        # in README.md, docs/, and examples/ must resolve to an existing
        # file (guards the cookbook re-slug and future doc moves).
        run: bash scripts/check/repo/docs-internal-links.sh

      - name: check-ratchet-self-test (fail-closed ratchets detect gaps)
        # Validates that the fail-closed ratchets actually detect their
        # failure mode (the cases in scripts/ratchets/tests/self_test.sh). Gated to
        # linux-x86_64: the check is platform-independent (no signal from
        # other runners) and its synthetic-fixture bash is GNU-leaning.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/ratchet-self-test.sh

      - name: nightly-issue self-test (the issue script creates or comments)
        # Runs scripts/ci/nightly-issue.sh against a stub gh. Gated to
        # linux-x86_64: platform-independent, no signal from other runners.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/ci/tests/nightly-issue-selftest.sh

      - name: No duplicate test helpers
        # A Rust fn / Python def / Java private static body identical in two
        # or more test files fails unless listed, with a reason, in
        # scripts/ratchets/duplicate-test-helpers.tsv (exact both ways, so
        # the list only shrinks). Gated to linux-x86_64: a platform-
        # independent source scan.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/no-duplicate-test-helpers.sh

      - name: Check package-local test support copies
        # A package cannot include a file from a sibling package, so the
        # shared test bodies and build helpers are byte copies; this fails
        # when one drifts from its original. Gated to linux-x86_64: a
        # platform-independent source scan.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/test-support-copies.sh

      - name: Check Publisher trait C mirror
        # Plan A5a — every tst_core::publisher::Publisher trait method has a
        # corresponding tst_publisher_* C entry point in the generated header.
        # Linux-only: platform-independent source scan whose trait-method
        # grep uses GNU-grep `\s` (BSD grep on macOS matches 0 methods).
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/c/publisher-trait-mirror.sh

      - name: Check advisory test manifests (existence + format only)
        # tests/coverage/*.toml are well-formed and reference real, path-safe,
        # in-tree files. Not a coverage gate. Gated to linux-x86_64: a
        # platform-independent scan that parses the TOML with python3 >= 3.11.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/test-manifests.sh

      - name: check-skip-ledger-sync (ledger matches real #[ignore]s)
        # Every active Rust #[ignore] has a non-resolved skip-ledger entry and
        # vice-versa; placeholder/blocked_bug deferrals carry a future expiry.
        # Gated to linux-x86_64: the scan is platform-independent.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/skip-ledger-sync.sh

      - name: check-fixture-hashes (per-file SHA-256 closure)
        # Per-file SHA-256 closure over committed fixtures. Gated to linux-x86_64:
        # the hashes are platform-independent and sha256sum is GNU-only (absent on
        # the macOS runner).
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/fixture-hashes.sh

      - name: Check cross-binding scenario fixtures (generated golden drift)
        # Runs gen-scenarios --check to ensure committed fixture goldens match
        # what the current tst-core produces. Source-text + Rust check only;
        # gated to linux-x86_64 (cross-platform runners would add no signal
        # and the mux/demux output is platform-independent).
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/scenarios.sh

      - name: check-scenario-generator-privacy (synthetic-only)
        # Scans the scenario generator sources (comments stripped) for reads of
        # testfiles/ or any local/ corpus path. Gated to linux-x86_64 — source
        # scan is platform-independent.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/scenario-generator-privacy.sh

      - name: check-scenario-manifest (dup-id, unknown feature/kind, missing paths)
        # Validates scenarios.toml integrity: unique ids, known kinds, known
        # feature tokens, and resolvable input/golden paths. Gated to
        # linux-x86_64 — manifest + fixture paths are platform-independent.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/scenario-manifest.sh

      - name: check-surface-manifest (L3 closure + owning-test + binding-symbol + five columns)
        # Every mappable public-api.txt item is either mapped to an owning test
        # + binding columns, or explicitly exempted. Enforces closure so no new
        # public item ships un-catalogued, and (rule b2) that every
        # [[surface]] row carries all five binding columns — an absent twin is
        # spelled "<prefix>:deferred", never omitted. Gated to linux-x86_64 —
        # baselines are platform-independent.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/surface-manifest.sh

      - name: check-doc-tables (generated doc tables match ci.yml, sanitizers.yml, fuzz-targets.toml, Cargo features)
        # The build-target, sanitizer, fuzz and feature tables are written by
        # scripts/gen/doc-tables.sh; this fails when one drifts from its source.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/doc-tables.sh

      - name: check-qualification (the evidence page's qualification block matches docs/project/qualification.json)
        # The block is written by scripts/gen/qualification.sh from the committed
        # qualification.json. While no qualification.json is committed the step
        # SKIPs cleanly: it checks that the page says none is recorded, prints one
        # SKIP line and exits 0. It also validates tests/coverage/evidence-archives.toml.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/qualification.sh

      - name: check-publish-guards (callable workflows keep publish jobs behind dry_run; callers pass dry_run true)
        # The rail defaults to .github/workflows/*.yml; its self-test runs on
        # fixtures only, so this step is what enforces the rule on the real files.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/publish-guards.sh

      - name: check-roster-sync (workflow and rail lists agree with cargo metadata)
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/roster-sync.sh

      - name: check-net-test-binaries (socket-using test binaries are net_*)
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/net-test-binaries.sh

      - name: scripts/gen unit tests
        # The generators' stdlib unittest suites and their committed fixtures;
        # nothing else runs them. Stdlib only, no pip install.
        if: matrix.name == 'linux-x86_64'
        run: python3 -m unittest scripts/gen/test_*.py

      - name: check-no-unreachable-expect-in-bindings
        # Binding production code never aborts on a #[non_exhaustive]
        # wildcard or an .expect(); test tails / tests/ / build.rs excluded.
        # Kept beside the clippy deny: clippy 1.85 does not lint an
        # `.expect(` written inside a local macro_rules body, this rail does.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/no-unreachable-expect-in-bindings.sh

      - name: check-platform-capabilities (gate-sync + I4 promotion alarm)
        # Every test-level platform cfg-gate has a platform_skip entry; every
        # non-resolved blocked_bug has a future expires_after; every A-soft
        # capability has a future soft_until (lapse = intentional promotion
        # alarm). Gated to linux-x86_64 — manifest + date semantics are
        # platform-independent.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/platform-capabilities.sh

      - name: check-release-version-consistency (cross-source version + tag)
        # Every version source-of-truth (workspace/pyproject/tst-py
        # Cargo, C version constants + header, python version test) must agree.
        # This workflow runs only on push/PR to main (never on tags), so here
        # the rail enforces cross-source EQUALITY; the tag == source-version
        # enforcement lives in the release workflows (python-wheels.yml +
        # jvm-jar.yml), where GITHUB_REF_NAME is the v* tag. Gated to
        # linux-x86_64 — the sources are platform-independent.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/release-version-consistency.sh

      - name: check-msrv-consistency (one toolchain source, rust-toolchain.toml)
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/msrv-consistency.sh

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.phase != 'features'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The workspace clippy above builds tst-jni without its test-only
      # jni-test-hooks feature (the probes jvm-jar.yml's test step builds).
      - name: cargo clippy (tst-jni, jni-test-hooks)
        if: matrix.name == 'linux-x86_64'
        run: cargo clippy -p tst-jni --all-targets --features jni-test-hooks -- -D warnings

      - name: Lint fixtures (clippy rejects each planted violation)
        # The binding rules once kept by grep rails are clippy lints now;
        # this proves each one still fires. One platform is enough.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/rust/lint-fixtures.sh

      - name: Install nightly toolchain (for doc lints)
        # Required for the cargo doc step below. Stable rustdoc 1.85
        # silently misses `rustdoc::broken_intra_doc_links` patterns
        # that nightly catches; the `cargo public-api` step independently
        # uses nightly internally for `--output-format json` and was the
        # only thing surfacing broken-link warnings (and only as printed
        # stderr, not as failures). Investigated and switched 2026-05-25
        # — see commit `f0754dc` body for the full reproduction.
        # Linux-only, matches the cargo doc step's matrix guard.
        if: matrix.name == 'linux-x86_64'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly

      - name: cargo doc (no broken intra-doc links)
        # Linux-only — workspace-state check; running it 4× across the matrix
        # burns CI for zero added signal. Uses nightly rustdoc because the
        # stable broken-intra-doc-links lint undercounts (see preceding step
        # for context). nightly was already a project requirement (fuzz-smoke
        # job depends on it), so no new toolchain commitment.
        if: matrix.name == 'linux-x86_64'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo +nightly doc --workspace --no-deps --all-features

      - name: cargo test --doc
        if: matrix.phase != 'features'
        # Enabled on windows-msvc: the SRT-loopback hang did NOT reproduce on
        # the cl-built libsrt (diag_win_srt_close showed blocking recv wakes
        # on peer-close immediately, same as Linux), so the old "hangs on
        # Windows" deferral no longer applies. `timeout-minutes` bounds any
        # residual hang.
        timeout-minutes: 15
        run: cargo test --doc --workspace --no-fail-fast

      # `cargo test` only builds the rlib of crates with multiple crate-types,
      # so an explicit `cargo build` produces the cdylib + staticlib; the
      # test-* jobs restore this job's cache and rebuild tst-c per pass.
      - name: cargo build (all crate types, with mbedtls)
        if: matrix.phase != 'features'
        run: cargo build --workspace

      - name: cargo build (all crate types, no-default-features)
        if: matrix.phase != 'default'
        run: cargo build --workspace --no-default-features

      - name: Build tst-c per-feature (srt/rtp/udp/tcp/hls/rist) — catch single-feature breakage
        if: matrix.phase != 'features'
        # All six transport features are now default-off (opt-in), so the
        # default build above and the all-features build below don't exercise
        # each one in isolation. These explicit single-feature builds catch
        # cross-feature dep leakage (e.g., a udp path that accidentally
        # references srt) that would only surface at a consumer's `--features
        # <x>` build time. rtp/udp/tcp/hls are pure-Rust (no vendored C); srt
        # links vendored libsrt (unencrypted here — mbedtls is off under
        # --no-default-features); rist links vendored librist.
        #
        # MUST run BEFORE the all-features build below. Each `cargo build -p
        # tst-c --no-default-features` overwrites target/debug/libtstrans.{so,
        # dylib} with a partial-feature cdylib. If this step ran AFTER the
        # all-features build (as it did 2026-05-28, when A5a appended it there),
        # the later C steps in this job would link against the stripped cdylib
        # (`undefined reference to tst_muxer_open`). Keeping the all-features
        # build last re-syncs the cdylib to their feature set. The test suite
        # runs in the test-* jobs, which rebuild tst-c per pass.
        #
        # Each combo ALSO runs `clippy -D warnings`: the workspace clippy step
        # above lints default features only (all transports OFF), so a
        # tst-c-core body that only some families call is invisible to it —
        # 16 such bodies accumulated as `dead_code` warnings on every
        # single-feature build until the 2026-09-05 sweep. Check mode reuses
        # this combo's build-script outputs, so it costs seconds per combo.
        # `srt,rtp` is the historical default pairing (the committed header is
        # flavour-identical now); `tcp,hls,rtp,tls`
        # builds, lints and (nextest below) tests the C `tls` forwards
        # outside `--all-features`.
        # bash (not pwsh) so a failing combo stops the step on windows too.
        shell: bash
        run: |
          for feats in srt rtp udp tcp hls rist udp,tcp,hls,rist srt,rtp tcp,hls,rtp,tls; do
            cargo build -p tst-c --no-default-features --features "$feats"
            # Scope EVERY feature to tst-c (`a,b` -> `tst-c/a,tst-c/b`): with
            # two -p packages a bare name would apply to both, and tst-c's
            # features forward to tst-c-core's anyway.
            cargo clippy -p tst-c -p tst-c-core --all-targets --no-default-features \
              --features "tst-c/${feats//,/,tst-c/}" -- -D warnings
            # The tcps:// loopback test otherwise runs only under
            # --all-features; run it in the flavour that ships the C tls forwards.
            if [ "$feats" = "tcp,hls,rtp,tls" ]; then
              cargo nextest run -p tst-c --no-default-features --features "$feats" \
                --test net_transports --no-fail-fast
            fi
            # The mbedtls-off refusal test (rist_recv_open_aes256_is_refused_without_mbedtls)
            # compiles only in a build without mbedtls, and no other job runs that flavour.
            if [ "$feats" = "rist" ]; then
              cargo nextest run -p tst-c --no-default-features --features "$feats" \
                --test net_transports -E 'test(rist_recv_open_aes256)' --no-fail-fast
            fi
          done

      - name: cargo build (all crate types, all-features)
        if: matrix.phase != 'default'
        # `cargo test` only rebuilds the rlib of crates with multiple
        # crate-types, so the cdylib at target/debug/libtstrans.{so,dylib}
        # is whatever the LAST explicit `cargo build` left it — which is the
        # per-feature --no-default-features build above. Anything that links
        # against it then fails ("undefined reference to tst_muxer_open"
        # / "Undefined symbols for architecture arm64: _tst_sender_close").
        # Surfaced 2026-05-26 on macos-arm64 (`26479673047`) and 2026-05-28
        # across the whole matrix after A5a added the per-feature step. This
        # build MUST stay the last cdylib-producing build before the C steps
        # below; the test suite runs in the test-* jobs.
        run: cargo build --workspace --all-features

      - name: abi-compat self-test (abidiff verdicts on fixture libraries)
        # abi-compat.sh itself runs in the c-abi job; this exercises its
        # verdicts on small compiled fixtures. ratchet-self-test.sh runs it
        # too; the repeat costs a few seconds and keeps this step visible.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/c/tests/abi-compat-selftest.sh

      - name: check-c-abi-symbols
        # The exported symbol list (bindings/c/abi-symbols.txt) against a
        # staged all-features package, and against the previous release tag:
        # no name may disappear, none may appear without a minor bump. The tag
        # comparison reads the tag's header and library source, so fetch the
        # tags first (the checkout above is depth 1, no tags; depth 1 per tag
        # is far cheaper than a full history). linux-x86_64 only: the rail
        # reads an ELF dynamic table with GNU nm.
        if: matrix.name == 'linux-x86_64'
        run: |
          git fetch --tags --depth=1 origin
          bash scripts/check/c/abi-symbols.sh

      - name: C scenario adapter (cross-binding parity check)
        # C adapter for the cross-binding scenario harness. Compiles
        # bindings/c/examples/scenarios/run_scenarios.c against
        # a staged all-features libtstrans package (scripts/dev/c-package.sh).
        # Then runs the adapter against the committed goldens.
        #
        # Exit 0 = every scenario in scenarios.toml matched its committed
        # golden (C ABI parity); the URL-corpus kind is skipped here because
        # bindings/c/tests/net_url_corpus.rs runs it.
        # Exit non-zero = C adapter output diverged from a golden — signals a
        # real C-binding bug or a golden that needs regeneration via gen-scenarios.
        #
        # Linux-only: libtstrans.so is a Linux cdylib (macOS/Windows use dylib/dll);
        # gcc + LD_LIBRARY_PATH conventions are Linux-specific in this step.
        # The cross-binding signal (byte-level parity) is platform-independent —
        # one platform run is sufficient.
        if: matrix.name == 'linux-x86_64'
        run: |
          # Stage an all-features package so the header, config and library
          # come from one build (the target/debug copy can be stale).
          PKG="$RUNNER_TEMP/tstrans-pkg"
          bash scripts/dev/c-package.sh --all-features --out "$PKG"
          gcc \
            -I "$PKG/include" \
            -L "$PKG/lib" -Wl,-rpath,"$PKG/lib" \
            -Wall -Werror \
            -o /tmp/run_scenarios_c_adapter \
            bindings/c/examples/scenarios/run_scenarios.c \
            -ltstrans
          # `timeout 60` bounds the standalone C binary the way nextest's
          # terminate-after bounds the Rust tests — the C adapter is the one
          # test path that isn't a Rust test under nextest, so a hang here would
          # otherwise only be caught by the 75-min job cap.
          timeout 60 /tmp/run_scenarios_c_adapter \
            crates/tst-integration/tests/fixtures/scenarios

      - name: C examples compile (every bindings/c/examples/**/*.c links)
        # scripts/check/c/examples-compile.sh compiles + links every C
        # teaching example with the flags their headers document
        # (-Wall -Werror) against a package staged by scripts/dev/c-package.sh
        # (--all-features): header, tstrans_config.h and the library from one
        # build, whatever tst-c builds ran before. The committed
        # bindings/c/include/tstrans_config.h is the bare flavour and would
        # trip the udp/tcp/hls/rist examples' #error guards.
        # Until 2026-09-06 only the scenario adapter above was ever
        # compiled; a header change could silently break the other
        # examples. The package's cargo build is a warm no-op after the
        # all-features build above. Linux-only for the same reasons as the
        # scenario adapter step, which keeps compiling against target/debug
        # because it follows that build directly.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/c/examples-compile.sh

      - name: C package staging self-test (scripts/dev/c-package.sh)
        # Stages two packages (srt,rtp and all features) and checks each
        # one's header, config, libraries and hashes come from one build.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/dev/test_c_package.sh

      - name: crates.io rehearsal runner self-test (scripts/release/publish-crates-all.sh)
        # cargo is stubbed: checks the rehearsal walks the publish job's layers
        # in order as dry runs and refuses PUBLISH=1.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/release/test_publish_crates_all.sh

      - name: Previous C package verification self-test (scripts/dev/prev-c-library.sh)
        # gh is stubbed: a package whose digest or attestation fails is never
        # used for the ABI comparison.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/dev/test_prev_c_library.sh

      - name: Release attach self-test (release-qualify.yml attach step)
        # gh is stubbed: the attach step replaces assets only on a draft Release.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/release/test_attach_draft_only.sh

      - name: Public-API ratchet (no unintended SemVer breaks)
        # Checks every crate with a committed public-api.txt baseline
        # (scripts/lib/roster.sh public-api) against it. tst-c is excluded: its ABI surface is a
        # C cdylib tracked via tstrans.h (cbindgen); cargo-public-api cannot
        # handle the lib-name/package-name mismatch (lib name "tstrans" ≠
        # package name "tst-c"). To land an intentional SemVer-breaking
        # change, update the relevant crates/<name>/public-api.txt together
        # with the code change so reviewers can review the delta.
        # Linux-only — cargo-public-api is platform-agnostic but workspace
        # state is the same regardless of platform; one run is enough.
        if: matrix.name == 'linux-x86_64'
        run: |
          # PINNED nightly: cargo-public-api renders rustdoc JSON with this
          # toolchain; an unpinned `nightly` caused 4 false std::io<->core::io
          # baseline-drift incidents (2026-06/07) when the channel moved or a
          # local install rolled back. The explicit +nightly-2026-07-03 on the invocation below is what pins
          # cargo-public-api's internal rustdoc render — this job also carries a
          # rolling nightly (doc lints), so a bare +nightly would silently unpin.
          # To bump: pick a new date,
          # re-render all 11 baselines with it, and land both together.
          rustup toolchain install nightly-2026-07-03 --profile minimal --no-self-update
          cargo +stable install cargo-public-api --locked --quiet
          # Assigned first: a roster.sh failure inside the loop's command
          # substitution would otherwise leave an empty loop and a green step.
          pairs="$(bash scripts/lib/roster.sh public-api)"
          test "$(printf '%s\n' $pairs | grep -c .)" -eq 11 || { echo "public-api roster is not the 11 baselined crates: $pairs" >&2; exit 1; }
          # Each crate's declared feature envelope ([package.metadata.public-api]
          # in its Cargo.toml), so optional surfaces such as TLS are ratcheted.
          feats="$(bash scripts/lib/roster.sh public-api-features)"
          for pair in $pairs; do
            pkg="${pair%%:*}"
            dir="${pair##*:}"
            feat="$(printf '%s\n' "$feats" | awk -F'\t' -v p="$pkg" '$1 == p {print $2}')"
            test -n "$feat" || { echo "no public-api-features row for $pkg" >&2; exit 1; }
            fargs=()
            [ "$feat" = "-" ] || fargs=(--features "$feat")
            SRT_FORCE_VENDORED=1 RIST_FORCE_VENDORED=1 cargo +nightly-2026-07-03 public-api -p $pkg "${fargs[@]}" --simplified > /tmp/public-api-current-$pkg.txt
            if ! diff -u $dir/public-api.txt /tmp/public-api-current-$pkg.txt; then
              echo "Public API drift in $pkg. Update $dir/public-api.txt or revert the change." >&2
              exit 1
            fi
          done
          # The optional TLS items must be in the baselines, not only in a render.
          rg -q 'pub mod tst_core::net::tls' crates/tst-core/public-api.txt || { echo "tst-core baseline lacks the tls surface" >&2; exit 1; }
          rg -q 'tls_root_certs' crates/tst-rtp/public-api.txt || { echo "tst-rtp baseline lacks the rtsp-server-tls surface" >&2; exit 1; }

      - name: non_exhaustive sweep guard
        # This CI step asserts the count of every #[non_exhaustive] attribute
        # never decreases (additions OK; removals fail the build). On
        # adding a new one, bump the BASELINE constant.
        if: matrix.name == 'linux-x86_64'
        run: |
          # 313->314 (2026-09-02): phantom doc-comment mention of
          # #[non_exhaustive] in managed.rs's convert_recv_end_reason doc
          # (introduced by e5659b97) — not a real new attribute.
          # 314->186 (2026-09-08): the regex is now ANCHORED to the attribute
          # position (`^\s*#\[non_exhaustive\]`). The old bare pattern also
          # counted every comment/doc mention of the attribute — 128 phantom
          # lines across ~47 files that drifted the baseline on doc edits
          # (the 313->314 bump above was one). 186 is the real attribute
          # count, measured fresh on this tree.
          # 187->189 (2026-09-22): tst_pipeline::binding::owned::HandleState
          # and tst_pipeline::binding::kind::BindingErrorKind.
          # 189->193 (2026-10-08): tst_rtp RTSP publisher role —
          # ClockAlignment, PublishShape, PublishMountStats, PublisherInfo.
          # 193->189 (2026-10-15): phase 5 removed UdpErrorKind, TcpErrorKind,
          # RistErrorKind and HlsErrorKind.
          # 189->191 (2026-10-15): +EndReason, +TlsLoadError, +packet::Chunk,
          # +binding::Domain; -RecvEndReason, -StreamEndReason (merged into
          # EndReason). The depay types and Av1CarriageMode moved with theirs.
          # 191->193 (2026-10-16): +binding::Diagnostics, +binding::view::BlockingReason,
          # +binding::Opened; -MuxErrorKind (now exhaustive, matched by the bindings).
          # 193->195 (2026-10-16): +binding_schema::FieldMark and the
          # #[non_exhaustive] record in crates/tst-core/tests/binding_schema.rs
          # (a deliberate fixture that tests the non_exhaustive flag).
          # 195->196 (2026-10-16): +RichFixture, the print-records emitter-test fixture in
          # crates/tst-binding-gen/tests/print_records_emit.rs (a deliberate #[non_exhaustive] fixture).
          # 196->197 (2026-10-17): +NativeFixture, the native-class emitter-test fixture in the same
          # file (exercises the read-by-name path of a #[non_exhaustive] record); the 36 record
          # attributes that moved inside binding_record! invocations are the same attributes, re-indented.
          # 197->194 (2026-10-17): -UdpUrlError, -TcpUrlError, -RistUrlError, -HlsUrlError (the four
          # small transports report URL errors through tst_core::url::UrlError); +url::query::QueryKey
          # (hidden). The renamed enums/structs keep their attribute.
          # 194->195 (2026-10-19): +KlvPlacementMetrics, the KLV placement oracle's report block.
          # 195->196 (2026-10-19): +report::soak::MemoryGate, the soak's declared launch-time memory gate.
          # 196->202 (2026-10-19): the new tst-webrtc crate's WhepServerError, PushError,
          # MountKind, AudioPolicy, KlvCarriage and MountConfig.
          # 202->203 (2026-10-19): +tst-webrtc sei::KlvSei.
          # 203->207 (2026-10-19): +tst-webrtc stats::{MountStats, ServerStats, SessionStats, IceState}.
          BASELINE=207
          OBSERVED=$(rg -c '^\s*#\[non_exhaustive\]' crates/ bindings/ --type rust | awk -F: '{sum += $2} END {print sum}')
          if [ "$OBSERVED" -lt "$BASELINE" ]; then
            echo "non_exhaustive count regressed: expected >= $BASELINE, observed $OBSERVED" >&2
            exit 1
          fi
          echo "non_exhaustive count: $OBSERVED (baseline $BASELINE)"

      - name: List the capability skips
        if: always()
        shell: bash
        run: |
          {
            echo "### Capability skips (${{ matrix.name }})"
            if [ -s "$TST_CAPABILITY_LOG" ]; then
              echo
              echo '| count | capability | test | reason |'
              echo '| --- | --- | --- | --- |'
              # One line per skip per nextest pass; count the repeats.
              sort "$TST_CAPABILITY_LOG" | uniq -c | while read -r n line; do
                IFS=$'\t' read -r cap test why <<<"$line"
                echo "| $n | $cap | \`$test\` | ${why//|/\\|} |"
              done
            else
              echo
              echo 'None.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test-linux:
    name: test (${{ matrix.name }}, ${{ matrix.pass }}, ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # Loopback multicast works on both Linux runners, so a multicast test
      # that skips there fails instead (tst_test_helpers::capability).
      TST_REQUIRE_MULTICAST: ${{ startsWith(matrix.name, 'linux-') && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Each include object attaches to the combinations whose axis values it
        # repeats (here `pass`) and adds the rest; none sets `shard`, so each
        # lands on every shard. With `shard` as the only axis every object
        # would match every combination and the last one would overwrite the
        # others, collapsing the jobs to one pass.
        shard: [1, 2, 3]
        pass: [default, no-default, all-features]
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            pass: default
            flags: ''
          - name: linux-x86_64
            runner: ubuntu-latest
            pass: no-default
            flags: --no-default-features
          - name: linux-x86_64
            runner: ubuntu-latest
            pass: all-features
            flags: --all-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive

      - name: Name the capability-skip log
        shell: bash
        run: echo "TST_CAPABILITY_LOG=$RUNNER_TEMP/capability-skips.txt" >> "$GITHUB_ENV"

      - uses: ./.github/actions/build-prereqs
        with:
          platform: ${{ matrix.name }}

      - name: Rust toolchain, cargo-nextest, cargo cache (restore only)
        # The key equals the build job's key for this platform, so the restore
        # hits what that job saved on an earlier run (the shards run alongside
        # `build`); the shards never save. rustfmt backs the "generated Rust
        # parses" checks in tst-binding-gen, which pass vacuously without it.
        uses: ./.github/actions/rust-setup
        with:
          components: rustfmt
          nextest: 'true'
          cache-save: 'false'
          cache-key: cargo-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          cache-restore-key: cargo-${{ matrix.name }}-

      - name: Build the C library for this pass's feature set
        # bindings/c/tests/abi/{has_feature,smoke}.rs load target/debug/libtstrans.*
        # and assert its TST_HAS_* set; the restored cache holds whichever cdylib
        # the build job wrote last.
        run: cargo build -p tst-c ${{ matrix.flags }}

      - name: Compile the tests
        # Builds the test binaries first, so the next step's timeout covers
        # the test run only.
        run: cargo nextest run --workspace ${{ matrix.flags }} --no-run

      - name: cargo test (${{ matrix.pass }}, shard ${{ matrix.shard }}/3)
        # Runs under nextest: per-test `terminate-after` (.config/nextest.toml)
        # kills any hung test and keeps going, and the `network` test-group
        # serialises loopback tests within the shard.
        timeout-minutes: 20
        run: cargo nextest run --workspace ${{ matrix.flags }} --no-fail-fast --partition hash:${{ matrix.shard }}/3

      - name: List the capability skips
        if: always()
        shell: bash
        run: |
          {
            echo "### Capability skips (${{ matrix.name }}, ${{ matrix.pass }}, ${{ matrix.shard }}/3)"
            if [ -s "$TST_CAPABILITY_LOG" ]; then
              echo
              echo '| count | capability | test | reason |'
              echo '| --- | --- | --- | --- |'
              # One line per skip; count any repeats.
              sort "$TST_CAPABILITY_LOG" | uniq -c | while read -r n line; do
                IFS=$'\t' read -r cap test why <<<"$line"
                echo "| $n | $cap | \`$test\` | ${why//|/\\|} |"
              done
            else
              echo
              echo 'None.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

