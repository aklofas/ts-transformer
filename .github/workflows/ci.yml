name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Every job either builds a crate that links vendored libsrt/librist (where
  # these force the vendored-cmake/meson path over the pkg-config probe) or
  # doesn't touch srt-sys/rist-sys at all (where the vars are simply inert) —
  # verified per-job before hoisting here from 17 duplicated step-level blocks.
  SRT_FORCE_VENDORED: "1"
  RIST_FORCE_VENDORED: "1"

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.continue }}
    # Backstop against a hung test (no test should be able to block CI
    # indefinitely). A healthy build job is ~33 min on x86_64; this caps a
    # deadlocked network/loopback test instead of letting it burn the
    # 6-hour default — on 2026-05-28 a hang ran linux-aarch64 for 235 min
    # before the runner killed it. Tune down once aarch64 has a green baseline.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            continue: false
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            continue: false
          - name: macos-arm64
            runner: macos-14
            continue: false
          - name: windows-msvc
            runner: windows-latest
            continue: false
    # Pin to MSRV via env so rust-toolchain.toml ("stable" for local dev)
    # doesn't relax the verification done in CI.
    env:
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build prerequisites (Linux)
        # apt-get is Linux-only; macOS / Windows runners come with cmake +
        # perl pre-installed (macos-14, windows-latest) and pkg-config is
        # absent on both but the build falls through to vendored via
        # SRT_FORCE_VENDORED=1.
        if: startsWith(matrix.name, 'linux-')
        run: |
          # -o Acquire::Retries=5: ride out transient mirror outages (the
          # ports.ubuntu.com linux-aarch64 class, 2026-07-16) instead of
          # failing the job on the first fetch error.
          sudo apt-get -o Acquire::Retries=5 update
          # ripgrep (`rg`) backs the two scrub-guard steps below; the GHA
          # ubuntu image no longer ships it preinstalled, so install it
          # explicitly (a missing `rg` made the denylist guard fail closed
          # and silently no-op'd the pre-rename guard).
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build ripgrep

      - name: Install build prerequisites (macOS)
        # librist's vendored build is meson-driven and needs `meson` + `ninja`
        # on PATH; cmake is pre-installed. ripgrep backs
        # scripts/check/c/no-direct-not-available-not-found-cast.sh (fails closed if `rg`
        # is missing). Install only what's absent: `ninja` (and sometimes others)
        # is now pre-installed on the macos-14 image, and `brew install` on an
        # already-present formula emits a `::warning::` — guard with `brew list`
        # to keep the log clean.
        if: matrix.name == 'macos-arm64'
        run: |
          # The macos-14 image ships a pre-tapped third-party `aws/tap`, and
          # Homebrew 6 requires explicit tap trust: until it is untapped every
          # brew call prints a `::warning::` annotation about it. Nothing here
          # uses that tap. (Observed 2026-09-05; drop when the image stops
          # shipping it.)
          brew untap aws/tap >/dev/null 2>&1 || true
          for pkg in meson ninja ripgrep; do
            brew list --formula "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Install build prerequisites (Windows)
        # Same meson + ninja requirement as macOS. windows-latest ships cmake
        # + MSVC + Strawberry Perl. ninja + ripgrep install via choco and land
        # on PATH for the running job. meson, however, must come via pip: the
        # choco meson package runs an MSI that updates only the *registry* PATH,
        # which the already-running job never re-reads — so a later step's
        # rist-sys build.rs couldn't find `meson` on $PATH and panicked (CI red
        # 2026-05-29). pip drops meson.exe into the Python Scripts dir that is
        # already on PATH, sidestepping the MSI PATH-refresh problem entirely.
        if: matrix.name == 'windows-msvc'
        # Run under bash with `set -euo pipefail`, NOT the default pwsh. pwsh
        # only checks the LAST command's exit code, so a choco failure followed
        # by a successful `pip install` was marked success — and choco can even
        # exit 0 when a package fetch 504s (community feed flake, CI red
        # 2026-06-08: ripgrep silently not installed, only caught downstream by
        # the fail-closed ratchet). bash `set -e` fails fast on a non-zero
        # command; the explicit per-tool `command -v` check below additionally
        # catches choco's exit-0-but-didn't-install case (which `set -e` alone
        # would miss).
        shell: bash
        run: |
          set -euo pipefail
          # pkgconfiglite provides pkg-config so librist's meson can find the
          # shared crates/mbedtls-src/vendor/mbedtls 3.6.x tree via
          # PKG_CONFIG_PATH (rist-sys build.rs) instead of falling back to its
          # bundled contrib/mbedtls 2.26.0 — a version mismatch with libsrt's
          # mbedTLS would corrupt shared state.
          choco install -y --no-progress ninja ripgrep pkgconfiglite
          python -m pip install --upgrade meson
          # Verify each prerequisite is actually on PATH — choco can return 0
          # without installing a package (feed 504), and a silently-missing tool
          # must red THIS step, not a confusing later one.
          for tool in rg ninja meson pkg-config; do
            command -v "$tool" >/dev/null 2>&1 || { echo "FAIL: '$tool' not on PATH after prereq install (choco/pip fetch likely failed)"; exit 1; }
          done
          rg --version | head -1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: rustfmt, clippy

      - name: Install cargo-nextest
        # All runtime test steps run under nextest (not `cargo test`): per-test
        # `terminate-after` (.config/nextest.toml) kills any hung test and
        # continues the run — a single hung network test can't stall the job and
        # all failures surface in one run — while the `network` test-group caps
        # loopback tests to one-at-a-time so they don't contend (the rest of the
        # suite still runs fully parallel). Prebuilt binary, all OSes.
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache cargo + cmake artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
            !target/debug/.fingerprint
            !target/debug/deps
          key: cargo-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.name }}-

      - name: Scrub guard (no pre-rename names in tree)
        # Fails the build if any pre-rename name (`srt-core`, `srt-rust`,
        # `srt-c`, `TsSender`, `TsReceiver`) or internal codeword (`v0`)
        # leaks into the published tree. CLAUDE.md is the documented
        # exception (per the repo-standalone guardrail); vendor/, target/,
        # and Cargo.lock are excluded. `rg` is installed in the Linux
        # prerequisites step above (the GHA image no longer ships it).
        # Linux-only — rg / bash invocation differs on Windows and this is
        # a workspace-state check, so running it once is enough.
        if: matrix.name == 'linux-x86_64'
        run: |
          if rg 'srt[_-]core|srt[_-]rust|\bsrt[_-]c\b|TsSender|TsReceiver|\bv0\b' \
              --glob '!target' --glob '!CLAUDE.md' \
              --glob '!**/Cargo.lock' --glob '!vendor'; then
            echo "Pre-rename name regression detected" >&2
            exit 1
          fi

      - name: Scrub guard — sensitive denylist (supplied out-of-tree)
        # Enforces a denylist of sensitive private-corpus identifiers
        # (aircraft tail numbers, capture IDs) supplied via the SCRUB_DENYLIST
        # repo secret, so the tokens themselves never live in this public repo.
        # The secret value is a ripgrep alternation, e.g. 'AAA|BBB|CCC'. The
        # step is a no-op when the secret is unset (e.g. fork PRs). `rg -q`
        # prints nothing on a match, so a hit never echoes the token into the
        # build log — and GitHub masks registered secret values regardless.
        # Populate via: Settings → Secrets and variables → Actions → New
        # repository secret → SCRUB_DENYLIST.
        #
        # Fails CLOSED: branch on ripgrep's exit code so a malformed regex
        # (rg exit 2) reds the build instead of silently disabling the guard.
        # 0 = match → fail; 1 = clean → pass; anything else = error → fail.
        # `|| rc=$?` keeps the non-match/error path from tripping `set -e`.
        if: matrix.name == 'linux-x86_64'
        env:
          SCRUB_DENYLIST: ${{ secrets.SCRUB_DENYLIST }}
        run: |
          if [ -z "$SCRUB_DENYLIST" ]; then
            echo "note: SCRUB_DENYLIST unset — denylist guard inactive" >&2
            exit 0
          fi
          rc=0
          rg -q "$SCRUB_DENYLIST" \
            --glob '!target' --glob '!CLAUDE.md' \
            --glob '!**/Cargo.lock' --glob '!vendor' || rc=$?
          case "$rc" in
            0) echo "Sensitive denylisted identifier detected in tree" >&2; exit 1 ;;
            1) : ;;
            *) echo "denylist scan errored (rc=$rc; malformed regex?) — failing closed" >&2; exit 1 ;;
          esac

      - name: check-c-abi-rustdoc-coverage
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/c/abi-rustdoc-coverage.sh

      - name: No stale relocated-away package paths
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/no-stale-relocated-paths.sh

      - name: publish-package-sanity ratchet
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/rust/publish-package-sanity.sh

      - name: api-stability-coverage ratchet
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/rust/api-stability-coverage.sh

      - name: check-close-contract-presence
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/rust/close-contract-presence.sh

      - name: check-no-public-usize
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/rust/no-public-usize.sh

      - name: ShellErrorKind coverage at C ABI
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/rust/shell-error-kind-coverage.sh
      - name: Pipeline kind-classification coverage
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/rust/pipeline-kind-classification.sh
      - name: Raw C mapper variant coverage
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/c/raw-mapper-coverage.sh
      - name: MuxError::kind() variant coverage
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/rust/mux-error-kind-coverage.sh
      - name: No srt_*/SRT_* symbol leak in libtstrans.so
        # Plan B Wave 5.B ratchet — fails if libtstrans.so's dynamic
        # export table contains any srt_*/SRT_* symbols (defense in depth
        # alongside the symbol_audit.rs Rust-side check). Linux-only
        # (uses GNU nm).
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/c/no-srt-symbol-leak.sh

      - name: Check C header section uniqueness
        run: bash scripts/check/c/header-section-uniqueness.sh

      - name: Check no direct NotAvailable/NotFound casts
        run: bash scripts/check/c/no-direct-not-available-not-found-cast.sh

      - name: Check no direct from_raw_parts in C bindings
        run: bash scripts/check/c/no-direct-from-raw-parts.sh

      - name: Check lifecycle ffi_catch coverage
        # Linux-only: scans platform-independent Rust source under
        # bindings/c/core/src/ with GNU-grep `\w`/`\b`. BSD grep on the
        # macOS runner matches 0 entries and trips the script's own
        # "pattern drifted" guard — a gating flake, not a real signal.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/c/lifecycle-ffi-catch-coverage.sh

      - name: Check extern C ffi_catch coverage
        # Superset of the lifecycle check above: every `pub unsafe
        # extern "C" fn` in bindings/c/core/src/ must isolate panics via
        # ffi_catch, Handle::with_inner_{mut,ref}, or be in the
        # trivially-infallible allowlist. Caught tst_demux_config_free
        # which had bypassed the lifecycle ratchet by being named
        # _free (plan #96 Wave F finding #9).
        # Linux-only (same rationale as the lifecycle check above):
        # platform-independent source scan whose ffi_catch guard uses
        # GNU-grep `\s`, which BSD grep on macOS would mis-match.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/c/extern-c-ffi-catch-coverage.sh

      - name: Check C header mirror-enum export
        # Catches Tst* enums declared in bindings/c/core/src/ but missing
        # from cbindgen.toml [export] include allowlist — silently
        # dropped from the generated header (regression bug 2026-05-24
        # CFI tolerance: TstCellFragmentIndication was defined but
        # never exported, so C callers had no constants).
        run: bash scripts/check/c/header-mirror-enum-export.sh

      - name: Check doc ABI and ST 1910 currency
        # Plan #96 Wave D ratchet — fails on stale `ABI version 0.[0-3]`
        # in README/docs/crate docs, on bare `ST 1910` mis-cites in
        # README/crates (correct cite for MPEG-TS Metadata_AU_cell is
        # H.222.0 §2.12.4.2; `ST 1910.1` with the .1 suffix is allowed
        # everywhere since it's a distinct CMAF/HLS standard), and on
        # `receiver-surface ... pending` wording in tst-c crate docs.
        # Rule 4 (docs deep edit 2026-07-12) pins README / languages/c.md /
        # binding-authors.md current-version sites to the source constants.
        run: bash scripts/check/repo/doc-abi-and-st1910-currency.sh

      - name: Check docs internal links
        # Docs deep-edit rail (2026-07-12) — every intra-repo markdown link
        # in README.md, docs/, and examples/ must resolve to an existing
        # file (guards the cookbook re-slug and future doc moves).
        run: bash scripts/check/repo/docs-internal-links.sh

      - name: Check udp/tcp/hls/rist C ABI error-mapping coverage
        # Each tst-c transport family's *_error_to_code converter must
        # exhaustively map its upstream *ErrorKind (wildcard arm allowed only
        # because those enums are #[non_exhaustive]). Driven by
        # scripts/ratchets/error-mapping.tsv (consolidated from the former
        # per-protocol check-*-error-mapping-coverage.sh clones).
        run: bash scripts/check/rust/rust-error-mapping-coverage.sh

      - name: check-ratchet-self-test (coverage drivers detect gaps)
        # Validates the error-mapping coverage framework detects gaps. Gated to
        # linux-x86_64: the check is platform-independent (no signal from other
        # runners) and its synthetic-fixture bash is GNU-leaning.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/ratchet-self-test.sh

      - name: Check Publisher trait C mirror
        # Plan A5a — every tst_core::publisher::Publisher trait method has a
        # corresponding tst_publisher_* C entry point in the generated header.
        # Linux-only: platform-independent source scan whose trait-method
        # grep uses GNU-grep `\s` (BSD grep on macOS matches 0 methods).
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/c/publisher-trait-mirror.sh

      - name: Check advisory test manifests (existence + format only)
        # tests/coverage/*.toml are well-formed and reference real, path-safe,
        # in-tree files. Not a coverage gate.
        run: bash scripts/check/repo/test-manifests.sh

      - name: check-skip-ledger-sync (ledger matches real #[ignore]s)
        # Every active Rust #[ignore] has a non-resolved skip-ledger entry and
        # vice-versa; placeholder/blocked_bug deferrals carry a future expiry.
        # Gated to linux-x86_64: the scan is platform-independent.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/skip-ledger-sync.sh

      - name: check-fixture-hashes (per-file SHA-256 closure)
        # Per-file SHA-256 closure over committed fixtures. Gated to linux-x86_64:
        # the hashes are platform-independent and sha256sum is GNU-only (absent on
        # the macOS runner).
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/fixture-hashes.sh

      - name: Check cross-binding scenario fixtures (generated golden drift)
        # Runs gen-scenarios --check to ensure committed fixture goldens match
        # what the current tst-core produces. Source-text + Rust check only;
        # gated to linux-x86_64 (cross-platform runners would add no signal
        # and the mux/demux output is platform-independent).
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/scenarios.sh

      - name: check-scenario-generator-privacy (synthetic-only)
        # Scans the scenario generator sources (comments stripped) for reads of
        # testfiles/ or any local/ corpus path. Gated to linux-x86_64 — source
        # scan is platform-independent.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/scenario-generator-privacy.sh

      - name: check-scenario-manifest (dup-id, unknown feature/kind, missing paths)
        # Validates scenarios.toml integrity: unique ids, known kinds, known
        # feature tokens, and resolvable input/golden paths. Gated to
        # linux-x86_64 — manifest + fixture paths are platform-independent.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/scenario-manifest.sh

      - name: check-surface-manifest (L3 closure + owning-test + binding-symbol)
        # Every mappable public-api.txt item is either mapped to an owning test
        # + binding columns, or explicitly exempted. Enforces closure so no new
        # public item ships un-catalogued, and paves the java: parity gate for
        # tst-jni. Gated to linux-x86_64 — baselines are platform-independent.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/surface-manifest.sh

      - name: check-platform-capabilities (gate-sync + I4 promotion alarm)
        # Every test-level platform cfg-gate has a platform_skip entry; every
        # non-resolved blocked_bug has a future expires_after; every A-soft
        # capability has a future soft_until (lapse = intentional promotion
        # alarm). Gated to linux-x86_64 — manifest + date semantics are
        # platform-independent.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/platform-capabilities.sh

      - name: check-release-version-consistency (cross-source version + tag)
        # REL-01: every version source-of-truth (workspace/pyproject/tst-py
        # Cargo, C version constants + header, python version test) must agree.
        # This workflow runs only on push/PR to main (never on tags), so here
        # the rail enforces cross-source EQUALITY; the tag == source-version
        # enforcement lives in the release workflows (python-wheels.yml +
        # jvm-jar.yml), where GITHUB_REF_NAME is the v* tag. Self-test runs
        # first to prove the rail still catches its negatives. Gated to
        # linux-x86_64 — the sources are platform-independent.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/repo/release-version-consistency.sh --self-test && bash scripts/check/repo/release-version-consistency.sh

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install nightly toolchain (for doc lints)
        # Required for the cargo doc step below. Stable rustdoc 1.85
        # silently misses `rustdoc::broken_intra_doc_links` patterns
        # that nightly catches; the `cargo public-api` step independently
        # uses nightly internally for `--output-format json` and was the
        # only thing surfacing broken-link warnings (and only as printed
        # stderr, not as failures). Investigated and switched 2026-05-25
        # — see commit `f0754dc` body for the full reproduction.
        # Linux-only, matches the cargo doc step's matrix guard.
        if: matrix.name == 'linux-x86_64'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: cargo doc (no broken intra-doc links)
        # Linux-only — workspace-state check; running it 4× across the matrix
        # burns CI for zero added signal. Uses nightly rustdoc because the
        # stable broken-intra-doc-links lint undercounts (see preceding step
        # for context). nightly was already a project requirement (fuzz-smoke
        # job depends on it), so no new toolchain commitment.
        if: matrix.name == 'linux-x86_64'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo +nightly doc --workspace --no-deps --all-features

      - name: cargo test --doc
        # Enabled on windows-msvc 2026-05-29: the plan #65 SRT-loopback hang
        # did NOT reproduce on the cl-built libsrt (diag_win_srt_close showed
        # blocking recv wakes on peer-close immediately, same as Linux), so the
        # old "hangs on Windows" deferral no longer applies. `timeout-minutes`
        # bounds any residual hang (windows-msvc is gating as of 2026-05-30
        # after a multi-run green streak).
        timeout-minutes: 15
        run: cargo test --doc --workspace --no-fail-fast

      # `cargo test` only builds the rlib of crates with multiple crate-types.
      # tst-c's smoke test asserts on target/debug/libtstrans.so, so we need an
      # explicit `cargo build` to produce the cdylib + staticlib first.
      - name: cargo build (all crate types, with mbedtls)
        run: cargo build --workspace

      - name: cargo test (default features, with mbedtls)
        # Runs under nextest (all platforms): per-test `terminate-after`
        # (.config/nextest.toml) kills any hung test and keeps going — one hang
        # can't stall the job and every failure surfaces in one run — while the
        # `network` test-group serialises loopback tests so they don't contend.
        # --no-fail-fast = run all tests. timeout-minutes is a coarse backstop.
        timeout-minutes: 20
        run: cargo nextest run --workspace --no-fail-fast

      - name: cargo build (all crate types, no-default-features)
        run: cargo build --workspace --no-default-features

      - name: cargo test (no-default-features, no encryption)
        # Enabled on windows-msvc 2026-05-29 — see cargo test --doc comment above.
        timeout-minutes: 20
        run: cargo nextest run --workspace --no-default-features --no-fail-fast

      - name: Build tst-c per-feature (srt/rtp/udp/tcp/hls/rist) — catch single-feature breakage
        # All six transport features are now default-off (opt-in), so the
        # default build above and the all-features build below don't exercise
        # each one in isolation. These explicit single-feature builds catch
        # cross-feature dep leakage (e.g., a udp path that accidentally
        # references srt) that would only surface at a consumer's `--features
        # <x>` build time. rtp/udp/tcp/hls are pure-Rust (no vendored C); srt
        # links vendored libsrt (unencrypted here — mbedtls is off under
        # --no-default-features); rist links vendored librist.
        #
        # MUST run BEFORE the all-features build below. Each `cargo build -p
        # tst-c --no-default-features` overwrites target/debug/libtstrans.{so,
        # dylib} with a partial-feature cdylib. If this step ran AFTER the
        # all-features build (as it did 2026-05-28, when A5a appended it there),
        # the subsequent `cargo test --all-features` smoke test links smoke.c
        # against the stripped cdylib and fails with `undefined reference to
        # tst_muxer_open`. Keeping the all-features build last re-syncs the
        # cdylib to the test's feature set.
        #
        # Each combo ALSO runs `clippy -D warnings`: the workspace clippy step
        # above lints default features only (all transports OFF), so a
        # tst-c-core body that only some families call is invisible to it —
        # 16 such bodies accumulated as `dead_code` warnings on every
        # single-feature build until the 2026-09-05 sweep. Check mode reuses
        # this combo's build-script outputs, so it costs seconds per combo.
        # bash (not pwsh) so a failing combo stops the step on windows too.
        shell: bash
        run: |
          for feats in srt rtp udp tcp hls rist udp,tcp,hls,rist; do
            cargo build -p tst-c --no-default-features --features "$feats"
            # Scope EVERY feature to tst-c (`a,b` -> `tst-c/a,tst-c/b`): with
            # two -p packages a bare name would apply to both, and tst-c's
            # features forward to tst-c-core's anyway.
            cargo clippy -p tst-c -p tst-c-core --all-targets --no-default-features \
              --features "tst-c/${feats//,/,tst-c/}" -- -D warnings
          done

      - name: cargo build (all crate types, all-features)
        # `cargo test` only rebuilds the rlib of crates with multiple
        # crate-types, so the cdylib at target/debug/libtstrans.{so,dylib}
        # is whatever the LAST explicit `cargo build` left it — which is the
        # per-feature --no-default-features build above. tst-c's `smoke.rs`
        # test then re-links smoke.c against that stripped cdylib under the
        # --all-features run and fails ("undefined reference to tst_muxer_open"
        # / "Undefined symbols for architecture arm64: _tst_sender_close").
        # Surfaced 2026-05-26 on macos-arm64 (`26479673047`) and 2026-05-28
        # across the whole matrix after A5a added the per-feature step. This
        # build MUST stay the last cdylib-producing build before the test step.
        run: cargo build --workspace --all-features

      - name: cargo test (all features)
        # The default feature set no longer includes the transports
        # (srt/rtp/udp/tcp/hls/rist are all opt-in), so this rail is the
        # only one that exercises the full tst-c transport surface + its
        # integration tests (smoke.rs, the *_loopback / *_open_smoke suites,
        # header_drift) — the default-features run above now builds a
        # transport-less cdylib. This is the canonical "everything on" gate.
        # Enabled on windows-msvc 2026-05-29 — see cargo test --doc comment above.
        timeout-minutes: 20
        run: cargo nextest run --workspace --all-features --no-fail-fast

      - name: C scenario adapter (cross-binding parity check)
        # WS-5: C adapter for the cross-binding scenario harness. Compiles
        # bindings/c/examples/scenarios/run_scenarios.c against the
        # libtstrans.so produced by the "cargo build (all crate types,
        # all-features)" step above (the last cdylib-producing build; the
        # intervening "cargo test (all features)" step only rebuilds rlibs and
        # leaves the cdylib intact). tst_demuxer_* is unconditional (not
        # feature-gated), so any of the build steps would suffice, but this is
        # the freshest. Then runs the adapter against the committed goldens.
        #
        # Exit 0 = all 3 scenarios matched committed goldens (C ABI parity).
        # Exit non-zero = C adapter output diverged from a golden — signals a
        # real C-binding bug or a golden that needs regeneration via gen-scenarios.
        #
        # Linux-only: libtstrans.so is a Linux cdylib (macOS/Windows use dylib/dll);
        # gcc + LD_LIBRARY_PATH conventions are Linux-specific in this step.
        # The cross-binding signal (byte-level parity) is platform-independent —
        # one platform run is sufficient.
        if: matrix.name == 'linux-x86_64'
        run: |
          gcc \
            -I bindings/c/include \
            -L target/debug \
            -Wall -Werror \
            -o /tmp/run_scenarios_c_adapter \
            bindings/c/examples/scenarios/run_scenarios.c \
            -ltstrans
          # `timeout 60` bounds the standalone C binary the way nextest's
          # terminate-after bounds the Rust tests — the C adapter is the one
          # test path that isn't a Rust test under nextest, so a hang here would
          # otherwise only be caught by the 75-min job cap.
          LD_LIBRARY_PATH=target/debug timeout 60 /tmp/run_scenarios_c_adapter \
            crates/tst-integration/tests/fixtures/scenarios

      - name: C examples compile (every bindings/c/examples/**/*.c links)
        # scripts/check/c/examples-compile.sh compiles + links every C
        # teaching example with the flags their headers document
        # (-Wall -Werror) against the all-features cdylib and the header
        # cbindgen emitted for it (target/debug/include/tstrans.h — the
        # committed bindings/c/include/tstrans.h is the srt,rtp rendering
        # and would trip the udp/tcp/hls/rist examples' #error guards).
        # Until 2026-09-06 only the scenario adapter above was ever
        # compiled; a header change could silently break the other
        # examples. The script's own `cargo build -p tst-c --all-features`
        # is a warm no-op after the all-features build above. Linux-only
        # for the same reasons as the scenario adapter step.
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/check/c/examples-compile.sh

      - name: Public-API ratchet (no unintended SemVer breaks)
        # Checks tst-core, tst-pipeline, and tst-srt against the committed
        # public-api.txt baselines. tst-c is excluded: its ABI surface is a
        # C cdylib tracked via tstrans.h (cbindgen); cargo-public-api cannot
        # handle the lib-name/package-name mismatch (lib name "tstrans" ≠
        # package name "tst-c"). To land an intentional SemVer-breaking
        # change, update the relevant crates/<name>/public-api.txt together
        # with the code change so reviewers can audit the delta.
        # Linux-only — cargo-public-api is platform-agnostic but workspace
        # state is the same regardless of platform; one run is enough.
        if: matrix.name == 'linux-x86_64'
        run: |
          # PINNED nightly: cargo-public-api renders rustdoc JSON with this
          # toolchain; an unpinned `nightly` caused 4 false std::io<->core::io
          # baseline-drift incidents (2026-06/07) when the channel moved or a
          # local install rolled back. The explicit +nightly-2026-07-03 on the invocation below is what pins
          # cargo-public-api's internal rustdoc render — this job also carries a
          # rolling nightly (doc lints), so a bare +nightly would silently unpin.
          # To bump: pick a new date,
          # re-render all 10 baselines with it, and land both together.
          rustup toolchain install nightly-2026-07-03 --profile minimal --no-self-update
          cargo +stable install cargo-public-api --locked --quiet
          # pkg:dir pairs — the crates-io-packaging rename (tstrans-rist-sys,
          # tstrans-mbedtls-src) changed the PACKAGE name but not the crate's
          # on-disk DIRECTORY, so the baseline path (crates/<dir>/public-api.txt)
          # can't be derived from the package name alone.
          for pair in \
            tstrans-rist-sys:rist-sys \
            tstrans-mbedtls-src:mbedtls-src \
            tst-core:tst-core \
            tst-hls:tst-hls \
            tst-pipeline:tst-pipeline \
            tst-rist:tst-rist \
            tst-rtp:tst-rtp \
            tst-srt:tst-srt \
            tst-tcp:tst-tcp \
            tst-udp:tst-udp \
          ; do
            pkg="${pair%%:*}"
            dir="${pair##*:}"
            SRT_FORCE_VENDORED=1 RIST_FORCE_VENDORED=1 cargo +nightly-2026-07-03 public-api -p $pkg --simplified > /tmp/public-api-current-$pkg.txt
            if ! diff -u crates/$dir/public-api.txt /tmp/public-api-current-$pkg.txt; then
              echo "Public API drift in $pkg. Update crates/$dir/public-api.txt or revert the change." >&2
              exit 1
            fi
          done

      - name: non_exhaustive sweep guard
        # Phase 1.2 added #[non_exhaustive] to all public error enums. CI step
        # asserts the count never decreases (additions OK; removals fail the
        # build). On adding a new error enum, bump the BASELINE constant.
        if: matrix.name == 'linux-x86_64'
        run: |
          # 313->314 (2026-09-02): phantom doc-comment mention of
          # #[non_exhaustive] in managed.rs's convert_recv_end_reason doc
          # (introduced by e5659b97) — not a real new attribute.
          BASELINE=314
          OBSERVED=$(rg -c '#\[non_exhaustive\]' crates/ bindings/ --type rust | awk -F: '{sum += $2} END {print sum}')
          if [ "$OBSERVED" -lt "$BASELINE" ]; then
            echo "non_exhaustive count regressed: expected >= $BASELINE, observed $OBSERVED" >&2
            exit 1
          fi
          echo "non_exhaustive count: $OBSERVED (baseline $BASELINE)"

  test-linux-musl:
    name: test (linux-musl-x86_64, no-libsrt crates)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchain + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
            !target/debug/.fingerprint
            !target/debug/deps
          key: cargo-musl-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-musl-${{ runner.os }}-

      # tst-core + tst-pipeline are pure Rust crates (no libsrt link),
      # so rust-std-musl + rust-lld is sufficient — no musl-tools/musl-gcc
      # needed. tst-srt and tst-c are out of scope here: vendored libsrt
      # cmake build has glibc dependencies (NSS resolver, dynamic-load
      # paths) that don't come up clean under musl without a deeper
      # rework. Audit's call for a musl rail is satisfied by covering
      # the MPEG-TS+KLV+codec work; libsrt-bound crates ride a future
      # plan if musl-native libsrt support is requested.
      - name: cargo build (tst-core + tst-pipeline, musl)
        run: cargo build -p tst-core -p tst-pipeline --target x86_64-unknown-linux-musl

      - name: cargo test (tst-core + tst-pipeline, musl)
        run: cargo test -p tst-core -p tst-pipeline --target x86_64-unknown-linux-musl

  tst-rtp-client-only:
    name: test (tst-rtp client-only plane, linux-x86_64)
    runs-on: ubuntu-latest
    # The tokio-free client-only feature plane (`--no-default-features
    # --features tls`) is what the planned tst-uniffi mobile binding
    # consumes (the PR #151 `rtsp-server` gate). No other CI job compiles
    # these targets — every other leg builds tst-rtp with default
    # features (rtsp-server on) — so without this leg a client-only
    # compile break or a tokio leak into the client plane would ship
    # unnoticed.
    #
    # Deliberately checks out WITHOUT submodules: tst-rtp's dependency
    # graph (tst-core + tst-pipeline) contains no native -sys crates, so
    # nothing here needs the vendored libsrt/librist/mbedTLS trees — and
    # the leg stays immune to vendored-submodule host outages (the
    # 2026-08-08 code.videolan.org outage failed every submodule-cloning
    # job in checkout).
    env:
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Cache cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
            !target/debug/.fingerprint
            !target/debug/deps
          key: cargo-rtp-client-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-rtp-client-${{ runner.os }}-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The invariant PR #151 established: a client-only build ships no
      # tokio (the server's runtime). Scoped to `-e normal` — tokio IS
      # present as a dev-dependency (the RTSP loopback test fixture runs
      # a tokio runtime), but dev-deps never reach consumers; the leak
      # this guards against is tokio re-entering the NORMAL tree.
      - name: Client-only dependency tree is tokio-free
        run: |
          if cargo tree -p tst-rtp --no-default-features --features tls -e normal -i tokio 2>/dev/null | grep -q "^tokio"; then
            echo "::error::tokio leaked into the client-only tst-rtp dependency tree"
            cargo tree -p tst-rtp --no-default-features --features tls -e normal -i tokio
            exit 1
          fi
          echo "client-only plane is tokio-free"

      - name: cargo nextest (tst-rtp, --no-default-features --features tls)
        run: cargo nextest run -p tst-rtp --no-default-features --features tls --no-fail-fast

      - name: cargo test --doc (tst-rtp, client-only)
        run: cargo test --doc -p tst-rtp --no-default-features --features tls

  no-std-baremetal:
    name: no_std bare-metal (compile + QEMU runtime)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchain + bare-metal targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          targets: thumbv7em-none-eabihf, riscv32imac-unknown-none-elf

      - name: Cache cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
            !target/debug/.fingerprint
            !target/debug/deps
            embedded/baremetal-qemu/target
            embedded/baremetal-qemu-c/target
            embedded/freertos-srt/example/host/target
          key: cargo-nostd-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'embedded/baremetal-qemu/Cargo.lock', 'embedded/baremetal-qemu-c/Cargo.lock', 'embedded/freertos-srt/example/host/Cargo.lock') }}
          restore-keys: cargo-nostd-${{ runner.os }}-

      # A `*-none-*` target has no std at all, so a successful library build
      # IS the no_std proof: any `use std::` or std-only dependency fails to
      # compile. Library builds need no #[global_allocator] (only final
      # binaries do). thumbv7em-none-eabihf = Cortex-M4F/M7F (STM32F4/F7/H7);
      # riscv32imac-unknown-none-elf proves the code is arch-agnostic no_std
      # (e.g. ESP32-P4 bare-metal). Mirrored locally by
      # embedded/scripts/check/no-std-baremetal.sh.
      - name: cargo build (tst-core, thumbv7em-none-eabihf)
        run: cargo build -p tst-core --no-default-features --target thumbv7em-none-eabihf

      - name: cargo build (tst-core, riscv32imac-unknown-none-elf)
        run: cargo build -p tst-core --no-default-features --target riscv32imac-unknown-none-elf

      - name: cargo build (tst-pipeline, thumbv7em-none-eabihf)
        run: cargo build -p tst-pipeline --no-default-features --target thumbv7em-none-eabihf

      - name: cargo build (tst-pipeline, riscv32imac-unknown-none-elf)
        run: cargo build -p tst-pipeline --no-default-features --target riscv32imac-unknown-none-elf

      - name: cargo build (tst-c-core offline C-ABI core rlib, thumbv7em-none-eabihf)
        run: cargo build -p tst-c-core --no-default-features --target thumbv7em-none-eabihf

      - name: cargo build (tst-c-core offline C-ABI core rlib, riscv32imac-unknown-none-elf)
        run: cargo build -p tst-c-core --no-default-features --target riscv32imac-unknown-none-elf

      # gcc-arm-none-eabi already bundles the C++ cross-compiler (arm-none-eabi-g++);
      # there is no standalone g++-arm-none-eabi apt package. libstdc++-arm-none-eabi-newlib
      # adds the bare-metal C++ standard library needed by the S0 exceptions gate.
      # qemu-system-misc ships qemu-system-riscv32 (the ARM binary lives in the
      # separate qemu-system-arm package, installed alongside it here).
      - name: Install QEMU + ARM C cross-toolchain
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y qemu-system-arm qemu-system-misc gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      # Runtime gate: run the tst-core muxer + tst-pipeline shells on both a
      # Cortex-M4 (QEMU mps2-an386) and RISC-V (QEMU virt) core and assert
      # each byte-matches the committed video-roundtrip golden. The script
      # builds --release --locked outside a 60 s QEMU-only timeout per arch
      # (so the build step itself does not race the timer), fails closed on
      # missing tools. See embedded/baremetal-qemu/ + the design spec.
      - name: QEMU runtime smoke (baremetal-qemu, ARM + RISC-V)
        env: { QEMU_RUNTIME_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/qemu-runtime.sh

      # Runtime gate: build the C-firmware (libtstrans_firmware.a no_std glue
      # staticlib + arm-none-eabi-gcc), run under QEMU mps2-an386, and assert it
      # byte-matches the same video-roundtrip golden via the offline C ABI.
      - name: QEMU runtime smoke (C firmware via libtstrans_firmware.a)
        env: { FIRMWARE_QEMU_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/firmware-qemu.sh

      # Runtime gates for the embedded/freertos-srt/ reference product (the
      # consolidated S0-S4 arc plus the srt-recv ingress gate: one shared
      # substrate, the NIC-egress example, the NIC-ingress srt-recv, and seven
      # named test targets, all driven by the
      # embedded/scripts/check/freertos-srt.sh <target> dispatcher). Each gate skips cleanly via
      # `command -v` guards if the cross-toolchain/QEMU/cmake/cargo is absent, so
      # promotion can't false-red on a runner-image change. No new apt packages --
      # gcc-arm-none-eabi + libstdc++-arm-none-eabi-newlib + qemu-system-arm are
      # installed above; cmake is preinstalled on the runner image; the apt step
      # installs the rest; embedded/vendor/{lwip,freertos-*} +
      # vendor/{srt,mbedtls} come from the recursive submodule checkout; the
      # example host harness builds the vendored host libsrt via cargo, and
      # srt-recv additionally builds the embedded/baremetal-qemu-c staticlib
      # (libtstrans_firmware.a, thumbv7em-none-eabihf) via cargo -- the
      # target is already installed for this job (see the toolchain step
      # above), so no new prerequisite here either.

      # exceptions (was S0): concurrent per-task C++ throw/catch with exception
      # isolation on FreeRTOS + FreeRTOS-Plus-POSIX (pthread backend). Hard-gate.
      # FREERTOS_SRT_REQUIRE_TOOLS=1 makes a missing prerequisite (the apt step
      # above installs them all) fail closed instead of skipping to a no-op pass,
      # so a runner-image regression can't silently drop coverage while green.
      - name: QEMU runtime gate (freertos-srt exceptions)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh exceptions

      # lwip-loopback (was S1): the 564-byte golden round-trips through a lwIP UDP
      # loopback socket (BSD sockets + select(), hi-res clock_gettime). Hard-gate.
      - name: QEMU runtime gate (freertos-srt lwip-loopback)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh lwip-loopback

      # libsrt-smoke (was S2): cross-compiled libsrt (Generic -> ::select path,
      # pthread backend, logging+encryption OFF) boots srt_startup + create_socket
      # + close + cleanup against the FreeRTOS+lwIP substrate. Hard-gate.
      - name: QEMU runtime gate (freertos-srt libsrt-smoke)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh libsrt-smoke

      # loopback-arq (was S3): SRT caller+listener data-plane proof -- streams the
      # golden x N over a lossy loopback netif (~20% deterministic loss) and
      # recovers it byte-exact, plain and mbedTLS-AES-128. Hard-gate.
      - name: QEMU runtime gate (freertos-srt loopback-arq ARQ + encryption)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh loopback-arq

      # arq-connfail (EMB-JOIN-1): the loopback-arq caller pointed at a dead
      # port must FAIL fast with a labeled where=connect verdict — proving a
      # caller-side failure aborts the listener's srt_accept instead of
      # wedging pthread_join until the timeout kills QEMU with an empty
      # transcript (the historical flake presentation). Hard-gate.
      - name: QEMU runtime gate (freertos-srt arq-connfail)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh arq-connfail

      # fault-smoke (EMB-TRAP-1): deliberate __builtin_trap() must produce a
      # labeled FAIL[hardfault] pc=0x... token and exit fast (<25 s), not hang
      # silently for the full timeout. Proves the speaking fault handlers work.
      - name: QEMU runtime gate (freertos-srt fault-smoke)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh fault-smoke

      # malloc-stress (s5, WP-EMB-1): 4 tasks x 20000 malloc/free with per-block
      # canaries + concurrent C++ throw/catch + per-task errno isolation checks.
      # Regression proof for EMB-HEAP-1 (newlib malloc lock-free under preemption)
      # and EMB-ERRNO-1 (shared _reent errno bleed). Hard-gate.
      - name: QEMU runtime gate (freertos-srt malloc-stress)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh malloc-stress

      # example (was S4): real-NIC egress. A bare-metal SRT caller streams the
      # golden x N out a lan9118 NIC over QEMU SLIRP user-net to a host tst-srt
      # listener that verifies byte-exact (plain + AES-128); the host process exit
      # code is the verdict. Promoted to hard-gate after 12 consecutive green
      # example steps on main (runs 28696404540..29004357578, checked 2026-07-09).
      # WP-EMB-1's per-task _reent + retargetable-locking fix addressed the newlib
      # flake class; this gate had already been green across that window.
      - name: QEMU runtime gate (freertos-srt NIC egress example)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh example

      # srt-recv: real-NIC ingress, the reverse of `example`. A bare-metal SRT
      # LISTENER accepts an inbound connection from a host tst-srt caller over
      # QEMU SLIRP user-net (hostfwd=udp forwards the port), receives the
      # golden, and demuxes + verifies it ON-DEVICE via the offline
      # tst_demuxer_* C ABI (libtstrans_firmware.a, the same staticlib the C
      # firmware gate above builds) -- the firmware is the authoritative
      # verifier here, not the host.
      - name: QEMU runtime gate (freertos-srt NIC ingress srt-recv)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh srt-recv

  fuzz-smoke:
    name: fuzz smoke (nightly, compile only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build

      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          # No --locked: cargo-fuzz 0.13.1's bundled Cargo.lock pins
          # tempfile 3.3.0 → rustix 0.36.5, whose cfg_attr(rustc_attrs, ...)
          # gates trip the nightly parser's reserved-attribute check (the
          # `rustc_*` namespace is now rejected at parse time even when
          # cfg-gated). Fresh resolution picks tempfile 3.27+ → rustix 1.x.
          cargo +nightly install cargo-fuzz --quiet

      - name: check-fuzz-targets (manifest matches fuzz dirs)
        run: bash scripts/check/repo/fuzz-targets.sh

      # `cargo +nightly fuzz check` (compile-only) catches fuzz-target
      # rot when a public API change breaks one. Compile-only because
      # corpus replay on every PR would burn CI minutes for low
      # marginal coverage. Theme O of the Rust quality refactor audit
      # called out "no fuzz smoke" as a gap.
      - name: Compile-check tst-core fuzz targets
        run: |
          cd crates/tst-core/fuzz
          cargo +nightly fuzz check

      - name: Compile-check tst-srt fuzz targets
        run: |
          cd crates/tst-srt/fuzz
          cargo +nightly fuzz check

      - name: Compile-check tst-rtp fuzz targets
        run: |
          cd crates/tst-rtp/fuzz
          cargo +nightly fuzz check

  python-core:
    name: tst-py default tests
    runs-on: ubuntu-latest
    # Default (non-pandas) pytest suite. Phase 0/1 didn't add a python
    # CI job; Phase 6 added `python-pandas-extra` for the optional extra;
    # this job (added via audit #1, 2026-05-24) closes the gap by running
    # the broader default-marker suite that exercises Demuxer, Muxer,
    # KLV typed decode/encode, codec parsers, and io helpers. Wires
    # scripts/check/python/error-mapping-coverage.sh as a fast-fail step
    # (before the expensive maturin build) so future CodecParseError /
    # DemuxError / KlvDecodeError / KlvEncodeError variants cannot
    # silently miss Python exception mapping.
    env:
      # Same `RUSTUP_TOOLCHAIN` pin as `build` and `python-pandas-extra` —
      # avoids the pre-installed clippy / rustup-sync clash on
      # ubuntu-latest runners (per
      # `reference_maturin_develop_ci_venv_recipe`).
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: check-py-non-conformant-kind-coverage
        # Plan #96 Wave G (Finding 12): NonConformantKind is the public
        # analytics surface. Verify every Rust NonConformantIssue variant
        # has an arm in `non_conformant_kind_name` and every output kind
        # string is a member of the Python NonConformantKind enum.
        run: bash scripts/check/python/non-conformant-kind-coverage.sh

      - name: check-py-error-mapping-coverage
        # Consolidated: `py` rows assert every <Proto>ErrorKind in
        # tstrans.exceptions (srt/udp/tcp/rtp/rtsp/hls/rist) has a
        # make_<proto>_error call site under bindings/python/src/; `pyarm`
        # rows assert every CodecParseError / DemuxError / KlvDecodeError /
        # KlvEncodeError variant (Plan #96 Wave G, Finding 12) has an
        # explicit arm in its Python-binding mapper fn, instead of silently
        # routing to a wildcard fallback. Driven by
        # scripts/ratchets/error-mapping.tsv (replaces the former
        # per-protocol check-py-*-error-mapping clones; also brings
        # rtp/rtsp under CI, which were previously local-only).
        run: bash scripts/check/python/error-mapping-coverage.sh

      - name: check-py-publisher-class-mirror
        # Plan A5b Wave C T14 — verifies the Python Publisher ABC method
        # list (tstrans/hls.pyi) mirrors the Rust tst_core Publisher trait.
        run: bash scripts/check/python/publisher-class-mirror.sh

      - name: Install build prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Cache cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
            !target/debug/.fingerprint
            !target/debug/deps
          key: cargo-python-core-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-python-core-

      - name: Create + activate venv, install maturin + pytest
        # maturin develop requires VIRTUAL_ENV/CONDA_PREFIX/.venv; setup-python
        # alone gives a system python. No numpy/pandas here — this job runs
        # the default `-m 'not pandas'` set; the [pandas] extra is covered
        # by `python-pandas-extra`.
        run: |
          cd bindings/python
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin pytest pytest-timeout mypy

      - name: Build tst-py (maturin develop --release)
        run: |
          cd bindings/python
          source .venv/bin/activate
          maturin develop --release

      - name: check-py-stubtest
        # Verifies the core .pyi stubs (io/codec/klv/mpegts) match the
        # maturin-built runtime surface. Runs here (not as a pure-grep
        # pre-push ratchet) because stubtest needs the built extension +
        # mypy in the venv. The script skips gracefully on an unbuilt tree.
        run: bash scripts/check/python/stubtest.sh

      - name: pytest default (non-pandas)
        # pyproject.toml sets `addopts = "-m 'not pandas'"` so this runs
        # the default marker set. Pandas-marked tests live in the
        # `python-pandas-extra` job; missing-extra ImportError smoke also
        # lives there (patches sys.modules to be extra-agnostic).
        run: |
          cd bindings/python
          .venv/bin/pytest tests/ -v

  python-pandas-extra:
    name: tst-py with [pandas] extra
    runs-on: ubuntu-latest
    # Sibling to `python-core`: same venv recipe, plus numpy + pandas to
    # exercise the `tstrans.pandas` adapters. The missing-extra
    # test file (test_pandas_missing_extra.py) runs unconditionally in this
    # job as a smoke check — it patches sys.modules so the [pandas] extra
    # being installed here doesn't suppress the test.
    env:
      # Pin via env so rust-toolchain.toml doesn't re-trigger rustup sync
      # mid-build (which clashes with the pre-installed clippy on
      # ubuntu-latest runners — see the matching pattern in the `build` job).
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Cache cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
            !target/debug/.fingerprint
            !target/debug/deps
          key: cargo-python-pandas-extra-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-python-pandas-extra-

      - name: Create + activate venv, install maturin + pandas extras
        # maturin develop requires VIRTUAL_ENV/CONDA_PREFIX/.venv; setup-python
        # alone gives a system python, not a venv. Create .venv at the
        # bindings/python/ level (matches local-dev convention).
        run: |
          cd bindings/python
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin pytest pytest-timeout 'numpy>=1.24' 'pandas>=2.0'

      - name: Build tst-py (maturin develop --release)
        run: |
          cd bindings/python
          source .venv/bin/activate
          maturin develop --release

      - name: pytest -m pandas (extra-gated tests)
        run: |
          cd bindings/python
          .venv/bin/pytest -m pandas --override-ini=addopts= tests/ -v

      - name: pytest missing-extra ImportError smoke
        # Confirms test_pandas_missing_extra.py (NOT marked `pandas`) still
        # passes when the extra IS installed — it patches sys.modules so the
        # canary holds either way.
        run: |
          cd bindings/python
          .venv/bin/pytest tests/test_pandas_missing_extra.py -v

  tst-c-feature-matrix:
    name: tst-c feature matrix (linux-x86_64)
    runs-on: ubuntu-latest
    # Builds tst-c in all four feature-flag combinations and runs the
    # `feature_matrix_compile` integration test in each mode. Catches:
    #  1. Compile failures when features are toggled off (e.g., srt-only
    #     build accidentally references an rtp symbol, or vice-versa).
    #  2. cfg-leak regressions where a symbol appears in a build flavor
    #     that should not have it — faster feedback than waiting for
    #     scripts/check/c/header-conditional-sections.sh to run against the header.
    #
    # Linux-only: vendored libsrt cmake build is the reference platform.
    # The four modes are:
    #  - default  (srt + rtp + mbedtls)
    #  - srt-only (--no-default-features --features srt)
    #  - rtp-only (--no-default-features --features rtp)
    #  - neither  (--no-default-features)  — 0 tests expected, must compile
    env:
      RUSTUP_TOOLCHAIN: "1.85"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            cargo_flags: ""
          - name: srt-only
            cargo_flags: "--no-default-features --features srt"
          - name: rtp-only
            cargo_flags: "--no-default-features --features rtp"
          - name: neither
            cargo_flags: "--no-default-features"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Cache cargo + cmake artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
            !target/debug/.fingerprint
            !target/debug/deps
          key: cargo-tst-c-matrix-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-tst-c-matrix-${{ matrix.name }}-

      - name: check-c-header-conditional-sections
        # Verify the committed tstrans.h contains TST_HAS_SRT + TST_HAS_RTP
        # defines and that srt-only cbindgen output has no rtp_* leak.
        # Runs unconditionally (header is checked regardless of feature mode)
        # because the script operates on the committed header, not a
        # freshly-generated one.
        run: bash scripts/check/c/header-conditional-sections.sh

      - name: cargo build tst-c (${{ matrix.name }})
        # Build tst-c with the feature combination under test. Explicit build
        # step produces the cdylib + staticlib (cargo test alone only builds
        # the rlib when multiple crate-types are present).
        run: cargo build -p tst-c ${{ matrix.cargo_flags }}

      - name: cargo test feature_matrix_compile (${{ matrix.name }})
        # Integration test that imports feature-gated symbols by Rust path.
        # default  → 5 tests; srt-only → 1 test; rtp-only → 4 tests;
        # neither  → 0 tests (compile succeeds, no test bodies active).
        # feature_matrix_compile now lives in the consolidated `abi` test
        # binary (see bindings/c/tests/MOVEMENT_MAP.md); build that binary
        # and filter to its tests — the per-mode counts above are unchanged.
        run: cargo test -p tst-c ${{ matrix.cargo_flags }} --test abi feature_matrix_compile
