          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            pass: default
            flags: ''
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            pass: no-default
            flags: --no-default-features
          - name: macos-arm64
            runner: macos-15
            pass: default
            flags: ''
          - name: macos-arm64
            runner: macos-15
            pass: no-default
            flags: --no-default-features
          - name: windows-msvc
            runner: windows-latest
            pass: default
            flags: ''
          - name: windows-msvc
            runner: windows-latest
            pass: no-default
            flags: --no-default-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive

      - name: Name the capability-skip log
        shell: bash
        run: echo "TST_CAPABILITY_LOG=$RUNNER_TEMP/capability-skips.txt" >> "$GITHUB_ENV"

      - uses: ./.github/actions/build-prereqs
        with:
          platform: ${{ matrix.name }}

      - name: Rust toolchain, cargo-nextest, cargo cache (restore only)
        # The key equals the build job's key for this platform, so the restore
        # hits what that job saved on an earlier run (the shards run alongside
        # `build`); the shards never save. rustfmt backs the "generated Rust
        # parses" checks in tst-binding-gen, which pass vacuously without it.
        uses: ./.github/actions/rust-setup
        with:
          components: rustfmt
          nextest: 'true'
          cache-save: 'false'
          cache-key: cargo-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          cache-restore-key: cargo-${{ matrix.name }}-

      - name: Build the C library for this pass's feature set
        # bindings/c/tests/abi/{has_feature,smoke}.rs load target/debug/libtstrans.*
        # and assert its TST_HAS_* set; the restored cache holds whichever cdylib
        # the build job wrote last.
        run: cargo build -p tst-c ${{ matrix.flags }}

      - name: Compile the tests
        # Builds the test binaries first, so the next step's timeout covers
        # the test run only.
        run: cargo nextest run --workspace ${{ matrix.flags }} --no-run

      - name: cargo test (${{ matrix.pass }}, shard ${{ matrix.shard }}/2)
        # Runs under nextest: per-test `terminate-after` (.config/nextest.toml)
        # kills any hung test and keeps going, and the `network` test-group
        # serialises loopback tests within the shard.
        timeout-minutes: 20
        run: cargo nextest run --workspace ${{ matrix.flags }} --no-fail-fast --partition hash:${{ matrix.shard }}/2

      - name: List the capability skips
        if: always()
        shell: bash
        run: |
          {
            echo "### Capability skips (${{ matrix.name }}, ${{ matrix.pass }}, ${{ matrix.shard }}/2)"
            if [ -s "$TST_CAPABILITY_LOG" ]; then
              echo
              echo '| count | capability | test | reason |'
              echo '| --- | --- | --- | --- |'
              # One line per skip; count any repeats.
              sort "$TST_CAPABILITY_LOG" | uniq -c | while read -r n line; do
                IFS=$'\t' read -r cap test why <<<"$line"
                echo "| $n | $cap | \`$test\` | ${why//|/\\|} |"
              done
            else
              echo
              echo 'None.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test-linux-musl:
    name: test (linux-musl-x86_64, no-libsrt crates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive

      - name: Rust toolchain + musl target, cargo cache
        uses: ./.github/actions/rust-setup
        with:
          targets: x86_64-unknown-linux-musl
          cache-key: cargo-musl-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          cache-restore-key: cargo-musl-${{ runner.os }}-

      # tst-core + tst-pipeline are pure Rust crates (no libsrt link),
      # so their library build needs only rust-std-musl + rust-lld — the
      # build step below runs with no C compiler for the target. The test
      # step builds dev-dependencies too, and criterion 0.8 pulls alloca,
      # whose build script compiles a C shim for every unix target; that
      # step gets musl-gcc. This job proves the no-libsrt build, not a
      # no-C-compiler test build. tst-srt and tst-c are out of scope
      # here: vendored libsrt cmake build has glibc dependencies (NSS
      # resolver, dynamic-load paths) that don't come up clean under musl
      # without a deeper rework. Covering the MPEG-TS+KLV+codec work satisfies the need for
      # a musl rail; libsrt-bound crates wait for musl-native libsrt support
      # if that is ever requested.
      - name: cargo build (tst-core + tst-pipeline, musl)
        run: cargo build -p tst-core -p tst-pipeline --target x86_64-unknown-linux-musl

      - name: musl C compiler (criterion's alloca shim in the test build)
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y musl-tools

      - name: cargo test (tst-core + tst-pipeline, musl)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
        run: cargo test -p tst-core -p tst-pipeline --target x86_64-unknown-linux-musl

  tst-rtp-client-only:
    name: test (transport bare planes + dependency lattice, linux-x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Three bare planes: the tokio-free client-only tst-rtp plane
    # (`--no-default-features --features tls`, what the planned tst-uniffi
    # mobile binding consumes), tst-rtp with no features at all, and tst-hls
    # with no features, plus the dependency lattice over every
    # (package, flags) plane. No other CI job compiles
    # these targets — every other leg builds tst-rtp with default
    # features (rtsp-server on) — so without this leg a client-only
    # compile break or a tokio leak into the client plane would ship
    # unnoticed.
    #
    # Deliberately checks out WITHOUT submodules: tst-rtp's dependency
    # graph (tst-core + tst-pipeline) contains no native -sys crates, so
    # nothing here needs the vendored libsrt/librist/mbedTLS trees — and
    # the leg stays immune to vendored-submodule host outages (the
    # 2026-08-08 code.videolan.org outage failed every submodule-cloning
    # job in checkout).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Rust toolchain, cargo cache, cargo-nextest
        uses: ./.github/actions/rust-setup
        with:
          nextest: 'true'
          components: clippy
          cache-key: cargo-rtp-client-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          cache-restore-key: cargo-rtp-client-${{ runner.os }}-

      # Every (package, flags) plane keeps the dependencies it promises,
      # incl. the tokio-free client-only tst-rtp plane (the mobile and WebRTC
      # bindings' dependency) and the tst-c `tls` forwards.
      - name: Dependency lattice
        run: bash scripts/check/repo/dependency-lattice.sh

      - name: cargo nextest (tst-rtp, --no-default-features --features tls)
        run: cargo nextest run -p tst-rtp --no-default-features --features tls --no-fail-fast

      - name: cargo test --doc (tst-rtp, client-only)
        run: cargo test --doc -p tst-rtp --no-default-features --features tls

      - name: cargo clippy + nextest (tst-rtp, --no-default-features)
        run: |
          cargo clippy -p tst-rtp --all-targets --no-default-features -- -D warnings
          cargo nextest run -p tst-rtp --no-default-features --no-fail-fast

      - name: cargo clippy + nextest (tst-hls, --no-default-features)
        run: |
          cargo clippy -p tst-hls --all-targets --no-default-features -- -D warnings
          cargo nextest run -p tst-hls --no-default-features --no-fail-fast

  no-std-baremetal:
    name: no_std bare-metal (compile + QEMU runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive

      - name: Rust toolchain + bare-metal targets, cargo cache
        uses: ./.github/actions/rust-setup
        with:
          targets: thumbv7em-none-eabihf, riscv32imac-unknown-none-elf
          cache-key: cargo-nostd-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'embedded/baremetal-qemu/Cargo.lock', 'embedded/baremetal-qemu-c/Cargo.lock', 'embedded/freertos-srt/example/host/Cargo.lock') }}
          cache-restore-key: cargo-nostd-${{ runner.os }}-
          cache-extra-paths: |
            embedded/baremetal-qemu/target
            embedded/baremetal-qemu-c/target
            embedded/freertos-srt/example/host/target

      # A `*-none-*` target has no std at all, so a successful library build
      # IS the no_std proof: any `use std::` or std-only dependency fails to
      # compile. Library builds need no #[global_allocator] (only final
      # binaries do). thumbv7em-none-eabihf = Cortex-M4F/M7F (STM32F4/F7/H7);
      # riscv32imac-unknown-none-elf proves the code is arch-agnostic no_std
      # (e.g. ESP32-P4 bare-metal). Mirrored locally by
      # embedded/scripts/check/no-std-baremetal.sh.
      - name: cargo build (tst-core, thumbv7em-none-eabihf)
        run: cargo build -p tst-core --no-default-features --target thumbv7em-none-eabihf

      - name: cargo build (tst-core, riscv32imac-unknown-none-elf)
        run: cargo build -p tst-core --no-default-features --target riscv32imac-unknown-none-elf

      - name: cargo build (tst-pipeline, thumbv7em-none-eabihf)
        run: cargo build -p tst-pipeline --no-default-features --target thumbv7em-none-eabihf

      - name: cargo build (tst-pipeline, riscv32imac-unknown-none-elf)
        run: cargo build -p tst-pipeline --no-default-features --target riscv32imac-unknown-none-elf

      - name: cargo build (tst-c-core offline C-ABI core rlib, thumbv7em-none-eabihf)
        run: cargo build -p tst-c-core --no-default-features --target thumbv7em-none-eabihf

      - name: cargo build (tst-c-core offline C-ABI core rlib, riscv32imac-unknown-none-elf)
        run: cargo build -p tst-c-core --no-default-features --target riscv32imac-unknown-none-elf

      # The MCU builds above prove the LIBRARY is no_std; this host run proves
      # the no_std plane's unit tests still compile and pass. It is the only
      # place that test target gets built: `cargo test --workspace
      # --no-default-features` unifies `std` back on through tst-c / tst-py /
      # tst-jni, so a regression here is invisible to every other job.
      # Single-threaded because the no_std last-error slot is one
      # process-global critical-section static (single-core bare-metal by
      # design) that cargo's parallel test threads would otherwise share.
      - name: cargo test (tst-c-core, --no-default-features, host)
        run: cargo test -p tst-c-core --no-default-features -- --test-threads=1

      # The no_std unit-test planes of tst-core and tst-pipeline. `cargo test
      # --workspace --no-default-features` unifies `std` back on through the
      # bindings, so only these -p runs test the no_std code. The list check
      # fails if `std` leaks back into tst-core's plane (a dev-dependency
      # turning tst-core's default features on did exactly that until
      # tst-test-helpers depended on it with default-features = false).
      # tst-pipeline's run tests its own no_std code (the spin ShellMutex,
      # the receiver shells) over a std tst-core: its dev-dependency enables
      # tst-core's `conformance` feature, which implies `std`.
      - name: cargo test (tst-core, --no-default-features, host)
        run: |
          if cargo test -p tst-core --no-default-features --lib -- --list | grep -q '^net::'; then
            echo "::error::std leaked into tst-core's no_std test plane"
            exit 1
          fi
          cargo test -p tst-core --no-default-features --lib

      - name: cargo test (tst-pipeline, --no-default-features, host)
        run: cargo test -p tst-pipeline --no-default-features --lib

      # gcc-arm-none-eabi already bundles the C++ cross-compiler (arm-none-eabi-g++);
      # there is no standalone g++-arm-none-eabi apt package. libstdc++-arm-none-eabi-newlib
      # adds the bare-metal C++ standard library needed by the S0 exceptions gate.
      # qemu-system-misc ships qemu-system-riscv32 (the ARM binary lives in the
      # separate qemu-system-arm package, installed alongside it here).
      # No apt-package cache: the repository's Actions cache quota is
      # smaller than its cargo caches alone, so an apt entry is evicted
      # before the next run. A slow `azure.archive.ubuntu.com` (tens of KB/s)
      # is bounded instead: the first attempt gets ten minutes, then the
      # sources switch to `archive.ubuntu.com` for one more attempt.
      - name: Install QEMU + ARM C cross-toolchain
        timeout-minutes: 25
        run: |
          pkgs="qemu-system-arm qemu-system-misc gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib"
          install() {
            sudo timeout 600 bash -c "apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y $pkgs"
          }
          if ! install; then
            echo "::notice::apt install failed or timed out; retrying through archive.ubuntu.com"
            for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
              if [ -f "$f" ]; then
                sudo sed -i 's#//azure\.archive\.ubuntu\.com#//archive.ubuntu.com#g' "$f"
              fi
            done
            install
          fi

      # Runtime gate: run the tst-core muxer + tst-pipeline shells on both a
      # Cortex-M4 (QEMU mps2-an386) and RISC-V (QEMU virt) core and assert
      # each byte-matches the committed video-roundtrip golden. The script
      # builds --release --locked outside a 60 s QEMU-only timeout per arch
      # (so the build step itself does not race the timer), fails closed on
      # missing tools. See embedded/baremetal-qemu/ + the design spec.
      - name: QEMU runtime smoke (baremetal-qemu, ARM + RISC-V)
        env: { QEMU_RUNTIME_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/qemu-runtime.sh

      # Runtime gate: build the C-firmware (libtstrans_firmware.a no_std glue
      # staticlib + arm-none-eabi-gcc), run under QEMU mps2-an386, and assert it
      # byte-matches the same video-roundtrip golden via the offline C ABI.
      - name: QEMU runtime smoke (C firmware via libtstrans_firmware.a)
        env: { FIRMWARE_QEMU_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/firmware-qemu.sh

      # Runtime gates for the embedded/freertos-srt/ reference product (the
      # consolidated S0-S4 arc plus the srt-recv ingress gate: one shared
      # substrate, the NIC-egress example, the NIC-ingress srt-recv, and seven
      # named test targets, all driven by the
      # embedded/scripts/check/freertos-srt.sh <target> dispatcher). Each gate skips cleanly via
      # `command -v` guards if the cross-toolchain/QEMU/cmake/cargo is absent, so
      # promotion can't false-red on a runner-image change. No new apt packages --
      # gcc-arm-none-eabi + libstdc++-arm-none-eabi-newlib + qemu-system-arm are
      # installed above; cmake is preinstalled on the runner image; the apt step
      # installs the rest; embedded/vendor/{lwip,freertos-*} +
      # vendor/{srt,mbedtls} come from the recursive submodule checkout; the
      # example host harness builds the vendored host libsrt via cargo, and
      # srt-recv additionally builds the embedded/baremetal-qemu-c staticlib
      # (libtstrans_firmware.a, thumbv7em-none-eabihf) via cargo -- the
      # target is already installed for this job (see the toolchain step
      # above), so no new prerequisite here either.

      # exceptions: concurrent per-task C++ throw/catch with exception
      # isolation on FreeRTOS + FreeRTOS-Plus-POSIX (pthread backend). Hard-gate.
      # FREERTOS_SRT_REQUIRE_TOOLS=1 makes a missing prerequisite (the apt step
      # above installs them all) fail closed instead of skipping to a no-op pass,
      # so a runner-image regression can't silently drop coverage while green.
      - name: QEMU runtime gate (freertos-srt exceptions)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh exceptions

      # lwip-loopback: the 564-byte golden round-trips through a lwIP UDP
      # loopback socket (BSD sockets + select(), hi-res clock_gettime). Hard-gate.
      - name: QEMU runtime gate (freertos-srt lwip-loopback)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh lwip-loopback

      # libsrt-smoke: cross-compiled libsrt (Generic -> ::select path,
      # pthread backend, logging+encryption OFF) boots srt_startup + create_socket
      # + close + cleanup against the FreeRTOS+lwIP substrate. Hard-gate.
      - name: QEMU runtime gate (freertos-srt libsrt-smoke)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh libsrt-smoke

      # loopback-arq: SRT caller+listener data-plane proof -- streams the
      # golden x N over a lossy loopback netif (~20% deterministic loss) and
      # recovers it byte-exact, plain and mbedTLS-AES-128. Hard-gate.
      - name: QEMU runtime gate (freertos-srt loopback-arq ARQ + encryption)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh loopback-arq

      # arq-connfail: the loopback-arq caller pointed at a dead port must
      # FAIL fast with a labeled where=connect verdict — proving a
      # caller-side failure aborts the listener's srt_accept instead of
      # wedging pthread_join until the timeout kills QEMU with an empty
      # transcript (the historical flake presentation). Hard-gate.
      - name: QEMU runtime gate (freertos-srt arq-connfail)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh arq-connfail

      # fault-smoke: deliberate __builtin_trap() must produce a
      # labeled FAIL[hardfault] pc=0x... token and exit fast (<25 s), not hang
      # silently for the full timeout. Proves the speaking fault handlers work.
      - name: QEMU runtime gate (freertos-srt fault-smoke)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh fault-smoke

      # malloc-stress: 4 tasks x 20000 malloc/free with per-block canaries +
      # concurrent C++ throw/catch + per-task errno isolation checks.
      # Regression proof for newlib malloc staying lock-free under
      # preemption and for shared _reent errno bleed. Hard-gate.
      - name: QEMU runtime gate (freertos-srt malloc-stress)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh malloc-stress

      # example: real-NIC egress. A bare-metal SRT caller streams the golden
      # x N out a lan9118 NIC over QEMU SLIRP user-net to a host tst-srt
      # listener that verifies byte-exact (plain + AES-128); the host
      # process exit code is the verdict. Promoted to hard-gate after 12
      # consecutive green example steps on main. The per-task _reent +
      # retargetable-locking fix addressed the newlib flake class; this
      # gate had already been green across that window.
      - name: QEMU runtime gate (freertos-srt NIC egress example)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh example

      # srt-recv: real-NIC ingress, the reverse of `example`. A bare-metal SRT
      # LISTENER accepts an inbound connection from a host tst-srt caller over
      # QEMU SLIRP user-net (hostfwd=udp forwards the port), receives the
      # golden, and demuxes + verifies it ON-DEVICE via the offline
      # tst_demuxer_* C ABI (libtstrans_firmware.a, the same staticlib the C
      # firmware gate above builds) -- the firmware is the authoritative
      # verifier here, not the host.
      - name: QEMU runtime gate (freertos-srt NIC ingress srt-recv)
        env: { FREERTOS_SRT_REQUIRE_TOOLS: "1" }
        run: bash embedded/scripts/check/freertos-srt.sh srt-recv

  fuzz-smoke:
    name: fuzz smoke (nightly, compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive

      - name: Pinned toolchain with rustfmt (fuzz-workspace fmt check)
        uses: ./.github/actions/rust-setup
        with:
          components: rustfmt

      - name: Install build prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build

      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          # No --locked: cargo-fuzz 0.13.1's bundled Cargo.lock pins
          # tempfile 3.3.0 → rustix 0.36.5, whose cfg_attr(rustc_attrs, ...)
          # gates trip the nightly parser's reserved-attribute check (the
          # `rustc_*` namespace is now rejected at parse time even when
          # cfg-gated). Fresh resolution picks tempfile 3.27+ → rustix 1.x.
          cargo +nightly install cargo-fuzz --quiet

      - name: check-fuzz-targets (manifest matches fuzz dirs)
        run: bash scripts/check/repo/fuzz-targets.sh

      # The four fuzz crates are separate workspaces, so the root
      # `cargo fmt --all -- --check` in the build job never sees them; two of
      # them had drifted unformatted before this step existed. Formats with
      # the pinned toolchain the setup step installed (RUSTUP_TOOLCHAIN), not
      # the nightly this job installs: that nightly is `--profile minimal`
      # (no rustfmt), and a rolling nightly rustfmt would make the check
      # drift over time. Only the fuzz COMPILE needs nightly.
      - name: cargo fmt --check (fuzz workspaces, pinned toolchain)
        run: |
          for d in crates/tst-core/fuzz crates/tst-srt/fuzz crates/tst-rtp/fuzz crates/tst-webrtc/fuzz; do
            (cd "$d" && cargo fmt --all -- --check)
          done

      # `cargo +nightly fuzz check` (compile-only) catches fuzz-target
      # rot when a public API change breaks one. Compile-only because
      # corpus replay on every PR would burn CI minutes for low
      # marginal coverage.
      - name: Compile-check tst-core fuzz targets
        run: |
          cd crates/tst-core/fuzz
          # The committed lockfile is the resolution the record attests: fail
          # here, with cargo's own message, if it would need re-resolving.
          cargo +nightly metadata --locked --format-version 1 > /dev/null
          cargo +nightly fuzz check

      - name: Compile-check tst-srt fuzz targets
        run: |
          cd crates/tst-srt/fuzz
          # The committed lockfile is the resolution the record attests: fail
          # here, with cargo's own message, if it would need re-resolving.
          cargo +nightly metadata --locked --format-version 1 > /dev/null
          cargo +nightly fuzz check

      - name: Compile-check tst-rtp fuzz targets
        run: |
          cd crates/tst-rtp/fuzz
          # The committed lockfile is the resolution the record attests: fail
          # here, with cargo's own message, if it would need re-resolving.
          cargo +nightly metadata --locked --format-version 1 > /dev/null
          cargo +nightly fuzz check

      - name: Compile-check tst-webrtc fuzz targets
        run: |
          cd crates/tst-webrtc/fuzz
          # The committed lockfile is the resolution the record attests: fail
          # here, with cargo's own message, if it would need re-resolving.
          cargo +nightly metadata --locked --format-version 1 > /dev/null
          cargo +nightly fuzz check

  python-core:
    name: tst-py default tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The default (non-pandas) pytest suite exercises Demuxer, Muxer, KLV
    # typed decode/encode, codec parsers, and io helpers. Python kinds come
    # from one Rust table, resolved at `import tstrans`, so a gap fails the
    # import (and the pytest suite) instead of needing a call-site grep.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive

      - name: check-py-non-conformant-kind-coverage
        # NonConformantKind is the public analytics surface. Verify every
        # Rust NonConformantIssue variant has an arm in
        # `non_conformant_kind_name` and every output kind
        # string is a member of the Python NonConformantKind enum.
        run: bash scripts/check/python/non-conformant-kind-coverage.sh

      - name: check-py-publisher-class-mirror
        # Verifies the Python Publisher ABC method list (tstrans/hls.pyi)
        # mirrors the Rust tst_core Publisher trait.
        run: bash scripts/check/python/publisher-class-mirror.sh

      - name: Install build prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Rust toolchain, cargo cache
        uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-python-core-${{ hashFiles('Cargo.lock') }}
          cache-restore-key: cargo-python-core-

      - name: Create + activate venv, install maturin + pytest
        # maturin develop requires VIRTUAL_ENV/CONDA_PREFIX/.venv; setup-python
        # alone gives a system python. No numpy/pandas here — this job runs
        # the default `-m 'not pandas'` set; the [pandas] extra is covered
        # by `python-pandas-extra`.
        run: |
          cd bindings/python
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin pytest pytest-timeout mypy

      - name: Build tst-py (maturin develop --release)
        # `py-test-hooks` adds the WebRTC loopback viewer probe that
        # test_webrtc.py drives; the wheels never enable it.
        run: |
          cd bindings/python
          source .venv/bin/activate
          maturin develop --release --features py-test-hooks

      - name: check-py-stubtest
        # Verifies every .pyi stub (core io/codec/klv/mpegts + the six
        # transport modules) matches the maturin-built runtime surface.
        # Runs here (not as a pure-grep
        # pre-push ratchet) because stubtest needs the built extension +
        # mypy in the venv. The script skips gracefully on an unbuilt tree.
        run: bash scripts/check/python/stubtest.sh

      - name: Enable core dumps
        # An abort at interpreter exit (exit 134) prints nothing that names
        # the thread; a core + the backtrace step below does.
        run: |
          ulimit -c unlimited
          echo "${{ github.workspace }}/core.%p" | sudo tee /proc/sys/kernel/core_pattern
          sudo apt-get -o Acquire::Retries=5 install -y gdb

      - name: pytest default (non-pandas)
        # pyproject.toml sets `addopts = "-m 'not pandas'"` so this runs
        # the default marker set. Pandas-marked tests live in the
        # `python-pandas-extra` job; missing-extra ImportError smoke also
        # lives there (patches sys.modules to be extra-agnostic).
        # `ulimit` is per-shell, so it is set again here.
        # TSTRANS_EXPECT_TEST_HOOKS makes the WebRTC loopback test fail,
        # not skip, when the build above lacks the probe.
        shell: bash -e {0}
        env:
          TSTRANS_EXPECT_TEST_HOOKS: "1"
        run: |
          ulimit -c unlimited
          cd bindings/python
          .venv/bin/pytest tests/ -v

      - name: Backtrace any core (python exit abort)
        if: failure()
        run: |
          shopt -s nullglob
          for c in ${{ github.workspace }}/core.*; do
            echo "== $c"
            gdb -batch -ex 'thread apply all bt' "$(readlink -f bindings/python/.venv/bin/python)" "$c" | head -200
          done

  python-pandas-extra:
    name: tst-py with [pandas] extra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sibling to `python-core`: same venv recipe, plus numpy + pandas to
    # exercise the `tstrans.pandas` adapters. The missing-extra
    # test file (test_pandas_missing_extra.py) runs unconditionally in this
    # job as a smoke check — it patches sys.modules so the [pandas] extra
    # being installed here doesn't suppress the test.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive

      - name: Install build prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Rust toolchain, cargo cache
        uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-python-pandas-extra-${{ hashFiles('Cargo.lock') }}
          cache-restore-key: cargo-python-pandas-extra-

      - name: Create + activate venv, install maturin + pandas extras
        # maturin develop requires VIRTUAL_ENV/CONDA_PREFIX/.venv; setup-python
        # alone gives a system python, not a venv. Create .venv at the
        # bindings/python/ level (matches local-dev convention).
        run: |
          cd bindings/python
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin pytest pytest-timeout 'numpy>=1.24' 'pandas>=2.0'

      - name: Build tst-py (maturin develop --release)
        run: |
          cd bindings/python
          source .venv/bin/activate
          maturin develop --release

      - name: pytest -m pandas (extra-gated tests)
        run: |
          cd bindings/python
          .venv/bin/pytest -m pandas --override-ini=addopts= tests/ -v

      - name: pytest missing-extra ImportError smoke
        # Confirms test_pandas_missing_extra.py (NOT marked `pandas`) still
        # passes when the extra IS installed — it patches sys.modules so the
        # canary holds either way.
        run: |
          cd bindings/python
          .venv/bin/pytest tests/test_pandas_missing_extra.py -v

  tst-c-feature-matrix:
    name: tst-c feature matrix (linux-x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Builds tst-c in all four feature-flag combinations and runs the
    # `feature_matrix_compile` integration test in each mode. Catches:
    #  1. Compile failures when features are toggled off (e.g., srt-only
    #     build accidentally references an rtp symbol, or vice-versa).
    #  2. cfg-leak regressions where a symbol appears in a build flavor
    #     that should not have it.
    #
    # Linux-only: vendored libsrt cmake build is the reference platform.
    # The four modes are:
    #  - default  (srt + rtp + mbedtls)
    #  - srt-only (--no-default-features --features srt)
    #  - rtp-only (--no-default-features --features rtp)
    #  - neither  (--no-default-features)  — 0 tests expected, must compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            cargo_flags: ""
          - name: srt-only
            cargo_flags: "--no-default-features --features srt"
          - name: rtp-only
            cargo_flags: "--no-default-features --features rtp"
          - name: neither
            cargo_flags: "--no-default-features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive

      - name: Install build prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build

      - name: Rust toolchain, cargo cache
        uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-tst-c-matrix-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          cache-restore-key: cargo-tst-c-matrix-${{ matrix.name }}-

      - name: cargo build tst-c (${{ matrix.name }})
        # Build tst-c with the feature combination under test. Explicit build
        # step produces the cdylib + staticlib (cargo test alone only builds
        # the rlib when multiple crate-types are present).
        run: cargo build -p tst-c ${{ matrix.cargo_flags }}

      - name: cargo test feature_matrix_compile (${{ matrix.name }})
        # Integration test that imports feature-gated symbols by Rust path.
        # default  → 5 tests; srt-only → 1 test; rtp-only → 4 tests;
        # neither  → 0 tests (compile succeeds, no test bodies active).
        # feature_matrix_compile now lives in the consolidated `abi` test
        # binary (see bindings/c/tests/MOVEMENT_MAP.md); build that binary
        # and filter to its tests — the per-mode counts above are unchanged.
        run: cargo test -p tst-c ${{ matrix.cargo_flags }} --test abi feature_matrix_compile

  c-abi:
    name: C ABI vs previous tag (linux-x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # gh attestation verify reads the previous package's provenance.
      attestations: read
    # abidiff of this tree's libtstrans against the previous release tag's.
    # The previous library comes from the tag's Release package when that
    # carries one; until then it is built from source at the tag (cold build
    # about 15 minutes, then cached on the library file alone). Fails when
    # neither source yields a library, never passes without a comparison.
    # 1.0 item: the rail is called without majors (both 0); at the 1.0 major
    # pass the previous and current major like the minors, or the intended
    # break fails the job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive

      - name: Install build prerequisites and abigail-tools
        # abigail-tools is pinned to the version on the ubuntu-24.04 image;
        # a runner image move makes the pin fail loudly, then re-pin.
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build binutils abigail-tools=2.4-3build1

      - name: Rust toolchain, cargo cache
        uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-c-abi-${{ hashFiles('Cargo.lock') }}

      - name: Select the previous release tag
        id: prev
        run: bash scripts/dev/prev-c-library.sh select

      - name: Previous library from the tag's Release package
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ steps.prev.outputs.prev }}
        run: bash scripts/dev/prev-c-library.sh release

      - name: Previous library cache
        if: steps.release.outputs.lib == ''
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/prev-target/debug/libtstrans.so
          key: c-abi-${{ steps.prev.outputs.prev }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Previous library built from source at the tag
        if: steps.release.outputs.lib == '' && steps.cache.outputs.cache-hit != 'true'
        env:
          PREV: ${{ steps.prev.outputs.prev }}
        run: bash scripts/dev/prev-c-library.sh build

      - name: Stage this tree's package
        run: bash scripts/dev/c-package.sh --all-features --out "$RUNNER_TEMP/pkg"

      - name: abidiff against the previous tag
        env:
          PREV: ${{ steps.prev.outputs.prev }}
          PREV_MINOR: ${{ steps.prev.outputs.prev_minor }}
          HEAD_MINOR: ${{ steps.prev.outputs.head_minor }}
          RELEASE_LIB: ${{ steps.release.outputs.lib }}
        run: |
          old="$(bash scripts/dev/prev-c-library.sh resolve)"
          bash scripts/dev/prev-c-library.sh header "$RUNNER_TEMP/prev-tstrans.h"
          bash scripts/check/c/abi-compat.sh "$old" "$RUNNER_TEMP/pkg/lib/libtstrans.so" "$PREV_MINOR" "$HEAD_MINOR" --header "$RUNNER_TEMP/pkg/include/tstrans.h" --old-header "$RUNNER_TEMP/prev-tstrans.h" 2>&1 | tee "$RUNNER_TEMP/abi-report.txt"
          exit "${PIPESTATUS[0]}"

      - name: Upload the abidiff report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c-abi-report
          path: ${{ runner.temp }}/abi-report.txt
          if-no-files-found: ignore

  deny:
    name: cargo-deny (advisories + licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dependency-advisory + license gate. Reads
    # Cargo.lock and the RustSec advisory DB only — no build, no submodules
    # (the vendored native libs are not crates; see deny.toml's header).
    # Policy lives in deny.toml; `bans`/`sources` are intentionally off.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - id: rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: none

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses
          rust-version: ${{ steps.rust.outputs.channel }}

      # The workspaces outside the root one, against the same policy and at
      # their committed lockfiles: `--locked` fails the job when a lock no
      # longer matches its manifest instead of re-resolving it. roster-sync.sh
      # fails when a crates/*/fuzz workspace is missing from this list.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: crates/tst-core/fuzz/Cargo.toml
          command: check advisories licenses
          arguments: --config deny.toml --locked
          rust-version: ${{ steps.rust.outputs.channel }}

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: crates/tst-rtp/fuzz/Cargo.toml
          command: check advisories licenses
          arguments: --config deny.toml --locked
          rust-version: ${{ steps.rust.outputs.channel }}

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: crates/tst-srt/fuzz/Cargo.toml
          command: check advisories licenses
          arguments: --config deny.toml --locked
          rust-version: ${{ steps.rust.outputs.channel }}

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: crates/tst-webrtc/fuzz/Cargo.toml
          command: check advisories licenses
          arguments: --config deny.toml --locked
          rust-version: ${{ steps.rust.outputs.channel }}

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: embedded/baremetal-qemu/Cargo.toml
          command: check advisories licenses
          arguments: --config deny.toml --locked
          rust-version: ${{ steps.rust.outputs.channel }}

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: embedded/baremetal-qemu-c/Cargo.toml
          command: check advisories licenses
          arguments: --config deny.toml --locked
          rust-version: ${{ steps.rust.outputs.channel }}

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: embedded/freertos-srt/example/host/Cargo.toml
          command: check advisories licenses
          arguments: --config deny.toml --locked
          rust-version: ${{ steps.rust.outputs.channel }}
