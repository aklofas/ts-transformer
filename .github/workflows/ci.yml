            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test-main-extra:
    name: test (${{ matrix.name }}, ${{ matrix.pass }}, ${{ matrix.shard }}/2)
    # Push to main, the nightly dispatch and any workflow_dispatch run the
    # passes the PR set leaves out.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # Loopback multicast works on both Linux runners, so a multicast test
      # that skips there fails instead (tst_test_helpers::capability).
      TST_REQUIRE_MULTICAST: ${{ startsWith(matrix.name, 'linux-') && '1' || '' }}
    strategy:
      fail-fast: false
