# ClusterFuzzLite scheduled work on main: a one-hour batch fuzz of every
# harness under AddressSanitizer, a corpus prune, and a coverage report.
# Daily at 04:00 UTC, after the sanitizers cron (03:00). Dispatchable for a
# first run or after a bundle change.
#
# With a storage repo (the FUZZ_CORPUS_TOKEN secret; setup in
# oss-fuzz/README.md) corpora and coverage persist there. Without it the
# corpora persist as run artifacts with a 90-day retention and coverage lands
# only as a run artifact.
name: clusterfuzzlite-batch

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions: read-all

jobs:
  batch:
    name: batch fuzz (address)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3600
          mode: batch
          sanitizer: address
          storage-repo: ${{ secrets.FUZZ_CORPUS_TOKEN && format('https://{0}@github.com/aklofas/ts-transformer-fuzzcorpus.git', secrets.FUZZ_CORPUS_TOKEN) || '' }}
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages

  prune:
    name: corpus prune
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The runner splits this budget across every fuzz target as a
          # per-target floor (fuzz-seconds / target count) and kills a merge
          # that outlasts its share. At 600 s that floor was 15 s, which
          # whep_sdp_select outgrew once its stored corpus passed about 1800
          # inputs (its merge costs about 10 ms per input on a hosted runner).
          # A merge ends as soon as it is done, so a larger cap costs nothing
          # while corpora stay small; 2400 s is a 60 s floor for 40 targets,
          # well inside the job timeout after the eight-minute build.
          fuzz-seconds: 2400
          mode: prune
          storage-repo: ${{ secrets.FUZZ_CORPUS_TOKEN && format('https://{0}@github.com/aklofas/ts-transformer-fuzzcorpus.git', secrets.FUZZ_CORPUS_TOKEN) || '' }}
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages

  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: coverage
      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: coverage
          sanitizer: coverage
          storage-repo: ${{ secrets.FUZZ_CORPUS_TOKEN && format('https://{0}@github.com/aklofas/ts-transformer-fuzzcorpus.git', secrets.FUZZ_CORPUS_TOKEN) || '' }}
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages
