name: jvm-jar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: jvm ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.continue }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: linux-x86_64
            runner: ubuntu-latest
            continue: false
          - triple: linux-aarch64
            runner: ubuntu-24.04-arm
            continue: false
          - triple: macos-aarch64
            runner: macos-14
            continue: false
          - triple: windows-x86_64
            runner: windows-latest
            continue: false
          # macos-x86_64 (Intel) is deferred: macos-13 runners are scarce /
          # winding down (a queued best-effort job blocked assemble), and
          # ci.yml doesn't build it either. See docs/deferred-features.md.
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive  # tst-srt builds vendor/srt + vendor/mbedtls

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # cmake is pre-installed on all GitHub runners; tst-jni pulls no
      # librist/udp/tcp/hls deps, so no meson/ninja/pkg-config is needed.
      - name: Build + test JVM binding
        working-directory: bindings/jvm
        shell: bash
        env:
          SRT_FORCE_VENDORED: "1"
        # -PjniTestHooks=true builds the test-only panic probe and runs
        # PanicIsolationTest, proving a Rust panic is isolated as a thrown
        # RuntimeException instead of aborting the JVM.
        run: ./gradlew test --no-daemon --stacktrace -PjniTestHooks=true

      - name: Rebuild shippable native lib (probe-free)
        working-directory: bindings/jvm
        shell: bash
        env:
          SRT_FORCE_VENDORED: "1"
        # cargoBuild without -PjniTestHooks omits the jni-test-hooks feature;
        # cargo rebuilds (feature set changed) and copyNative re-stages the
        # probe-free lib into resources/ before the upload step copies it.
        run: ./gradlew copyNative --no-daemon --stacktrace

      - name: check-jvm-error-mapping-coverage
        if: matrix.triple == 'linux-x86_64'
        run: bash scripts/check/jvm/error-mapping-coverage.sh

      - name: check-jvm-jni-catch-coverage
        if: matrix.triple == 'linux-x86_64'
        run: bash scripts/check/jvm/jni-catch-coverage.sh

      # The dev-mode `test` task stages the cdylib into resources/native/<triple>/
      # already renamed to libtstjni.<ext>. Lay it out under native/ for upload.
      - name: Stage native lib for upload
        shell: bash
        run: |
          mkdir -p upload/native/${{ matrix.triple }}
          cp bindings/jvm/src/main/resources/native/${{ matrix.triple }}/libtstjni.* \
             upload/native/${{ matrix.triple }}/
          ls -la upload/native/${{ matrix.triple }}/

      # Belt-and-suspenders: prove the rebuild step produced a probe-free lib so
      # a future refactor dropping that step can't silently ship the probe.
      # Linux-only: nm/symbol tooling isn't portable across macos/windows
      # runners, and the feature-gating + rebuild logic is identical on every
      # platform, so linux is a sufficient sentinel.
      - name: Assert shipped native lib has no test-probe symbol
        if: matrix.triple == 'linux-x86_64'
        shell: bash
        run: |
          LIB=upload/native/linux-x86_64/libtstjni.so
          if nm -D "$LIB" | grep -q 'PanicProbe'; then
            echo "FAIL: test-only PanicProbe symbol present in shipped lib ($LIB)"; exit 1
          fi
          echo "OK: no PanicProbe symbol in shipped native lib"

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.triple }}
          path: upload/
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: assemble fat JAR
    needs: [build] # all four gating platforms must pass
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        # no submodules: assembly does not build native code

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # merge-multiple flattens all native-* artifacts into one tree:
      # staging/native/<triple>/libtstjni.<ext> for every uploaded platform.
      - name: Download native libs
        uses: actions/download-artifact@v8
        with:
          path: staging
          pattern: native-*
          merge-multiple: true

      - name: Inventory staged native libs
        run: |
          echo "Staged native libs:"
          find staging/native -type f | sort

      - name: Assemble fat JAR
        working-directory: bindings/jvm
        shell: bash
        run: ./gradlew jar --no-daemon --stacktrace -PnativeStagingDir="$GITHUB_WORKSPACE/staging"

      - name: Assert JAR contains every gating native lib
        shell: bash
        run: |
          JAR=$(ls bindings/jvm/build/libs/tstrans-jvm*.jar)
          echo "Inspecting $JAR"
          unzip -l "$JAR" | grep native/ || true
          for t in linux-x86_64 linux-aarch64 macos-aarch64 windows-x86_64; do
            case "$t" in
              windows-*) name=libtstjni.dll ;;
              macos-*)   name=libtstjni.dylib ;;
              *)         name=libtstjni.so ;;
            esac
            if ! unzip -l "$JAR" | grep -q "native/$t/$name"; then
              echo "FAIL: JAR missing native/$t/$name"; exit 1
            fi
          done
          echo "All gating native libs present in JAR."

      # Smoke-load: the assemble runner is linux-x86_64, and the JAR ships that
      # lib. Version.versionString() triggers NativeLoader.load() via a static
      # block, proving the packaged lib extracts + loads from the JAR.
      - name: Smoke-load native lib from assembled JAR
        shell: bash
        run: |
          JAR=$(ls bindings/jvm/build/libs/tstrans-jvm*.jar)
          mkdir -p smoke
          cat > smoke/Smoke.java <<'EOF'
          public class Smoke {
              public static void main(String[] args) {
                  System.out.println("version=" + org.tstrans.Version.versionString());
              }
          }
          EOF
          javac -cp "$JAR" -d smoke smoke/Smoke.java
          java -cp "$JAR:smoke" Smoke

      - uses: actions/upload-artifact@v7
        with:
          name: tstrans-jvm-fat-jar
          path: bindings/jvm/build/libs/tstrans-jvm*.jar
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to Maven Central (staged)
    # Only on v* tag pushes; requires the 4 gating builds + a successful
    # assembly validation (which proved native-lib completeness). This job
    # re-stages the native libs and rebuilds/signs the jar — it does not
    # reuse assemble's artifact. A non-tag push skips this (the `if` is false).
    needs: [build, assemble]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: maven-central
      url: https://central.sonatype.com/publishing/deployments
    steps:
      - uses: actions/checkout@v5
        # no submodules: publishing rebuilds the jar from staged native libs,
        # not from cargo.

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Download native libs
        uses: actions/download-artifact@v8
        with:
          path: staging
          pattern: native-*
          merge-multiple: true

      - name: Assert version consistency (tag == source version) [REL-01]
        run: bash scripts/check/repo/release-version-consistency.sh

      # Builds + signs the fat jar + sources + javadoc and uploads them to the
      # Central Portal in STAGED state (automaticRelease=false in build.gradle.kts).
      # A maintainer then releases manually in the Portal UI. Version is the tag
      # without its leading `v` (e.g. refs/tags/v0.1.0 -> 0.1.0).
      - name: Publish to Maven Central (staged, manual release)
        working-directory: bindings/jvm
        shell: bash
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version $VERSION to the Central Portal (staged)"
          ./gradlew publishToMavenCentral --no-daemon --stacktrace \
            -PnativeStagingDir="$GITHUB_WORKSPACE/staging" -Pversion="$VERSION"
