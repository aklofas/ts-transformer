name: jvm-jar

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      dry_run:
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "bindings/jvm/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/rust-setup/**"
      - ".github/actions/jvm-build/**"
      - "scripts/check/jvm/**"
      - ".github/workflows/jvm-jar.yml"

permissions:
  contents: read

jobs:
  build:
    name: jvm ${{ matrix.triple }}
    # A called run (release-qualify passes dry_run: true) keeps the full matrix:
    # inside a called workflow github.event_name is the caller's event, so a
    # pull_request rehearsal of the qualification would otherwise shrink it.
    if: github.event_name != 'pull_request' || inputs.dry_run
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.continue }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: linux-x86_64
            runner: ubuntu-latest
            continue: false
          - triple: linux-aarch64
            runner: ubuntu-24.04-arm
            continue: false
          - triple: macos-aarch64
            runner: macos-15
            continue: false
          - triple: windows-x86_64
            runner: windows-latest
            continue: false
          # macos-x86_64 (Intel) is deferred: macos-13 runners are scarce /
          # winding down (a queued best-effort job blocked assemble), and
          # ci.yml doesn't build it either. See docs/deferred-features.md.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive  # tst-srt builds vendor/srt + vendor/mbedtls

      - name: Rust toolchain
        uses: ./.github/actions/rust-setup

      # The rest of the leg lives in the composite so build and build-pr run
      # the same steps.
      - uses: ./.github/actions/jvm-build
        with:
          triple: ${{ matrix.triple }}
          runner: ${{ matrix.runner }}

  # Pull requests build linux-x86_64 only; push to main, tags and the
  # qualification call run the four-platform matrix above.
  build-pr:
    name: jvm ${{ matrix.triple }}
    # A called run never takes this job (see build): the caller's event name
    # leaks into github.event_name, so inputs.dry_run tells the call apart.
    if: github.event_name == 'pull_request' && !inputs.dry_run
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: linux-x86_64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive  # tst-srt builds vendor/srt + vendor/mbedtls

      - name: Rust toolchain
        uses: ./.github/actions/rust-setup

      # The rest of the leg lives in the composite so build and build-pr run
      # the same steps.
      - uses: ./.github/actions/jvm-build
        with:
          triple: ${{ matrix.triple }}
          runner: ${{ matrix.runner }}

  assemble:
    name: assemble fat JAR
    needs: [build] # all four gating platforms must pass
    # Skipped on pull requests, which build one platform. A called run keeps it
    # (see build): the caller's event name leaks into github.event_name.
    if: github.event_name != 'pull_request' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # no submodules: assembly does not build native code
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # merge-multiple flattens all native-* artifacts into one tree:
      # staging/native/<triple>/libtstjni.<ext> for every uploaded platform.
      - name: Download native libs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: staging
          pattern: native-*
          merge-multiple: true

      - name: Inventory staged native libs
        run: |
          echo "Staged native libs:"
          find staging/native -type f | sort

      - name: Assemble fat JAR
        working-directory: bindings/jvm
        shell: bash
        run: ./gradlew jar --no-daemon --stacktrace -PnativeStagingDir="$GITHUB_WORKSPACE/staging"

      - name: Assert JAR contains every gating native lib
        shell: bash
        run: |
          JAR=$(ls bindings/jvm/build/libs/tstrans-jvm*.jar)
          echo "Inspecting $JAR"
          unzip -l "$JAR" | grep native/ || true
          for t in linux-x86_64 linux-aarch64 macos-aarch64 windows-x86_64; do
            case "$t" in
              windows-*) name=libtstjni.dll ;;
              macos-*)   name=libtstjni.dylib ;;
              *)         name=libtstjni.so ;;
            esac
            if ! unzip -l "$JAR" | grep -q "native/$t/$name"; then
              echo "FAIL: JAR missing native/$t/$name"; exit 1
            fi
          done
          echo "All gating native libs present in JAR."

      # The same named-module consumer, run against the fat jar users download.
      # The jar task is already up to date, so this reuses the assembled file.
      - name: Module-path smoke (assembled fat JAR)
        working-directory: bindings/jvm
        shell: bash
        run: ./gradlew modulePathSmoke --no-daemon --stacktrace -PnativeStagingDir="$GITHUB_WORKSPACE/staging"

      # Smoke-load: the assemble runner is linux-x86_64, and the JAR ships that
      # lib. Version.versionString() triggers NativeLoader.load() via a static
      # block, proving the packaged lib extracts + loads from the JAR.
      - name: Smoke-load native lib from assembled JAR
        shell: bash
        run: |
          JAR=$(ls bindings/jvm/build/libs/tstrans-jvm*.jar)
          mkdir -p smoke
          cat > smoke/Smoke.java <<'EOF'
          public class Smoke {
              public static void main(String[] args) {
                  System.out.println("version=" + org.tstrans.Version.versionString());
              }
          }
          EOF
          javac -cp "$JAR" -d smoke smoke/Smoke.java
          java -cp "$JAR:smoke" Smoke

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tstrans-jvm-fat-jar
          path: bindings/jvm/build/libs/tstrans-jvm*.jar
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to Maven Central (staged)
    # Only on v* tag pushes; requires the 4 gating builds + a successful
    # assembly validation (which proved native-lib completeness). This job
    # re-stages the native libs and rebuilds/signs the jar — it does not
    # reuse assemble's artifact. A non-tag push skips this (the `if` is false).
    needs: [build, assemble]
    # `inputs.dry_run` is unset (false) under the tag push, so the publish still
    # runs on its own trigger. A call passes dry_run: true; under a tag-push call the
    # event and ref match too, so `!inputs.dry_run` is what skips this job.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: maven-central
      url: https://central.sonatype.com/publishing/deployments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # no submodules: publishing rebuilds the jar from staged native libs,
        # not from cargo.
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Download native libs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: staging
          pattern: native-*
          merge-multiple: true

      - name: Assert version consistency (tag == source version)
        run: bash scripts/check/repo/release-version-consistency.sh

      # Builds + signs the fat jar + sources + javadoc and uploads them to the
      # Central Portal in STAGED state (automaticRelease=false in build.gradle.kts).
      # A maintainer then releases manually in the Portal UI. Version is the tag
      # without its leading `v` (e.g. refs/tags/v0.1.0 -> 0.1.0).
      - name: Publish to Maven Central (staged, manual release)
        working-directory: bindings/jvm
        shell: bash
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version $VERSION to the Central Portal (staged)"
          ./gradlew publishToMavenCentral --no-daemon --stacktrace \
            -PnativeStagingDir="$GITHUB_WORKSPACE/staging" -Pversion="$VERSION"
