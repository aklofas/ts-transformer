name: python-wheels

# Builds `tstrans` Python wheels + sdist via maturin, then (only on tag
# push) uploads to PyPI via trusted publishing (OIDC, no API tokens).
#
# Triggers:
# - tag push `v*` — full build + publish to PyPI.
# - workflow_dispatch — full build, no publish. Use to dry-run before
#   tagging a release.
# - pull_request modifying this workflow or the python-source surface —
#   build wheels but skip the publish job. Catches workflow regressions
#   without burning CI on every commit.
#
# abi3 wheels: pyo3 is built with `abi3-py310` so each platform produces
# ONE wheel valid for Python 3.10+ instead of one per Python minor
# version. The matrix is therefore (platform × target) only, not
# (platform × python × target).
#
# Vendored dependencies: SRT_FORCE_VENDORED=1 forces tst-rtp's libsrt +
# mbedTLS submodules to build from source — wheels are self-contained
# (no external libsrt/mbedTLS link on the user's system).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/python-wheels.yml"
      - "bindings/python/**"
      - "crates/tst-core/**"
      - "crates/tst-rtp/**"
      - "crates/tst-pipeline/**"
      - "crates/tst-srt/**"
      - "crates/srt-sys/**"
      # The wheel builds --features rtp,srt,udp,tcp,hls,rist,tls, so every native
      # crate on that path affects it. rist-sys (+ tst-rist/tst-tcp/tst-udp)
      # were missing — a change to them must rebuild + re-test the wheels.
      - "crates/tst-hls/**"
      - "crates/rist-sys/**"
      - "crates/tst-rist/**"
      - "crates/tst-tcp/**"
      - "crates/tst-udp/**"
      - "vendor/**"

permissions:
  contents: read

env:
  # Match the pin used elsewhere in the workspace so the wheel build
  # surface matches the test surface.
  RUSTUP_TOOLCHAIN: "1.85"

jobs:
  version-preflight:
    name: version preflight (REL-01)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        # No submodules: the rail only reads version strings from tracked files.
      - name: Assert version consistency (and tag == source version on tag builds)
        # On a v* tag push GITHUB_REF_NAME (e.g. v0.2.0) forces the source
        # version to equal the tag, so a tag can never build/publish a
        # mismatched wheel. On workflow_dispatch / PR there is no tag, so this
        # just asserts the six version sources agree with each other.
        run: bash scripts/check/repo/release-version-consistency.sh

  linux-wheel:
    name: wheel (linux-${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: version-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 is the gating production target. aarch64 ships
          # best-effort until the slow-CI issue tracked on linux-aarch64
          # is bisected; for now `continue-on-error: true` keeps a
          # publish-train moving even if aarch64 stalls.
          - target: x86_64
            continue-on-error: false
            manylinux: 2_28
          - target: aarch64
            continue-on-error: true
            manylinux: 2_28
    continue-on-error: ${{ matrix.continue-on-error }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # PyO3/maturin-action runs maturin inside a manylinux container.
      # `before-script-linux` installs cmake (libsrt + mbedTLS need it
      # to build from source); the container base doesn't include it.
      # `manylinux: 2_28` matches the spec at
      # docs/specs/2026-05-22-tst-py-design.md and the manylinux baseline
      # the rest of the project ratchets on.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: bindings/python
          args: --release --out dist --features rtp,srt,udp,tcp,hls,rist,tls
          # The container runs as root by design; without this every pip
          # call inside it — ours below AND the action's own (it pip-installs
          # cffi in the rust-cross aarch64 image) — prints pip's "Running pip
          # as the 'root' user" warning. Env, not a flag, so it reaches both.
          docker-options: -e PIP_ROOT_USER_ACTION=ignore
          before-script-linux: |
            # The manylinux base image is minimal: unlike the GitHub-hosted
            # ubuntu/macOS/windows runners it ships NO clang/libclang, which
            # srt-sys/rist-sys's bindgen needs (else bindgen panics). It also
            # lacks meson/ninja (librist's vendored build is meson-driven, NOT
            # cmake) and pkg-config (so librist's meson finds the shared
            # mbedTLS). AlmaLinux 8 (manylinux_2_28) is dnf-based; ninja-build
            # lives in EPEL.
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y epel-release || true
              dnf install -y cmake openssl-devel pkgconfig ninja-build clang
            elif command -v yum >/dev/null 2>&1; then
              yum install -y epel-release || true
              yum install -y cmake openssl-devel pkgconfig ninja-build clang
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache cmake openssl-dev musl-dev pkgconfig ninja clang clang-dev
            fi
            # meson + ninja via pip — uniform across the pypa (x86_64) and
            # rust-cross (aarch64) manylinux images. pip is used (not pipx,
            # which is absent in the aarch64 cross image), and pip's `ninja`
            # package installs the binary as `ninja` — RHEL's `ninja-build`
            # package names it `ninja-build`, which rist-sys's `which("ninja")`
            # check would miss (the x86_64 image happens to also ship `ninja`).
            python3 -m pip install --upgrade meson ninja \
              || pip3 install --upgrade meson ninja
            # aarch64 is cross-compiled inside the x86_64 manylinux container.
            # The cmake C build uses the cross gcc fine, but srt-sys/rist-sys's
            # bindgen runs clang with host include paths and can't find the
            # aarch64 system headers ("sys/types.h not found"). Point bindgen's
            # clang at the cross-toolchain sysroot (gated to the aarch64 job, so
            # the generic var only ever affects this cross build). x86_64 builds
            # natively and needs none of this.
            if [ "${{ matrix.target }}" = "aarch64" ]; then
              CROSS_GCC=/usr/aarch64-unknown-linux-gnu/bin/aarch64-unknown-linux-gnu-gcc
              SYSROOT="$("$CROSS_GCC" -print-sysroot 2>/dev/null || true)"
              [ -n "$SYSROOT" ] || SYSROOT=/usr/aarch64-unknown-linux-gnu/aarch64-unknown-linux-gnu/sysroot
              echo "aarch64 bindgen sysroot: $SYSROOT"
              export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$SYSROOT"
            fi
        env:
          SRT_FORCE_VENDORED: "1"
          RIST_FORCE_VENDORED: "1"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  macos-wheel:
    name: wheel (macos-${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: version-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-arm64 will be the gating macOS target after the
          # 2026-05-30 promotion window in the main CI workflow; for
          # consistency it gates here too.
          #
          # macOS x86_64 (Intel) is NOT built: GitHub's macos-13 Intel
          # runners are scarce and the leg routinely sat queued for hours,
          # holding up the `publish` job (whose `needs:` waits for every
          # matrix leg, even best-effort ones) — removed 2026-06-10.
          # Intel-Mac users install from the sdist. See
          # docs/project/deferred-features.md "macOS x86_64 (Intel)".
          - target: aarch64-apple-darwin
            runner: macos-14
            continue-on-error: false
    continue-on-error: ${{ matrix.continue-on-error }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}

      # librist's vendored build is meson + ninja-driven (NOT cmake). The
      # macOS runner ships cmake + perl but not meson/ninja — install via brew
      # (mirrors the gating ci.yml macOS prerequisites step, including its
      # `brew list` guard: `brew install` on an already-present formula —
      # ninja is on the image now — emits an "already installed" warning).
      - name: Install librist build prerequisites (meson + ninja)
        run: |
          # The macos-14 image ships a pre-tapped third-party `aws/tap`, and
          # Homebrew 6 requires explicit tap trust: until it is untapped every
          # brew call prints a `::warning::` annotation about it. Nothing here
          # uses that tap. (Observed 2026-09-05; drop when the image stops
          # shipping it.)
          brew untap aws/tap >/dev/null 2>&1 || true
          for pkg in meson ninja; do
            brew list --formula "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: bindings/python
          args: --release --out dist --features rtp,srt,udp,tcp,hls,rist,tls
        env:
          SRT_FORCE_VENDORED: "1"
          RIST_FORCE_VENDORED: "1"
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  windows-wheel:
    name: wheel (windows-x86_64)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: version-preflight
    # Best-effort: tst-c has windows-msvc compile+link only (runtime
    # tests deferred — see project_plan_65). The tst-py wheel may build
    # but isn't runtime-verified. We still cut a wheel so Windows users
    # who want to try it have a path; we just don't gate the publish on
    # its success.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          # rist is intentionally excluded from the Windows wheel: vendored
          # librist's rist_destroy hangs ≥14 s on teardown on Windows (a
          # librist bug, not ours). Shipping a module that hangs on drop is
          # worse than not shipping it. linux + macos wheels keep rist.
          #
          # `--no-default-features` is REQUIRED here: cargo/maturin features are
          # ADDITIVE, so without it the crate's `default` set (which includes
          # `rist`) would re-enable rist regardless of the `--features` list
          # below. We therefore disable defaults and list the exact Windows set
          # (everything in `default` EXCEPT rist; `pipeline` is pure-Rust and
          # kept for parity with the linux/macos wheels).
          args: --release --out dist --no-default-features --features rtp,srt,udp,tcp,hls,pipeline,tls
        env:
          SRT_FORCE_VENDORED: "1"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-windows-x86_64
          path: bindings/python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: version-preflight
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: bindings/python
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to PyPI
    # Only on tag pushes. workflow_dispatch + PR builds are dry-runs
    # that produce artifacts for download but don't upload anywhere.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux-wheel, macos-wheel, windows-wheel, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/tstrans/
    permissions:
      # Required for PyPI trusted publishing (OIDC). No API token
      # configured in repository secrets — PyPI verifies the OIDC claim
      # itself. Configure the trusted publisher on the PyPI side first:
      # https://docs.pypi.org/trusted-publishers/
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Inventory artifacts before upload
        run: |
          ls -la dist/
          echo "Wheel count: $(ls dist/*.whl 2>/dev/null | wc -l)"
          echo "Sdist count: $(ls dist/*.tar.gz 2>/dev/null | wc -l)"

      # PyPI is IMMUTABLE: a partial first release (a required wheel silently
      # missing because a best-effort job stole a runner, or a build-matrix
      # change broke an upload-artifact name) can never be corrected in place.
      # This gate asserts that every REQUIRED artifact is present EXACTLY ONCE
      # and exits non-zero (blocking the upload below) otherwise. The
      # best-effort targets are an EXPLICIT allow-list — anything not on it is
      # required. A bare count threshold is deliberately NOT used.
      #
      # HOW TO UPDATE WHEN THE BUILD MATRIX CHANGES (jobs above):
      #   - Wheels are abi3 (`abi3-py310` in bindings/python/Cargo.toml), so
      #     there is ONE wheel per platform tagged `cp310-abi3` — NOT one per
      #     Python minor. Each entry below is a unique platform tag.
      #   - REQUIRED  = the matrix legs with `continue-on-error: false`
      #                 (linux x86_64 + macos arm64) + the sdist.
      #   - BEST_EFFORT = the matrix legs with `continue-on-error: true`
      #                 (linux aarch64, windows x86_64).
      #   - Tags come from the maturin build args:
      #       linux x86_64  : `manylinux: 2_28` + target x86_64
      #                       -> manylinux_2_28_x86_64
      #       macos arm64   : target aarch64-apple-darwin + MACOSX_DEPLOYMENT_TARGET=11.0
      #                       -> macosx_11_0_arm64
      #   - The distribution name AND version are asserted too: the version is
      #     derived from the git tag (GITHUB_REF_NAME minus its leading `v`), and
      #     EVERY required artifact must match it in BOTH its filename and its
      #     embedded metadata (wheel .dist-info/METADATA `Version:` /
      #     sdist PKG-INFO `Version:`) — so a renamed, stale, or misversioned
      #     artifact (filename OR embedded) trips the gate before publish.
      - name: Require-set manifest gate (block partial PyPI publish) + version
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          echo "Expected version (from tag $GITHUB_REF_NAME): $EXPECTED_VERSION"
          EXPECTED_VERSION="$EXPECTED_VERSION" python3 - <<'PY'
          import glob, os, re, sys, zipfile, tarfile

          DIST = "dist"
          EXPECTED = os.environ["EXPECTED_VERSION"]
          if not EXPECTED:
              print("RELEASE GATE FAILED: empty EXPECTED_VERSION (tag not v-prefixed?)"); sys.exit(1)
          files = sorted(os.path.basename(p) for p in glob.glob(os.path.join(DIST, "*")))

          REQUIRED_WHEEL_PLATFORM_TAGS = ["manylinux_2_28_x86_64", "macosx_11_0_arm64"]
          BEST_EFFORT_PLATFORM_TAGS = ["manylinux_2_28_aarch64", "win_amd64"]

          def wheel_re(tag):
              return re.compile(r"^tstrans-" + re.escape(EXPECTED) + r"-cp310-abi3-" + re.escape(tag) + r"\.whl$")
          SDIST_RE = re.compile(r"^tstrans-" + re.escape(EXPECTED) + r"\.tar\.gz$")

          def wheel_metadata_version(path):
              with zipfile.ZipFile(path) as z:
                  names = [n for n in z.namelist() if n.endswith(".dist-info/METADATA")]
                  if not names: return None
                  for line in z.read(names[0]).decode("utf-8", "replace").splitlines():
                      if line.startswith("Version:"):
                          return line.split(":", 1)[1].strip()
              return None

          def sdist_pkginfo_version(path):
              with tarfile.open(path, "r:gz") as t:
                  names = [n for n in t.getnames() if n.endswith("/PKG-INFO") or n == "PKG-INFO"]
                  if not names: return None
                  f = t.extractfile(names[0])
                  for line in f.read().decode("utf-8", "replace").splitlines():
                      if line.startswith("Version:"):
                          return line.split(":", 1)[1].strip()
              return None

          print("Downloaded artifacts:")
          for f in files: print(f"  {f}")
          print(f"Expecting version: {EXPECTED}\n")

          errors = []

          for tag in REQUIRED_WHEEL_PLATFORM_TAGS:
              rx = wheel_re(tag)
              matches = [f for f in files if rx.match(f)]
              if len(matches) == 0:
                  errors.append(f"MISSING required wheel: tstrans-{EXPECTED}-cp310-abi3-{tag}.whl")
              elif len(matches) > 1:
                  errors.append(f"DUPLICATE required wheel {tag}: {matches}")
              else:
                  mv = wheel_metadata_version(os.path.join(DIST, matches[0]))
                  if mv != EXPECTED:
                      errors.append(f"WHEEL METADATA Version {mv!r} != tag {EXPECTED!r} for {matches[0]}")

          sdists = [f for f in files if SDIST_RE.match(f)]
          if len(sdists) == 0:
              errors.append(f"MISSING required sdist: tstrans-{EXPECTED}.tar.gz")
          elif len(sdists) > 1:
              errors.append(f"DUPLICATE sdist: {sdists}")
          else:
              pv = sdist_pkginfo_version(os.path.join(DIST, sdists[0]))
              if pv != EXPECTED:
                  errors.append(f"SDIST PKG-INFO Version {pv!r} != tag {EXPECTED!r} for {sdists[0]}")

          # Best-effort wheels: absence is OK, but a PRESENT one must be the right
          # version (a stale/misversioned best-effort wheel must not slip through).
          for tag in BEST_EFFORT_PLATFORM_TAGS:
              anyrx = re.compile(r"^tstrans-[^-]+-cp310-abi3-" + re.escape(tag) + r"\.whl$")
              present = [f for f in files if anyrx.match(f)]
              if not present:
                  print(f"best-effort {tag}: absent (allowed)")
              elif all(wheel_re(tag).match(f) for f in present):
                  print(f"best-effort {tag}: present at {EXPECTED}")
              else:
                  errors.append(f"best-effort wheel {tag} present at wrong version (expected {EXPECTED}): {present}")
          print()

          if errors:
              print("RELEASE GATE FAILED — refusing to publish:")
              for e in errors: print(f"  - {e}")
              sys.exit(1)
          print(f"Release manifest gate OK: required wheels + sdist present exactly once at {EXPECTED} (filename + embedded metadata).")
          PY

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Trusted publishing — no `password:` needed. PyPI looks up
          # the trusted publisher config for `tstrans` and verifies the
          # GitHub OIDC claim (repo, workflow, environment).
          packages-dir: dist
          # `skip-existing: true` prevents the action failing if a wheel
          # for this version was already published (e.g. resumed run).
          skip-existing: true
