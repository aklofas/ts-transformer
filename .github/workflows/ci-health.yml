name: ci-health

# Weekly CI health snapshot: rerun rate per job,
# wedges, first-attempt failures over the last 7 days, from the Actions
# REST API. Output = step summary + a CSV artifact (90-day retention). The
# CSV artifact is the only record (no in-tree copy: the one-row ledger
# docs/project/ci-health.csv was removed 2026-10-19 as unread) — this
# workflow deliberately keeps `contents: read`: it writes nothing but its
# step summary and artifact, and makes no bot commits to main.

on:
  schedule:
    # Mondays 06:00 UTC — after the interop cron (05:00) has queued, so the
    # snapshot's window boundary does not split a Monday run.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    name: CI health snapshot (last 7 days)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        # No submodules: the script reads the REST API and jq only.

      - name: Aggregate runs + reruns
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/dev/ci-health.sh --append ci-health-week.csv

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-health-${{ github.run_id }}
          path: ci-health-week.csv
          retention-days: 90
