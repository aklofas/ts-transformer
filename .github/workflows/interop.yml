name: interop

# Weekly public interop evidence: exchanges the `tst-interop` driver's
# synthetic MPEG-TS/KLV traffic with real third-party tools (ffmpeg,
# TSDuck's tsp, GStreamer, VLC, mpv) over live network sessions plus local
# analyze/decode probes, across every transport this workspace supports
# and every canonical stream profile. See scripts/interop/README.md for
# the full cell inventory, tier semantics, and the known-gap catalogue
# expectations.toml already documents.
#
# This is the continuously-refreshed public interop evidence: the run's
# GITHUB_STEP_SUMMARY table + uploaded artifacts are what a consumer reads
# to see this codebase actually interoperate with real tools on a stock
# runner, not another closed-loop self-test. The full census runs on
# linux-x86_64; a second job runs the `[arm64_subset]` cells of
# expectations.toml on linux-aarch64 and keeps its own census.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      dry_run:
        type: boolean
        required: false
        default: false
  schedule:
    # Mondays 05:00 UTC — weekly cadence, off-peak, and clear of the
    # sanitizers.yml nightly (03:00 UTC daily).
    - cron: '0 5 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'crates/tst-interop/**'
      - 'scripts/interop/**'
      - '.github/workflows/interop.yml'
      - '.github/actions/rust-setup/**'
      - 'rust-toolchain.toml'
      # A demux/mux change used to reach main before ffmpeg/tsduck/GStreamer
      # saw it (Monday cron). ~25 min warm; the
      # census assert (161 declared cells, 0 skips) now gates those PRs too.
      - 'crates/tst-core/src/mpegts/**'
      # The rtsp-publish/* cells are the only real-tool check of the RTSP
      # server's publish path (ANNOUNCE/RECORD, the re-muxer, SDP parsing,
      # the H.264 depacketizer and the sender-report parsing that feeds
      # alignment).
      - 'crates/tst-rtp/src/rtsp/**'
      - 'crates/tst-rtp/src/sdp/**'
      - 'crates/tst-rtp/src/h264/**'
      - 'crates/tst-rtp/src/rtcp/**'
      # The WebRTC server runs the interop matrix on its changes too, and so
      # does the reference player the whep/* cells load in headless Chrome.
      - 'crates/tst-webrtc/**'
      - 'docs/webrtc/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  interop-matrix:
    name: interop matrix (linux-x86_64)
    runs-on: ubuntu-latest
    # Worst-case budget: 161 cells at the run-matrix.sh default of 10s
    # each, plus per-cell settle/timeout margin (lib.sh's cell_timeout)
    # and a --release build of tst-interop's native-linking dependency
    # chain (tst-srt + tst-rist, i.e. vendored libsrt/librist/mbedTLS).
    # ~45-60 min observed budget arithmetic; 90 min leaves real margin
    # without letting one wedged cell burn the 6-hour job default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Install build prerequisites
        # build-essential/cmake/pkg-config: vendored libsrt + mbedTLS
        # (cmake-driven, mirrors ci.yml's Linux prereqs). meson/ninja-build:
        # vendored librist (meson-driven). Both native builds run as part
        # of the `cargo build --release -p tst-interop` step below, since
        # tst-interop depends on tst-srt + tst-rist directly.
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build

      - name: Install peer tools
        # Real third-party tools this matrix exchanges traffic with (see
        # scripts/interop/README.md's cell inventory). A tool absent from
        # PATH degrades its cells to SKIPPED_TOOL_MISSING (lib.sh's
        # `have()`), never a fake pass/fail — this list is deliberately
        # narrower than "every tool the matrix could ever exercise":
        #   - ffmpeg: also provides ffprobe (the analyze/ffprobe cells).
        #   - vlc: also provides cvlc (decode/vlc, rtsp-serve/vlc-probe,
        #     rtsp-consume's VLC-serves leg).
        #   - mpv: decode/mpv cells.
        #   - gstreamer1.0-tools: gst-launch-1.0, needed by the
        #     transport-axis SRT "gst" cells (srt/us-to-gst,
        #     srt/gst-to-us).
        #   - gstreamer1.0-plugins-bad: srtsink/srtsrc — the GStreamer SRT
        #     elements those same two cells actually build a pipeline
        #     with. NOT on PATH via gstreamer1.0-tools alone (pulls in
        #     plugins-base + plugins-good as apt dependencies for free).
        #     Load-bearing, not optional polish: without it, gst-launch-1.0
        #     itself is still present, so `have()` would NOT skip these
        #     cells — the pipeline would instead fail to build ("no such
        #     element or plugin"), a different failure text than the
        #     documented SRT-tail-loss finding expectations.toml's
        #     `failure_contains = "stream_sha256 mismatch"` keys on for
        #     srt/gst-to-us, and srt/us-to-gst has no expectations row at
        #     all (it's expected to PASS) — either way a surprise FAIL
        #     that would red this job for the wrong reason.
        #   - gstreamer1.0-plugins-base-apps: gst-play-1.0, the
        #     decode/gst-play cells across all 12 profiles. Enabled
        #     2026-08-20 after the local pre-evidence run this comment
        #     block previously demanded: all 12 cells exercised on the
        #     dev box (same Ubuntu 24.04 / GStreamer 1.24.2 stack as
        #     this runner), payload/env noise phrasings harvested into
        #     lib.sh's DECODE_PAYLOAD_NOISE / GST_PLAY_ENV_NOISE from
        #     the captured logs, 12/12 PASS after filtering — no
        #     expectations.toml rows needed.
        #   - gstreamer1.0-libav: avdec_h264/avdec_h265 — the decoder
        #     elements playbin builds for the decode/gst-play cells and
        #     the exact element names the harvested filler-AU noise
        #     phrasings come from. Load-bearing for those cells the same
        #     way plugins-bad is for the SRT ones: without it playbin
        #     fails with a DIFFERENT text ("missing plugin: decoder
        #     ...") that the payload-noise filter deliberately does not
        #     cover, so the cells would red for an environment reason,
        #     not an input-file reason. (av1-klv-*/h266-klv need no
        #     decoder: GStreamer 1.24 wires no AV1-in-TS / VVC playbin
        #     path, and the cells pass silently — see lib.sh.)
        #   - gstreamer1.0-rtsp: rtspclientsink, the RTSP publisher the
        #     rtsp-publish/gst-push-* cells push with. Same load-bearing
        #     shape as plugins-bad: without it gst-launch-1.0 is present,
        #     so `have()` does not skip, and the pipeline fails to build.
        #   - jq: required by run-matrix.sh/lib.sh's own JSON handling
        #     (README.md).
        #   - google-chrome (not installed here): the headless browser the
        #     whep/* cells drive is on the ubuntu-latest image already
        #     (Google Chrome 155 at the time of writing); lib.sh's
        #     `whep_browser` also accepts a `chromium` binary. Each whep cell
        #     log records the version it ran.
        run: |
          sudo apt-get -o Acquire::Retries=5 install -y ffmpeg vlc mpv gstreamer1.0-tools gstreamer1.0-plugins-bad gstreamer1.0-plugins-base-apps gstreamer1.0-libav gstreamer1.0-rtsp jq

      - name: Install TSDuck
        # Not in Ubuntu's apt repos — install the pinned upstream .deb
        # release directly, verified by sha256 before dpkg -i. A version
        # bump is a deliberate PR, never an automatic
        # float. Asset picked to match ubuntu-latest's current OS (Ubuntu
        # 24.04 — see actions/runner-images' README; ubuntu-latest is a
        # migrating label, so a future bump to 26.04 should revisit this
        # asset name + version together, not just re-pin the version).
        #
        # TSDuck's GitHub releases publish no vendor checksum for this
        # asset, so TSDUCK_DEB_SHA256 below is self-computed: downloaded
        # the .deb and ran sha256sum on it directly (independently
        # re-verified in review). It still catches tampering/corruption in
        # transit — there's just no upstream-signed value to pin against
        # instead. A version bump means downloading the new asset and
        # recomputing this hash deliberately, not just editing the URL.
        env:
          TSDUCK_DEB_URL: "https://github.com/tsduck/tsduck/releases/download/v3.44-4676/tsduck_3.44-4676.ubuntu24_amd64.deb"
          TSDUCK_DEB_SHA256: "03a983a5147c5f733ef89aafd23f2d83e19a9e987ae4a575a7ee62ab4b16986e"
        run: |
          curl -sL --retry 5 -o /tmp/tsduck.deb "$TSDUCK_DEB_URL"
          echo "$TSDUCK_DEB_SHA256  /tmp/tsduck.deb" | sha256sum -c -
          sudo dpkg -i /tmp/tsduck.deb || sudo apt-get -o Acquire::Retries=5 install -y -f
          rm -f /tmp/tsduck.deb
          tsp --version

      - name: Rust toolchain, cargo cache
        # Own key prefix (cargo-interop-): this is a --release build of a
        # crate no other workflow builds. Never let a differently-built
        # native artifact hide behind another job's cache key — that
        # applies here too even though this job has no sanitizer
        # instrumentation to protect against: a stale non-release target/
        # layout from a hypothetical future debug step in this same
        # workflow must not collide with another workflow's cache either.
        uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-interop-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          cache-restore-key: cargo-interop-${{ runner.os }}-

      - name: cargo build --release -p tst-interop
        # --release: run-matrix.sh's $BIN points at target/release/tst-interop
        # (a live 161-cell matrix needs the muxer/demuxer at real speed, not
        # a debug build). SRT/RIST_FORCE_VENDORED: this runner has no
        # system libsrt/librist, so pkg-config would already fall through
        # to vendored — set explicitly anyway, matching every other
        # workflow's convention, so a future runner-image change can never
        # silently link a stray system copy instead.
        env:
          SRT_FORCE_VENDORED: "1"
          RIST_FORCE_VENDORED: "1"
        run: cargo build --release -p tst-interop

      - name: Run interop matrix
        # scripts/interop/run-matrix.sh drives every cell across every
        # canonical profile and writes results.json/results.md itself (see
        # the script's own doc comment) before exiting. Its exit code is
        # `report merge`'s: 0 iff every FAIL matched a documented row in
        # expectations.toml, nonzero on any unexpected FAIL — that decides
        # this step's (and hence this job's) conclusion. No `if:` guard
        # here on purpose: a failure here is what SHOULD fail the job. The
        # two steps below use `if: always()` so the evidence still gets
        # published even when this step fails.
        #
        # Per-version drift caveat: expectations.toml's rows encode tool
        # behavior verified on specific peer-tool versions (several
        # `reason` fields cite an exact ffmpeg build, e.g. 6.1.1) captured
        # on a dev box, not on this runner. ubuntu-latest ships whatever
        # ffmpeg/vlc/mpv/gstreamer patch level is current on Ubuntu 24.04
        # at the time this job runs, which will drift over the weeks/months
        # this schedule keeps firing. A future tool bump surfacing a new
        # FAIL, or a stale-expectation warning (a documented gap starts
        # passing), is this system working as designed — not a bug in this
        # workflow. Add or adjust an expectations.toml row only when a
        # cell demonstrably diverges on this runner, and name the observed
        # version in that row's `reason`.
        run: |
          bash scripts/interop/run-matrix.sh \
            --outdir "$RUNNER_TEMP/interop" \
            --seconds 10

      - name: Assert census completeness
        # Fail-closed inventory check: `report merge --inventory` enforces
        # the per-cell identity
        # multiset (missing/duplicate/extra cells, undeclared skips, and
        # stale expectation rows all fail the merge itself, before this
        # step ever runs — see crates/tst-interop/src/report/matrix.rs); this
        # step is the second line, re-checking the merged report's own
        # numbers so a `report merge` that somehow wrote a truncated
        # census still can't slip through as green. The expected count
        # is not written here: it is the `[census] full_cells` value in
        # scripts/interop/expectations.toml, which the merge records as
        # `inventory.expected_full_cells`. The advertised shape is the
        # full census with ZERO tool-missing skips and ZERO stale
        # expectation rows; anything else fails this job.
        #
        # `au_sizes` is checked alongside them because the census alone
        # cannot tell the two AU-size modes apart: a matrix run at the
        # old fixed `compact` sizes produced exactly the same numbers as
        # one at the `realistic` GOP-structured sizes this evidence is
        # published as, so a silent regression to compact would go
        # unnoticed in the very numbers meant to attest to it.
        run: |
          r="$RUNNER_TEMP/interop/results.json"
          shape=$(jq -r '.inventory.shape' "$r")
          declared=$(jq '.inventory.declared_cells' "$r")
          expected=$(jq '.inventory.expected_full_cells' "$r")
          skips=$(jq '.inventory.allowed_skips | length' "$r")
          total=$(jq '.summary.total' "$r")
          skipped=$(jq '.summary.skipped_tool_missing' "$r")
          stale=$(jq '.summary.stale_expectations | length' "$r")
          au_sizes=$(jq -r '.meta.au_sizes' "$r")
          case "$shape" in full-*) shape_ok=1 ;; *) shape_ok=0 ;; esac
          if [ "$shape_ok" != "1" ] || [ "$declared" != "$expected" ] || [ "$total" != "$expected" ] \
             || [ "$skips" != "0" ] || [ "$skipped" != "0" ] || [ "$stale" != "0" ] \
             || [ "$au_sizes" != "realistic" ]; then
            echo "::error::census mismatch: shape=$shape declared=$declared expected=$expected allowed_skips=$skips total=$total skipped=$skipped stale=$stale au_sizes=$au_sizes"
            exit 1
          fi
          echo "census complete: $shape declared and produced at realistic AU sizes, 0 skips, 0 stale rows"

      - name: Publish step summary
        # Re-render with --github-summary so the verdict table appears
        # directly on the workflow run's summary page, not only inside the
        # uploaded artifact. Cheap: reads the results.json the matrix step
        # above already wrote: no re-run. Guarded on the file's existence
        # rather than letting a missing-file error double-report the
        # failure — a results.json can only be absent if the matrix step
        # died before ever reaching `report merge` (e.g. a bootstrap
        # gen/verify FATAL), which the previous step has already failed
        # the job for.
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/interop/results.json" ]]; then
            target/release/tst-interop report render \
              --in "$RUNNER_TEMP/interop/results.json" \
              --out "$RUNNER_TEMP/interop/results.md" \
              --github-summary
          else
            echo "::warning::results.json not found — the matrix run failed before completing report merge; nothing to summarize (see the previous step's log)." >&2
          fi

      - name: Upload interop evidence
        # cells/ and logs/ get created (mkdir -p) at the very start of
        # run-matrix.sh, so they exist even on an early failure;
        # if-no-files-found: warn covers the results.json/.md pair on that
        # same early-failure path without failing this step.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: interop-evidence
          path: |
            ${{ runner.temp }}/interop/results.json
            ${{ runner.temp }}/interop/results.md
            ${{ runner.temp }}/interop/inventory.json
            ${{ runner.temp }}/interop/cells
            ${{ runner.temp }}/interop/logs
            ${{ runner.temp }}/interop/work/*-recv.json
            ${{ runner.temp }}/interop/work/*-whep.json
            ${{ runner.temp }}/interop/work/*-console.txt
            ${{ runner.temp }}/interop/work/*-chrome.stderr.gz
          retention-days: 90
          if-no-files-found: warn

  interop-arm64:
    name: interop subset (linux-aarch64)
    # Scheduled, dispatched and called (release-qualify) runs, never pull
    # requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    # Its census is recorded beside the x86_64 one (the qualification record
    # keeps both; the 1.0 exit criteria read this one) while the release
    # verdict reads the x86_64 census, so a red subset never fails the
    # workflow a release-qualify run calls. A census file that exists but is
    # malformed does fail the qualification record: it is never read as absent.
    # The job turns gating (this line is removed) once two scheduled runs are
    # green; until then the arm runner's peer-tool set is still being measured.
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Install build prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential cmake pkg-config meson ninja-build

      - name: Install peer tools
        # The x86_64 job's list minus the players the subset leaves out
        # (vlc, mpv, gst-play-1.0) and Chrome. A package missing from the arm
        # index fails this step, and a tool missing from PATH skips its
        # cells (see the skip step below).
        run: |
          sudo apt-get -o Acquire::Retries=5 install -y ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-rtsp jq

      - name: Install TSDuck
        # The arm64 asset of the release the x86_64 job pins, its sha256
        # self-computed the same way (no upstream checksum is published).
        env:
          TSDUCK_DEB_URL: "https://github.com/tsduck/tsduck/releases/download/v3.44-4676/tsduck_3.44-4676.ubuntu24_arm64.deb"
          TSDUCK_DEB_SHA256: "09e728567c9e1eac619a440dfd22393eaaf04c0ab09711498cd5f787a7c7cae2"
        run: |
          curl -sL --retry 5 -o /tmp/tsduck.deb "$TSDUCK_DEB_URL"
          echo "$TSDUCK_DEB_SHA256  /tmp/tsduck.deb" | sha256sum -c -
          sudo dpkg -i /tmp/tsduck.deb || sudo apt-get -o Acquire::Retries=5 install -y -f
          rm -f /tmp/tsduck.deb
          tsp --version

      - name: Rust toolchain, cargo cache
        uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-interop-arm64-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          cache-restore-key: cargo-interop-arm64-${{ runner.os }}-

      - name: cargo build --release -p tst-interop
        env:
          SRT_FORCE_VENDORED: "1"
          RIST_FORCE_VENDORED: "1"
        run: cargo build --release -p tst-interop

      - name: Skip the cells of peer tools this runner lacks
        # The subset is trimmed to what runs here: each tool `which` does not
        # find adds its cells to --allowed-skips, and the step summary names
        # them. Nothing is trimmed when every tool is present.
        id: skips
        run: |
          skips=()
          trim() { # <tool> <cell pattern...>
            local tool=$1
            shift
            if which "$tool" >/dev/null 2>&1; then return; fi
            echo "- \`$tool\` is missing: $*" >> "$GITHUB_STEP_SUMMARY"
            skips+=("$@")
          }
          echo "### linux-aarch64 subset: cells trimmed for missing tools" >> "$GITHUB_STEP_SUMMARY"
          trim ffmpeg srt/us-to-ffmpeg srt/ffmpeg-to-us srt/us-to-ffmpeg-encrypted srt/ffmpeg-to-us-encrypted \
            'srt-live/us-to-ffmpeg/*' 'srt-live/ffmpeg-to-us/*' rist/us-to-ffmpeg rist/ffmpeg-to-us rtsp-serve/ffmpeg-pull
          trim tsp srt/us-to-tsp srt/tsp-to-us srt/us-to-tsp-encrypted srt/tsp-to-us-encrypted \
            'srt-live/us-to-tsp/*' 'srt-live/tsp-to-us/*' rist/us-to-tsp rist/tsp-to-us 'analyze/tsp-analyze/*'
          trim tsanalyze 'analyze/tsanalyze/*'
          trim gst-launch-1.0 srt/us-to-gst srt/gst-to-us 'rtsp-publish/*'
          [ "${#skips[@]}" -gt 0 ] || echo "none: every peer tool the subset uses is installed" >> "$GITHUB_STEP_SUMMARY"
          list=$(IFS=,; echo "${skips[*]}")
          echo "allowed=$list" >> "$GITHUB_OUTPUT"

      - name: Run the arm64 subset
        env:
          ALLOWED_SKIPS: ${{ steps.skips.outputs.allowed }}
        run: |
          args=(--outdir "$RUNNER_TEMP/interop" --seconds 10 --only-subset arm64)
          [ -z "$ALLOWED_SKIPS" ] || args+=(--allowed-skips "$ALLOWED_SKIPS")
          bash scripts/interop/run-matrix.sh "${args[@]}"

      - name: Write the census
        # The record the qualification collector reads as
        # interop-census-aarch64.json; absent when the matrix wrote no results.
        if: always()
        run: |
          r="$RUNNER_TEMP/interop/results.json"
          [ -f "$r" ] || { echo "::warning::no results.json; no census written"; exit 0; }
          jq '{arch: "linux-aarch64", shape: .inventory.shape, total: .summary.total, pass: .summary.pass,
               fail: .summary.fail, expected_unsupported: .summary.expected_unsupported,
               skipped: .summary.skipped_tool_missing, stale: (.summary.stale_expectations | length)}' \
            "$r" > "$RUNNER_TEMP/interop-census-aarch64.json"
          cat "$RUNNER_TEMP/interop-census-aarch64.json"
          target/release/tst-interop report render --in "$r" --out "$RUNNER_TEMP/interop/results.md" --github-summary

      - name: Upload the census
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: interop-census-aarch64
          path: ${{ runner.temp }}/interop-census-aarch64.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload interop evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: interop-evidence-aarch64
          path: |
            ${{ runner.temp }}/interop/results.json
            ${{ runner.temp }}/interop/results.md
            ${{ runner.temp }}/interop/inventory.json
            ${{ runner.temp }}/interop/cells
            ${{ runner.temp }}/interop/logs
            ${{ runner.temp }}/interop/work/*-recv.json
          retention-days: 90
          if-no-files-found: warn
