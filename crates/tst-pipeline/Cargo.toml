[package]
name         = "tst-pipeline"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
description  = "TS Transformer pipeline shells: Sender, MuxSender, RawSender, Receiver, DemuxReceiver, RawReceiver, ManagedTransport, reconnect strategies."
keywords     = ["mpeg-ts", "streaming", "sender", "receiver"]
categories   = ["multimedia::video", "network-programming"]

[features]
default = ["std"]
# `std` pulls in the Managed* reconnect wrappers, mux_publisher, ext::pairing, binding,
# and the std-backed tracing subscriber integration. Without it the crate is
# #![no_std] + alloc and still exposes both the sender shells (MuxSender /
# Sender / RawSender) and the receiver shells (Receiver / DemuxReceiver /
# RawReceiver) — only MuxSender's internal lock swaps to the no_std spin-lock
# backend (the receiver shells hold no internal lock).
std = ["tst-core/std", "tracing/std"]

[dependencies]
tst-core  = { path = "../tst-core", version = "0.6.0", default-features = false }
thiserror = { workspace = true }
# Single facade for diagnostics workspace-wide. `default-features = false`
# keeps the macros usable under no_std+alloc; the `std` feature re-adds the
# std subscriber integration.
tracing   = { version = "0.1", default-features = false }
# no_std lock backend (single-core embedded sender never contends). Referenced
# only under cfg(not(feature = "std")) via crate::mutex.
spin      = { version = "0.9", default-features = false, features = ["spin_mutex"] }

[dev-dependencies]
criterion       = { workspace = true }
proptest        = { workspace = true }
tst-test-helpers = { path = "../tst-test-helpers" }
# Captures `tracing` events in tests for assertion.
# `no-env-filter` makes the subscriber accept events from any crate (not just
# the test binary), which is needed for integration tests that assert on
# events emitted by tst-pipeline library code.
tracing-test    = { version = "0.2", features = ["no-env-filter"] }

# Maintainer tool, not part of the published surface: renders the
# BindingErrorKind table for scripts/check/repo/kind-equivalence.sh.
[[bin]]
name  = "print-kinds"
required-features = ["std"]
path  = "tests/tools/print_kinds.rs"
test  = false
bench = false

[[bench]]
name    = "syncer"
harness = false

[[bench]]
name    = "pairer"
harness = false
