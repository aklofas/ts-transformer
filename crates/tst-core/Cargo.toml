[package]
name         = "tst-core"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
description  = "TS Transformer core: pure MPEG-TS mux/demux, KLV (MISB ST 0601), codec parameter-set parsers, and transport trait definitions."
keywords     = ["mpeg-ts", "klv", "misb", "mux", "demux"]
categories   = ["multimedia::video", "parser-implementations", "no-std"]

[features]
default = ["std", "file"]
# `std` pulls in everything that needs the standard library: file I/O,
# the net helpers, the thread/Barrier cancel path, and the std-only
# serialization deps. Without it the crate is #![no_std] + alloc.
std  = ["file", "serde/std", "tracing/std", "sha2/std", "dep:serde_json", "dep:toml", "portable-atomic/std", "dep:socket2"]
file = ["std"]  # std::fs-using helpers in io_file (must imply std)

[dependencies]
thiserror    = { workspace = true }
libc         = { workspace = true }  # raw setsockopt in net::udp_socket (cfg(unix) helpers)
tracing      = { version = "0.1", default-features = false }
serde        = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json   = { version = "1", optional = true }
toml         = { version = "0.8", optional = true }
sha2         = { version = "0.10", default-features = false }
hashbrown    = { version = "0.15", default-features = false, features = ["default-hasher"] }
# Float math (log2/ceil/powf/floor/round) used by KLV IMAPB / ST 0601 mapping.
# core has no float intrinsics, so the no_std build routes through libm; under
# std the inherent f64 methods are used (see `float_ext`).
libm         = { version = "0.2", default-features = false }
# `SrtCancelHandle` stores its 64-bit handle in an atomic. 32-bit bare-metal
# targets (thumbv7em, riscv32imac) lack a native `AtomicI64`; portable-atomic
# synthesizes one from the target's 32-bit CAS so the cancel primitive stays
# lock-free-API and available under no_std. On 64-bit/std it forwards to core.
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }
# socket2 is used in the `std`-gated net module for:
# - SO_RCVBUF / SO_SNDBUF helpers (set_socket_buffers, shared by tst-udp/tst-tcp)
# - SO_REUSEADDR on multicast recv binds (bind_udp_socket_multicast)
# - IP_MULTICAST_IF on Windows (SockRef cross-platform setsockopt)
# Enabled only under the `std` feature (socket2 requires std; no_std bare-metal
# targets can't link it). The net module itself is #[cfg(feature = "std")]-gated
# in lib.rs, so the dep and the module are always in sync.
# The "all" feature is required for Socket::set_reuse_port, which is only
# compiled on the BSD/macOS cfg arm — a Linux-only build check cannot catch
# its absence (macOS CI does).
socket2      = { workspace = true, optional = true, features = ["all"] }

[dev-dependencies]
proptest         = { workspace = true }
tracing-test     = { version = "0.2", features = ["no-env-filter"] }
tempfile         = "3"
criterion        = { workspace = true }
tst-test-helpers = { path = "../tst-test-helpers" }

[[bench]]
name    = "mux_throughput"
harness = false

[[bench]]
name    = "klv_decode"
harness = false

[[bench]]
name    = "demuxer_ingest"
harness = false

[[bench]]
name    = "codec_parsers"
harness = false

# Maintainer fixture-generators. Build with `cargo run -p tst-core --bin <name>`.
# Not part of the published library surface — they live under tests/tools/ and
# regenerate the fixtures consumed by integration tests.
[[bin]]
name  = "gen-synthetic-fixtures"
required-features = ["std"]
path  = "tests/tools/gen_synthetic_fixtures.rs"
test  = false
bench = false
doc   = false

[[bin]]
name  = "gen-subtitle-fixtures"
