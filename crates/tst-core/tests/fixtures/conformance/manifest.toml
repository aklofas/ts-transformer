# RExt Main 4:4:4 profile (general_profile_idc=4) with sps_scaling_list_data_present_flag=true.
# Our parser returns EngineError when scaling_list_enabled_flag=1 AND
# sps_scaling_list_data_present_flag=1 — the custom scaling-list walk
# (H.265 §7.3.4) is not yet implemented, which is a parser gap, not a
# profile-level rejection, so it must not surface as UnsupportedProfile.
# This vector was chosen to exercise that bail path.
# Source: RExt/QMATRIX_A_RExt_Sony_1.zip — quantization matrix (scaling list) test (2014-07-03).
# Archive size: 236,406 bytes. Inner bitstream: 236,915 bytes.
[[h265]]
name = "QMATRIX_A_RExt_Sony_1"
archive_url = "https://www.itu.int/wftp3/av-arch/jctvc-site/bitstream_exchange/draft_conformance/RExt/QMATRIX_A_RExt_Sony_1.zip"
extract = "QMATRIX_A_RExt_Sony_1/QMATRIX_A_RExt_Sony_1.bit"
sha256 = "45123e91b5d0dc9bffc09735ec532bc23a32bbcdecc1a0c7972301fef09be065"
kind = "h265_sps"
nal_index = 0

[h265.expected]
outcome = "err"
error = "EngineError"

