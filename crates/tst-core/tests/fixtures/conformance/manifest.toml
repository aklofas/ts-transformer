name = "MR1_BT_A"
archive_url = "https://www.itu.int/wftp3/av-arch/jvt-site/draft_conformance/AVCv1/MR1_BT_A.zip"
extract = "MR1_BT_A.h264"
sha256 = "a76d4e199e6ffb27292d1a07c516e5adea251e63e3f756de490c153b23d4684d"
kind = "h264_sps"
nal_index = 0

[h264.expected]
outcome = "ok"

[h264.expected.fields]
profile_idc = 66
level_idc = 11
width = 176
height = 144
chroma_format = "Yuv420"
bit_depth_luma = 8
bit_depth_chroma = 8

