# Codec conformance parameter-set manifest.
#
# Canonical input to `crates/tst-core/tests/tools/strip_conformance_parameter_sets.rs`.
# Each entry declares one upstream conformance bitstream archive and the
# expected parser outcome for the first parameter-set unit of the given kind.
#
# URL provenance:
#   H.264 — JVT-AVC draft_conformance at https://www.itu.int/wftp3/av-arch/jvt-site/draft_conformance/
#            (the top-level bitstream_exchange/ dir is empty)
#   H.265 — JCT-VC HEVC_v1 at https://www.itu.int/wftp3/av-arch/jctvc-site/bitstream_exchange/draft_conformance/HEVC_v1/
#            RExt profile at https://www.itu.int/wftp3/av-arch/jctvc-site/bitstream_exchange/draft_conformance/RExt/
#   H.266 — JVET draft6 at https://www.itu.int/wftp3/av-arch/jvet-site/bitstream_exchange/VVC/draft_conformance/draft6/
#   AV1   — AOMedia test vectors at https://storage.googleapis.com/aom-test-data/
#
# Field semantics:
#   archive_url  — URL of the archive to download (zip or direct bitstream).
#   sha256       — sha256sum of the file at archive_url (64 hex chars).
#   extract      — filename inside the zip to use as the bitstream.
#                  Empty string when archive_url points directly to the bitstream.
#   kind         — which parser entry point to invoke: h264_sps | h265_sps | h265_vps |
#                  h266_sps | h266_vps | av1_sequence_header.
#   nal_index    — 0-based index of the target NAL unit in scan order (h264/h265/h266).
#   obu_index    — 0-based index of the target OBU in scan order (av1).
#   level_idc    — H.264: level × 10 (e.g. 21 = Level 2.1); H.265: level × 30
#                  (e.g. 120 = Level 4.0); H.266: per H.266 Table A.3 (e.g. 51 = Level 3.1).
#
# expected.outcome = "ok"  → parser must succeed and all declared fields must match.
# expected.outcome = "err" → parser must return the named CodecParseError variant.
#
# Valid chroma_format values: "Monochrome", "Yuv420", "Yuv422", "Yuv444"
# Valid error values: "TruncatedRbsp", "InvalidGolomb", "ReservedValue",
#   "UnsupportedProfile", "DanglingSpsReference", "DanglingVpsReference",
#   "EngineError", "InvalidLeb128", "BadSyncWord", "Truncated", "Forbidden"

# ---------------------------------------------------------------------------
# H.264 / AVC  — JVT-AVC draft_conformance, AVCv1 and FRExt sub-trees
# ---------------------------------------------------------------------------

# Baseline profile (profile_idc=66 Constrained Baseline, level 1.1).
# Source: AVCv1/MR1_BT_A.zip — "Main Rate point 1, British Telecom" (2003-08-04).
# Archive size: 1,714,616 bytes.
