[package]
name        = "tst-rist"
description = "Safe Rust wrapper around librist (RIST Simple + Main profiles)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
keywords    = ["rist", "video", "streaming", "mpeg-ts"]
categories  = ["multimedia::video", "network-programming"]

[lib]
doctest = false

[dependencies]
rist-sys     = { package = "tstrans-rist-sys", path = "../rist-sys", version = "0.9.0", default-features = false }
tst-core     = { path = "../tst-core", version = "0.9.0" }
tst-pipeline = { path = "../tst-pipeline", version = "0.9.0" }
libc         = { workspace = true }
secrecy      = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }

[features]
default = ["mbedtls"]

# The one switch for native librist crypto and the wrapper's AES-128/192/256
# PSK encryption: rist-sys is taken without its defaults, so its mbedtls
# feature is on only through this one.
mbedtls = ["rist-sys/mbedtls"]

[dev-dependencies]
tst-core = { path = "../tst-core", features = ["conformance"] }

[lints]
workspace = true
