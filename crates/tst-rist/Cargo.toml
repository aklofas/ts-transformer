[package]
name        = "tst-rist"
description = "Safe Rust wrapper around librist (RIST Simple + Main profiles)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
keywords    = ["rist", "video", "streaming", "mpeg-ts"]
categories  = ["multimedia::video", "network-programming"]

[lib]
doctest = false

[dependencies]
rist-sys  = { package = "tstrans-rist-sys", path = "../rist-sys", version = "0.6.0" }
tst-core  = { path = "../tst-core", version = "0.6.0" }
tst-pipeline = { path = "../tst-pipeline", version = "0.6.0" }
libc      = { workspace = true }
secrecy   = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

[dev-dependencies]

[features]
default = ["mbedtls"]

# Enable AES-128/192/256 PSK encryption. Re-exports rist-sys's mbedtls feature
# so consumers get one feature flag.
mbedtls = ["rist-sys/mbedtls"]
