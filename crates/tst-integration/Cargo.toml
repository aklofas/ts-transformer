[package]
name = "tst-integration"
version.workspace = true
edition = "2024"
rust-version = "1.85"
publish = false
description = "Cross-binding scenario harness: golden-envelope contract + scenarios that the Rust, Python, and C adapters all reproduce byte-for-byte, with a gen-scenarios --check drift rail. Not for external consumption."

# Kebab-case target name (cargo::non_kebab_case_bins) over an unchanged
# src/bin/ file, so the path the privacy rail scans stays put.
[[bin]]
name = "gen-scenarios"
path = "src/bin/gen_scenarios.rs"

[features]
default = []
c = []       # opt-in: exercises the C adapter (needs libtstrans built) — later phase
python = []  # opt-in: exercises the Python adapter (needs the wheel) — later phase

[dependencies]
tst-core = { path = "../tst-core" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
sha2       = "0.10"

# Live-socket leg of the `cancelled-recv-kind` binding_contract scenario
# (tests/rust_scenarios.rs only — the library and gen-scenarios stay
# socket-free, which is what the `scenarios.sh` drift rail relies on).
[dev-dependencies]
tst-srt      = { path = "../tst-srt" }
tst-pipeline = { path = "../tst-pipeline" }
