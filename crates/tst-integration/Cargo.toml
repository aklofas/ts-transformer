[package]
name = "tst-integration"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false
description = "Cross-binding scenario harness: golden-envelope contract + scenarios that the Rust, Python, and C adapters all reproduce byte-for-byte, with a gen-scenarios --check drift rail. Not for external consumption."

# Kebab-case target name (cargo::non_kebab_case_bins) over an unchanged
# src/bin/ file, so the path the privacy rail scans stays put.
[[bin]]
name = "gen-scenarios"
path = "src/bin/gen_scenarios.rs"

[dependencies]
tst-core = { path = "../tst-core" }
# The binding-neutral error kinds the URL corpus records name.
tst-pipeline = { path = "../tst-pipeline" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "1"
sha2       = "0.11"

# Live-socket legs of the `cancelled-recv-kind` and `peer-reset-recv-kind`
# binding_contract scenarios (tests/net_rust_scenarios.rs only — the library
# and gen-scenarios stay socket-free, which is what the `scenarios.sh` drift
# rail relies on).
[dev-dependencies]
tst-srt          = { path = "../tst-srt" }
tst-tcp          = { path = "../tst-tcp" }
# The URL corpus's Rust leg parses through every transport's URL parser.
tst-rtp          = { path = "../tst-rtp" }
tst-udp          = { path = "../tst-udp" }
tst-hls          = { path = "../tst-hls" }
tst-rist         = { path = "../tst-rist" }
tst-webrtc       = { path = "../tst-webrtc" }
tst-test-helpers = { path = "../tst-test-helpers" }
socket2          = { workspace = true }

[lints]
workspace = true
