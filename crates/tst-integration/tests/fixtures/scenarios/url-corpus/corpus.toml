# ══ tcp(s) ════════════════════════════════════════════════════════════════════
# Callers dial a closed loopback port; listeners bind port 0. A tcps listener
# names both `cert` and `key`: one alone is refused at open by a config rule
# whose C code is also the URL kind's, so the row could not tell them apart.

[[url]]
scheme = "tcp"
role = "caller"
case = "default"
url = "tcp://127.0.0.1:31401"
expect = { scheme = "tcp", host = "127.0.0.1", port = 31401, keys = { listen = "0", nodelay = "1" } }

[[url]]
scheme = "tcps"
role = "caller"
case = "default"
url = "tcps://127.0.0.1:31401"
expect = { scheme = "tcps", host = "127.0.0.1", port = 31401, keys = { listen = "0", nodelay = "1" } }

[[url]]
scheme = "tcp"
role = "listener"
case = "explicit"
key = "listen"
url = "tcp://127.0.0.1:0?listen=1"
expect = { scheme = "tcp", host = "127.0.0.1", port = 0, keys = { listen = "1", nodelay = "1" } }

[[url]]
scheme = "tcp"
role = "caller"
case = "explicit"
key = "nodelay"
url = "tcp://127.0.0.1:31401?nodelay=false"
expect = { scheme = "tcp", host = "127.0.0.1", port = 31401, keys = { listen = "0", nodelay = "0" } }

[[url]]
scheme = "tcp"
role = "caller"
case = "explicit"
key = "keepalive"
url = "tcp://127.0.0.1:31401?keepalive=30"
expect = { scheme = "tcp", host = "127.0.0.1", port = 31401, keys = { listen = "0", nodelay = "1", keepalive = "30" } }

[[url]]
scheme = "tcp"
role = "caller"
case = "explicit"
key = "rcvbuf"
url = "tcp://127.0.0.1:31401?rcvbuf=1M"
expect = { scheme = "tcp", host = "127.0.0.1", port = 31401, keys = { listen = "0", nodelay = "1", rcvbuf = "1048576" } }

[[url]]
