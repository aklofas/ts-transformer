# ══ tcp(s) ════════════════════════════════════════════════════════════════════
# Callers dial a closed loopback port; listeners bind port 0. A tcps listener
# names both `cert` and `key`: one alone is refused at open by a config rule
# whose C code is also the URL kind's, so the row could not tell them apart.

[[url]]
scheme = "tcp"
role = "caller"
case = "default"
url = "tcp://127.0.0.1:{port}"
expect = { scheme = "tcp", host = "127.0.0.1", port = "{port}", keys = { listen = "0", nodelay = "1" } }

[[url]]
scheme = "tcps"
role = "caller"
case = "default"
open = { c = "IO", python = "IO", jvm = "IO" }
open_why = "every leg dials a drop peer, which closes the connection during the TLS handshake"
url = "tcps://127.0.0.1:{port}"
expect = { scheme = "tcps", host = "127.0.0.1", port = "{port}", keys = { listen = "0", nodelay = "1" } }

[[url]]
scheme = "tcp"
role = "listener"
case = "explicit"
key = "listen"
url = "tcp://127.0.0.1:0?listen=1"
expect = { scheme = "tcp", host = "127.0.0.1", port = 0, keys = { listen = "1", nodelay = "1" } }

[[url]]
scheme = "tcp"
role = "caller"
case = "explicit"
key = "nodelay"
url = "tcp://127.0.0.1:{port}?nodelay=false"
expect = { scheme = "tcp", host = "127.0.0.1", port = "{port}", keys = { listen = "0", nodelay = "0" } }

[[url]]
scheme = "tcp"
role = "caller"
case = "explicit"
key = "keepalive"
url = "tcp://127.0.0.1:{port}?keepalive=30"
expect = { scheme = "tcp", host = "127.0.0.1", port = "{port}", keys = { listen = "0", nodelay = "1", keepalive = "30" } }

[[url]]
