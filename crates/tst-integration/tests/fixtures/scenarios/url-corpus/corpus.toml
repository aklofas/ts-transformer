role = "caller"
case = "explicit"
key = "ca"
url = "tcps://127.0.0.1:47401?ca=roots.pem"
expect = { scheme = "tcps", host = "127.0.0.1", port = 47401, keys = { listen = "0", nodelay = "1", ca = "roots.pem" } }

[[url]]
scheme = "tcp"
role = "caller"
case = "credentials"
url = "tcp://user:secret@127.0.0.1:47401"
