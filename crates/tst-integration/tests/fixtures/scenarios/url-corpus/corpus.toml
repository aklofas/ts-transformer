# Canonical URL corpus: one URL per row, each with the normalised record every
# binding must agree on. The Rust, C and Python legs read this file; the JVM leg
# reads its JSON twin (the scenario's golden.json `extensions.corpus`, which
# `gen-scenarios` writes from this file). A binding that adds a URL key adds a
# row here, then regenerates the twin.
#
# ── The record ────────────────────────────────────────────────────────────────
#
# A valid row's `expect` is what the scheme's parser produced:
#   scheme, host, port      the parsed endpoint (host without IPv6 brackets)
#   path                    rtsp(s) only: the resource path
#   bind                    udp / rist only, when the `@host` receive-bind form
#                           (or any userinfo) is present
#   username, password_set  rtsp(s) only, the one scheme that keeps userinfo
#   keys                    every documented key the parsed form holds a value
#                           for, under its canonical name after alias
#                           resolution, rendered as decimal integers in the
#                           key's documented unit (`K`/`M` sizes in bytes,
#                           booleans as `1`/`0`), lowercase enum spellings,
#                           and text as written. A key with a built-in default
#                           (srt `mode`, rtsp `rtsp_version`, rist `profile`,
#                           `buffer`, `compression`, `pkt_size`, hls
#                           `segment_duration`, `playlist_window`, `mode`,
#                           tcp `listen`, `nodelay`, whep `media_port`,
#                           `max_viewers`, `cors_origin`) always appears; hls
#                           `output_dir` appears only when the URL sets it,
#                           because its default is the platform's temp dir.
# An invalid row's `expect` is `{ error_kind = "..." }`: the binding-neutral
# kind name (`BindingErrorKind::name()`, `exc.kind.name` in Python) inside the
# scheme's error domain. C compares `TST_E_*` codes: the expected kind's
# `c_projection()`.
#
# `stage = "open"` marks a URL the parser accepts but the role's entry point
# refuses (a send-only key on a receive URL, `?pt=` on an MP2T open); the Rust
# leg proves the parse succeeds, then runs the role's opener.
#
# A key the scheme does not document is an error for srt, rtp, rtsp(s) and
# whep(s); udp, tcp(s), hls(s) and rist ignore it, so those rows expect a
# record without it.
#
# ── Cases ─────────────────────────────────────────────────────────────────────
#
#   default      the scheme's bare URL; covers every key with a built-in default
#   explicit     one documented key set to a valid value (`key` names it)
#   alias        the key spelled by one of its aliases
#   credentials  `user:pass@` userinfo
#   invalid      a refused value, an undocumented key, or a malformed URL
#   conflict     the same key twice (the later wins), a canonical name and its
#                alias (the later wins), or two keys the parser checks together
#
# The Rust leg checks the corpus against the parsers' key tables: every
# documented key has an `explicit` row, every alias an `alias` row, and every
# key outside `no_invalid` an `invalid` row.
#
# ── Documented keys per scheme (the parsers' tables) ──────────────────────────

schema_version = 0

[schemes.srt]
keys = 23        # 22 table keys + `mode`, which the URL level consumes
aliases = 9
no_invalid = []

[schemes.rtp]
keys = 9
aliases = 0
no_invalid = []

[schemes.rtsp]   # rtsp and rtsps share one table
keys = 4
aliases = 0
no_invalid = []

[schemes.udp]
keys = 7
aliases = 0
no_invalid = ["iface"]                    # any text names an interface

[schemes.tcp]    # tcp and tcps share one table
keys = 10
aliases = 0
no_invalid = ["cert", "key", "ca"]        # paths; a missing file fails at open

[schemes.hls]    # hls and hlss share one table
keys = 8
aliases = 0
no_invalid = ["output_dir", "auth_user", "auth_pass", "cert", "key"]

[schemes.rist]
keys = 10
aliases = 2
no_invalid = ["cname"]

[schemes.whep]   # whep and wheps share one table
keys = 7
aliases = 0
no_invalid = ["cors_origin", "cert", "key"]

# ── Scheme families ───────────────────────────────────────────────────────────
#
# The family each written scheme belongs to: the key of its `[schemes.*]` and
# leg tables. The Rust leg checks this table against its own map, so the other
# legs can read it instead of keeping a copy.

[families]
srt = "srt"
rtp = "rtp"
rtsp = "rtsp"
rtsps = "rtsp"
udp = "udp"
tcp = "tcp"
tcps = "tcp"
hls = "hls"
hlss = "hls"
rist = "rist"
whep = "whep"
wheps = "whep"

# ── Entry points per leg ──────────────────────────────────────────────────────
#
# Neither C, Python nor the JVM exposes a parsed URL, so only the Rust leg
# compares the whole record. The other legs open the role's entry point and compare
# the outcome: an invalid row must fail with the expected kind; a valid row
# must not fail with the scheme's URL kinds (a refused connect is fine).
#
#   record        Rust: parse, compare the whole record
#   open-refused  open against a closed loopback port (or bind port 0)
#   open-peer     a loopback peer answers, so the open returns at once
#   build         a builder that parses the URL without touching the network
#   absent        the leg has no URL-taking entry point for this role
#
# Refusals alone cannot catch a binding that parses a URL and then drops part
# of it before use. For the schemes in `wire_schemes`, a valid row's URL is
# also connected to a recording loopback peer (its port replaces the URL's at
# run time) and the request heads are projected into the record: the fields
# listed in `wire` are compared, and `unobserved` says why each other field is
# not. The peer runs twice: once answering 461 to a UDP SETUP (the SETUP
# sequence shows the transport choice: TCP alone is `tcp`, UDP then TCP is no
# key, UDP alone is `udp`), once answering 401 to a DESCRIBE without
# credentials (the retry's Basic `Authorization` shows the user name and
# whether a password was sent).
#
# The srt rows bind loopback ports 31101-31177, the tcp callers' peer 31401,
# the rist receive rows 31650-31651 and a whep row 31801, so another process
# holding one of them fails its row. The band sits below every platform's
# ephemeral range (Linux starts at 32768, Windows and macOS at 49152): an
# in-process socket's kernel-picked port can never take a row's port.

[legs.rust]
srt = { caller = "tst_srt::SrtUrl::parse", listener = "tst_srt::SrtUrl::parse", probe = "record" }
rtp = { send = "tst_rtp::RtpUrl::parse", recv = "tst_rtp::RtpUrl::parse", h264 = "tst_rtp::RtpUrl::parse", probe = "record" }
rtsp = { client = "tst_rtp::url::RtspUrl::parse", probe = "record" }
udp = { send = "tst_udp::UdpUrl::parse", recv = "tst_udp::UdpUrl::parse", probe = "record" }
tcp = { caller = "tst_tcp::TcpUrl::parse", listener = "tst_tcp::TcpUrl::parse", probe = "record" }
hls = { publisher = "tst_hls::HlsUrl::parse", probe = "record" }
rist = { send = "tst_rist::RistUrl::parse", recv = "tst_rist::RistUrl::parse", probe = "record" }
whep = { server = "tst_webrtc::WhepUrl::parse", probe = "record" }

[legs.c]
srt = { caller = "tst_sender_open", listener = "tst_receiver_open_listener", probe = "open-peer" }
rtp = { send = "tst_rtp_sender_open", recv = "tst_rtp_recv_open", h264 = "absent", probe = "open-refused" }
rtsp = { client = "tst_rtsp_client_builder_new", probe = "build", wire_schemes = "rtsp", wire = "host path username password_set keys.rtsp_version keys.transport", unobserved = "scheme: the peer speaks no TLS, so rtsps rows are refusal-only; port: the peer's port replaces the URL's; keys.tcp_keepalive: a socket option the peer cannot see; keys.recv_timeout: a read deadline the peer cannot see" }
udp = { send = "tst_udp_sender_open", recv = "tst_udp_recv_open", probe = "open-refused" }
tcp = { caller = "tst_tcp_sender_open", listener = "tst_tcp_listener_from_url", probe = "open-refused" }
hls = { publisher = "tst_hls_publisher_builder_from_url", probe = "build" }
rist = { send = "tst_rist_sender_open", recv = "tst_rist_recv_open", probe = "open-refused" }
whep = { server = "absent", probe = "absent" }

[legs.python]
srt = { caller = "shells.Sender.open", listener = "shells.Receiver.open", probe = "open-peer" }
rtp = { send = "shells.Sender.open", recv = "shells.Receiver.open", h264 = "rtp.H264Receiver.listen", probe = "open-refused" }
rtsp = { client = "rtp.RtspClient.connect", probe = "open-peer", wire_schemes = "rtsp", wire = "host path username password_set keys.rtsp_version keys.transport", unobserved = "scheme: the peer speaks no TLS, so rtsps rows are refusal-only; port: the peer's port replaces the URL's; keys.tcp_keepalive: a socket option the peer cannot see; keys.recv_timeout: a read deadline the peer cannot see" }
udp = { send = "shells.Sender.open", recv = "shells.Receiver.open", probe = "open-refused" }
tcp = { caller = "shells.Sender.open", listener = "absent", probe = "open-refused" }
hls = { publisher = "hls.HlsPublisherBuilder.from_url", probe = "build" }
rist = { send = "shells.Sender.open", recv = "shells.Receiver.open", probe = "open-refused" }
whep = { server = "webrtc.WhepServer.bind", probe = "open-refused" }

# The JVM's HLS builder parses its URL only in `build()`, which binds the HTTP
# server, so the leg builds with a port-0 bind and a temporary output directory
# overlaid (an overlay never changes how the URL parses). A tcp listener URL
# binds port 0 and accepts one peer on a port the open never reports, so no
# peer can reach it: the role is absent, as in Python.
[legs.jvm]
srt = { caller = "shells.Sender.open", listener = "shells.Receiver.open", probe = "open-peer" }
rtp = { send = "shells.Sender.open", recv = "shells.Receiver.open", h264 = "rtp.H264Receiver.listen", probe = "open-refused" }
rtsp = { client = "rtp.RtspClient.connect", probe = "open-peer", wire_schemes = "rtsp", wire = "host path username password_set keys.rtsp_version keys.transport", unobserved = "scheme: the peer speaks no TLS, so rtsps rows are refusal-only; port: the peer's port replaces the URL's; keys.tcp_keepalive: a socket option the peer cannot see; keys.recv_timeout: a read deadline the peer cannot see" }
udp = { send = "shells.Sender.open", recv = "shells.Receiver.open", probe = "open-refused" }
tcp = { caller = "shells.Sender.open", listener = "absent", probe = "open-refused" }
hls = { publisher = "hls.HlsPublisherBuilder.build", probe = "open-refused" }
rist = { send = "shells.Sender.open", recv = "shells.Receiver.open", probe = "open-refused" }
whep = { server = "webrtc.WhepServer.bind", probe = "open-refused" }

