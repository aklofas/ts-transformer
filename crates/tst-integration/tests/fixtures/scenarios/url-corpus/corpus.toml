# ══ whep(s) ═══════════════════════════════════════════════════════════════════
# Valid rows bind port 0 (the media port follows the URL's port). A wheps URL
# needs both `cert` and `key` and a whep URL takes neither; the files named do
# not exist, which fails at bind, not parse.

[[url]]
scheme = "whep"
role = "server"
case = "default"
url = "whep://127.0.0.1:0"
expect = { scheme = "whep", host = "127.0.0.1", port = 0, keys = { media_port = "0", max_viewers = "10", cors_origin = "*" } }

[[url]]
scheme = "wheps"
role = "server"
case = "conflict"
key = "cert"
url = "wheps://127.0.0.1:0"
expect = { error_kind = "URL" }

[[url]]
scheme = "whep"
role = "server"
case = "conflict"
key = "cert"
url = "whep://127.0.0.1:0?cert=server.crt&key=server.key"
expect = { error_kind = "URL" }

[[url]]
scheme = "whep"
role = "server"
case = "explicit"
key = "media_port"
url = "whep://127.0.0.1:0?media_port=47801"
expect = { scheme = "whep", host = "127.0.0.1", port = 0, keys = { media_port = "47801", max_viewers = "10", cors_origin = "*" } }

[[url]]
scheme = "whep"
role = "server"
case = "explicit"
key = "advertise"
url = "whep://127.0.0.1:0?advertise=192.0.2.10"
expect = { scheme = "whep", host = "127.0.0.1", port = 0, keys = { media_port = "0", max_viewers = "10", cors_origin = "*", advertise = "192.0.2.10" } }

[[url]]
scheme = "whep"
role = "server"
case = "explicit"
key = "max_viewers"
url = "whep://127.0.0.1:0?max_viewers=4"
expect = { scheme = "whep", host = "127.0.0.1", port = 0, keys = { media_port = "0", max_viewers = "4", cors_origin = "*" } }

[[url]]
scheme = "whep"
role = "server"
case = "explicit"
key = "token"
url = "whep://127.0.0.1:0?token=s3cret"
expect = { scheme = "whep", host = "127.0.0.1", port = 0, keys = { media_port = "0", max_viewers = "10", cors_origin = "*", token = "s3cret" } }

[[url]]
scheme = "whep"
role = "server"
case = "explicit"
key = "cors_origin"
url = "whep://127.0.0.1:0?cors_origin=https%3A%2F%2Fviewer.example"
expect = { scheme = "whep", host = "127.0.0.1", port = 0, keys = { media_port = "0", max_viewers = "10", cors_origin = "https://viewer.example" } }

[[url]]
scheme = "wheps"
role = "server"
case = "explicit"
key = "cert"
url = "wheps://127.0.0.1:0?cert=server.crt&key=server.key"
expect = { scheme = "wheps", host = "127.0.0.1", port = 0, keys = { media_port = "0", max_viewers = "10", cors_origin = "*", cert = "server.crt", key = "server.key" } }

[[url]]
scheme = "wheps"
role = "server"
case = "explicit"
key = "key"
url = "wheps://127.0.0.1:0?key=server.key&cert=server.crt"
expect = { scheme = "wheps", host = "127.0.0.1", port = 0, keys = { media_port = "0", max_viewers = "10", cors_origin = "*", cert = "server.crt", key = "server.key" } }

[[url]]
scheme = "wheps"
role = "server"
case = "conflict"
key = "key"
url = "wheps://127.0.0.1:0?key=server.key"
expect = { error_kind = "URL" }

[[url]]
scheme = "whep"
role = "server"
case = "credentials"
url = "whep://user:secret@127.0.0.1:0"
expect = { scheme = "whep", host = "127.0.0.1", port = 0, keys = { media_port = "0", max_viewers = "10", cors_origin = "*" } }

[[url]]
scheme = "whep"
role = "server"
case = "conflict"
key = "max_viewers"
url = "whep://127.0.0.1:0?max_viewers=2&max_viewers=8"
expect = { scheme = "whep", host = "127.0.0.1", port = 0, keys = { media_port = "0", max_viewers = "8", cors_origin = "*" } }

[[url]]
scheme = "whep"
role = "server"
