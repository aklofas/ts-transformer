# ══ whep(s) ═══════════════════════════════════════════════════════════════════
# Valid rows bind port 0 (the media port follows the URL's port). A wheps URL
# needs both `cert` and `key` and a whep URL takes neither; the files named do
# not exist, which fails at bind, not parse.

[[url]]
scheme = "whep"
role = "server"
case = "default"
url = "whep://127.0.0.1:0"
expect = { scheme = "whep", host = "127.0.0.1", port = 0, keys = { media_port = "0", max_viewers = "10", cors_origin = "*" } }

[[url]]
scheme = "wheps"
role = "server"
case = "conflict"
key = "cert"
url = "wheps://127.0.0.1:0"
expect = { error_kind = "URL" }

[[url]]
scheme = "whep"
role = "server"
case = "conflict"
key = "cert"
url = "whep://127.0.0.1:0?cert=server.crt&key=server.key"
expect = { error_kind = "URL" }

[[url]]
scheme = "whep"
role = "server"
case = "explicit"
key = "media_port"
url = "whep://127.0.0.1:0?media_port=31801"
expect = { scheme = "whep", host = "127.0.0.1", port = 0, keys = { media_port = "31801", max_viewers = "10", cors_origin = "*" } }

[[url]]
