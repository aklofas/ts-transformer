# ══ rtsp(s) ═══════════════════════════════════════════════════════════════════
# Valid rtsp rows reach the recording peer; refused rows and rtsps rows open
# against a closed loopback port (the rtsps default row assumes nothing serves
# 322 on loopback). An undocumented key is refused today; once the client
# passes such keys through to the resource URL, these rows gain passthrough
# rows in their place.

[[url]]
scheme = "rtsp"
role = "client"
case = "default"
url = "rtsp://127.0.0.1/live"
expect = { scheme = "rtsp", host = "127.0.0.1", port = 554, path = "/live", keys = { rtsp_version = "1.0" } }

[[url]]
scheme = "rtsps"
role = "client"
case = "default"
url = "rtsps://127.0.0.1/live"
expect = { scheme = "rtsps", host = "127.0.0.1", port = 322, path = "/live", keys = { rtsp_version = "1.0" } }

[[url]]
scheme = "rtsp"
role = "client"
case = "explicit"
key = "transport"
url = "rtsp://127.0.0.1:31501/live?transport=tcp"
expect = { scheme = "rtsp", host = "127.0.0.1", port = 31501, path = "/live", keys = { rtsp_version = "1.0", transport = "tcp" } }

[[url]]
scheme = "rtsp"
role = "client"
case = "explicit"
key = "rtsp_version"
url = "rtsp://127.0.0.1:31501/live?rtsp_version=2.0"
expect = { scheme = "rtsp", host = "127.0.0.1", port = 31501, path = "/live", keys = { rtsp_version = "2.0" } }

[[url]]
scheme = "rtsp"
role = "client"
case = "explicit"
key = "tcp_keepalive"
url = "rtsp://127.0.0.1:31501/live?tcp_keepalive=30"
expect = { scheme = "rtsp", host = "127.0.0.1", port = 31501, path = "/live", keys = { rtsp_version = "1.0", tcp_keepalive = "30" } }

[[url]]
scheme = "rtsp"
role = "client"
case = "explicit"
key = "recv_timeout"
url = "rtsp://127.0.0.1:31501/live?recv_timeout=5000"
expect = { scheme = "rtsp", host = "127.0.0.1", port = 31501, path = "/live", keys = { rtsp_version = "1.0", recv_timeout = "5000" } }

[[url]]
scheme = "rtsp"
role = "client"
case = "credentials"
url = "rtsp://admin:p%40ss@127.0.0.1:31501/live?transport=udp"
expect = { scheme = "rtsp", host = "127.0.0.1", port = 31501, path = "/live", username = "admin", password_set = true, keys = { rtsp_version = "1.0", transport = "udp" } }

# The parser keeps a user name without a password, but the client answers a
# challenge only when the URL also has a password, so nothing reaches the wire.
[[url]]
scheme = "rtsp"
role = "client"
case = "credentials"
wire_absent = "username password_set"
url = "rtsp://admin@127.0.0.1:31501/live"
expect = { scheme = "rtsp", host = "127.0.0.1", port = 31501, path = "/live", username = "admin", password_set = false, keys = { rtsp_version = "1.0" } }

[[url]]
scheme = "rtsp"
role = "client"
case = "credentials"
url = "rtsp://admin:@127.0.0.1:31501/live"
expect = { scheme = "rtsp", host = "127.0.0.1", port = 31501, path = "/live", username = "admin", password_set = true, keys = { rtsp_version = "1.0" } }

[[url]]
scheme = "rtsp"
role = "client"
case = "conflict"
key = "transport"
url = "rtsp://127.0.0.1:31501/live?transport=udp&transport=tcp"
expect = { scheme = "rtsp", host = "127.0.0.1", port = 31501, path = "/live", keys = { rtsp_version = "1.0", transport = "tcp" } }

[[url]]
scheme = "rtsp"
role = "client"
case = "invalid"
key = "transport"
url = "rtsp://127.0.0.1:31501/live?transport=quic"
expect = { error_kind = "PROTOCOL" }

[[url]]
scheme = "rtsp"
role = "client"
case = "invalid"
key = "rtsp_version"
url = "rtsp://127.0.0.1:31501/live?rtsp_version=3.0"
expect = { error_kind = "PROTOCOL" }

[[url]]
scheme = "rtsp"
role = "client"
case = "invalid"
key = "tcp_keepalive"
url = "rtsp://127.0.0.1:31501/live?tcp_keepalive=x"
expect = { error_kind = "PROTOCOL" }

[[url]]
scheme = "rtsp"
role = "client"
case = "invalid"
key = "recv_timeout"
url = "rtsp://127.0.0.1:31501/live?recv_timeout=0"
expect = { error_kind = "PROTOCOL" }

[[url]]
scheme = "rtsp"
role = "client"
case = "invalid"
url = "rtsp://127.0.0.1:31501/live?channel=1"
expect = { error_kind = "PROTOCOL" }

[[url]]
scheme = "rtsp"
role = "client"
case = "invalid"
url = "rtsp://admin:p%zz@127.0.0.1:31501/live"
expect = { error_kind = "PROTOCOL" }

