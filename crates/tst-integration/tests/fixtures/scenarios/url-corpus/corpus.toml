role = "caller"
case = "explicit"
key = "pkt_size"
url = "tcp://127.0.0.1:31401?pkt_size=64K"
expect = { scheme = "tcp", host = "127.0.0.1", port = 31401, keys = { listen = "0", nodelay = "1", pkt_size = "65536" } }

[[url]]
