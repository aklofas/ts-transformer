[package]
name        = "tstrans-rist-sys"
description = "Raw FFI bindings to VideoLAN librist 0.2.x"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
links       = "rist"
keywords    = ["rist", "librist", "video", "streaming"]
categories  = ["external-ffi-bindings", "multimedia::video"]
exclude = [
    "vendor/librist/docs/",
    "vendor/librist/test/",
    "vendor/librist/tools/",
    "vendor/librist/subprojects/",
    "vendor/librist/.gitlab-ci.yml",
    "vendor/librist/contrib/mbedtls/include/",
    "vendor/librist/contrib/mbedtls/library/",
    "vendor/librist/contrib/mbedtls/LICENSE",
    "vendor/librist/contrib/mbedtls/Makefile",
    "vendor/librist/contrib/mbedtls/refresh_mbedtls_source.sh",
]

[lib]
name       = "rist_sys"
crate-type = ["rlib"]
doctest    = false

[dependencies]
libc = { workspace = true }

[build-dependencies]
bindgen             = { workspace = true }
cc                  = { workspace = true }
cmake               = { workspace = true }
pkg-config          = { workspace = true }
tstrans-mbedtls-src = { path = "../mbedtls-src", version = "0.7.0" }

[dev-dependencies]
libc = { workspace = true }

[features]
default = ["mbedtls"]

# Enable AES-128/192/256 PSK encryption by building librist against the
# SHARED mbedTLS source tree provided by `tstrans-mbedtls-src` (mbedTLS
# 3.6.x — the same copy srt-sys links). rist-sys builds it via cmake to a
# private prefix, then drives librist's meson with `-Dbuiltin_mbedtls=false` +
# `PKG_CONFIG_PATH` pointing at that prefix so librist links the 3.6.x
# mbedcrypto instead of its bundled `contrib/mbedtls` 2.26.0. Disabling this
# feature builds librist with `use_mbedtls=false` — no encryption.
#
# Why shared (not librist's builtin contrib/mbedtls): linking librist's
# mbedTLS 2.26.0 alongside libsrt's mbedTLS 3.6.x in one binary (tst-c /
# tst-py with both `srt`+`rist`) produced duplicate `mbedtls_*` symbols with
# incompatible layouts → SRT-encryption segfaulted at runtime. Sharing one
# mbedTLS version (3.6.x) makes the two static copies byte-identical, so the
# downstream cdylib's `-Wl,--allow-multiple-definition` collapses them safely.
# librist 0.2.18 supports mbedTLS 3.x natively (srp.c defines its own 3.x
# compat macros for the _ret SHA-256 names; no compat-2.x.h needed).
mbedtls = []
