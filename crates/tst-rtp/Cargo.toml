[package]
name        = "tst-rtp"
description = "TS Transformer RTP transport: RTP-over-UDP carrying MPEG-TS (RFC 2250) with RTSP/1.0 + RTSP/2.0 client + server. Pure Rust, no native deps."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
keywords    = ["rtp", "rtsp", "mpeg-ts", "streaming"]
categories  = ["multimedia::video", "network-programming"]

[lib]
crate-type = ["rlib"]

[dependencies]
tst-core   = { path = "../tst-core", version = "0.6.0" }
tst-pipeline = { path = "../tst-pipeline", version = "0.6.0" }
thiserror  = { workspace = true }
base64     = { version = "0.22", default-features = false, features = ["std"] }
bytes      = "1"
# Random SSRC + initial RTP sequence number per RFC 3550 §5.1.
# getrandom is the minimal dep — sized for one-shot construction-time use.
getrandom  = "0.2"
md-5       = { version = "0.10", default-features = false }
sdp-types  = "0.1"
secrecy    = { workspace = true }
sha2       = { version = "0.10", default-features = false }
# Constant-time byte comparison for RTSP auth credential verification.
# Already in the workspace lockfile via rustls; declared direct so auth.rs
# can use ConstantTimeEq without a feature gate.
subtle     = "2"
# Phase 3: tokio drives the RtspServer Runtime (internal-only sync facade).
# Same feature set Phase 2 used as a dev-dep — features carry over.
# Optional: gated behind the `rtsp-server` feature so client-only consumers
# (e.g. tst-uniffi mobile) build a tokio-free dependency tree.
tokio      = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"], optional = true }
# CancellationToken for graceful-shutdown coordination across per-session tasks.
tokio-util = { version = "0.7", optional = true }
# Single facade for diagnostics workspace-wide.
tracing    = { version = "0.1", default-features = false, features = ["std"] }

# Cross-platform setsockopt paths std doesn't expose on 1.85: SO_KEEPALIVE
# with an idle time on the RTSP client's control socket (`?tcp_keepalive=`),
# and IP_MULTICAST_IF on Windows for the RTSP multicast-mount send socket
# (Unix multicast uses the libc path below). Kept unconditional — it's a
# tiny dep and gating it buys nothing.
socket2    = { workspace = true }

# Raw setsockopt for multicast knobs not exposed on stable std::net::UdpSocket
# in Rust 1.85: IPV6_MULTICAST_HOPS and IP_MULTICAST_IF. Unix-only; Phase 1
# returns IfaceUnsupported on non-Unix platforms.
[target.'cfg(unix)'.dependencies]
libc       = { workspace = true }

[features]
# rtsp-server is default-ON: most consumers want the push server available.
# It pulls tokio + tokio-util — the ONLY thing that puts tokio in the tree.
# Client-only consumers (e.g. tst-uniffi mobile: RTP/RTSP client only) build
# with `default-features = false` (+ "tls" for rtsps://) for a tokio-free
# dependency tree.
default = ["rtsp-server"]
# RTSP push server (RtspServer + mounts). Runs an internal tokio Runtime
# behind the sync facade.
rtsp-server = ["dep:tokio", "dep:tokio-util"]
# Enable client `rtsps://` support — sync rustls 0.23 directly (no
# tokio-rustls), since the client is a sync facade per master spec. Tokio-free
# even with this feature on; pair with `rtsp-server-tls` for the server's TLS
# acceptor.
tls = [
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rustls-pki-types",
    "dep:rustls-native-certs",
]
# Server-side TLS acceptor. The server is async (tokio Runtime), so this adds
# `tokio-rustls` on top of `tls` — native async TLS is much cleaner than
# wiring sync rustls into tokio via spawn_blocking. Implies both parent
# features (Cargo can't express "tls AND rtsp-server" any other way).
rtsp-server-tls = ["rtsp-server", "tls", "dep:tokio-rustls"]

[dependencies.rustls]
version          = "0.23"
optional         = true
default-features = false
features         = ["std", "ring"]

[dependencies.rustls-pemfile]
version  = "2"
optional = true

[dependencies.rustls-pki-types]
version  = "1"
optional = true

# Pulls trust roots from the OS / native cert store so `rtsps://` works
# out-of-the-box without webpki-roots being baked into the binary.
[dependencies.rustls-native-certs]
version  = "0.7"
optional = true

# Server-side TLS (Phase 3 Task 11). tokio-rustls 0.26 wraps rustls 0.23
# and exposes a native tokio AsyncRead+AsyncWrite TlsStream + TlsAcceptor;
# server-side handshake is `acceptor.accept(tcp).await` — no spawn_blocking
# bridge needed.
[dependencies.tokio-rustls]
version          = "0.26"
optional         = true
default-features = false
features         = ["ring"]

[dev-dependencies]
proptest         = { workspace = true }
# Used by server::tls unit tests (negative-path cert loading); matches the
# `tempfile = "3"` pattern from tst-core.
tempfile         = "3"
# Self-signed cert + key generator for Wave F Task 24 TLS integration
# test fixture (`tests/fixtures/tls_certs.rs`). 0.13 is the highest
# version verified against Rust 1.85 (workspace MSRV); 0.14 was released
# 2025-09 and might also work but 0.13 is sufficient for our needs.
rcgen            = "0.13"
# tokio was dev-only in Phase 2 (loopback fixture); promoted to production
# [dependencies] in Phase 3 for the RtspServer Runtime, then made optional
# there (behind `rtsp-server`) so client-only builds get a tokio-free tree.
# Declared again here, unconditionally: `tests/fixtures/rtsp_loopback_server.rs`
# is a hand-rolled tokio TCP fixture (NOT `tst_rtp::RtspServer` — it exists so
# client tests don't test the client against our own server) used by several
# rtsp_client/ and h264/ tests that must keep passing under
# `--no-default-features`. Dev-dependencies never ship in the built library —
# `cargo tree -e normal` (the client-only tokio-free check) ignores this edge.
tokio            = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }
