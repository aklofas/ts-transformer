[package]
name    = "tst-rtp-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[lints.cargo]
# Fuzz targets keep cargo-fuzz's snake_case convention: each name must equal
# its fuzz_targets/*.rs stem, which oss-fuzz/build.sh and
# tests/coverage/fuzz-targets.toml key on. This workspace only ever builds on
# nightly, so the (nightly-only) lints table is safe here — stable cargo would
# warn "unused manifest key" on it.
non_kebab_case_bins = "allow"

[dependencies]
libfuzzer-sys = "0.4"
tst-rtp       = { path = ".." }

[[bin]]
name              = "rtp_packet_decode"
path              = "fuzz_targets/rtp_packet_decode.rs"
test              = false
doc               = false
bench             = false

[[bin]]
name              = "rtsp_message_decode"
path              = "fuzz_targets/rtsp_message_decode.rs"
test              = false
doc               = false
bench             = false

[[bin]]
name              = "rtsp_client_pump_framing"
path              = "fuzz_targets/rtsp_client_pump_framing.rs"
test              = false
doc               = false
bench             = false

[[bin]]
name              = "rtp_h264_depacketize"
path              = "fuzz_targets/rtp_h264_depacketize.rs"
test              = false
doc               = false
bench             = false

[[bin]]
name              = "rtsp_request_decode"
path              = "fuzz_targets/rtsp_request_decode.rs"
test              = false
doc               = false
bench             = false

[workspace]
members = []
