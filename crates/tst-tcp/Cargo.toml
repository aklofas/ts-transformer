[package]
name = "tst-tcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Raw MPEG-TS over TCP (caller + listener, plain + TLS via rustls) for the tstrans pipeline"
keywords = ["tcp", "tls", "mpeg-ts", "streaming"]
categories = ["multimedia::video", "network-programming"]

[features]
# tls stays default-on: TCP transport security is tst-tcp's core value
# proposition (tcps:// encrypted streams out of the box).
default = ["tls"]
tls = ["dep:rustls", "dep:rustls-native-certs", "tst-core/tls"]

[dependencies]
tst-core     = { path = "../tst-core", version = "0.9.0" }
tst-pipeline = { path = "../tst-pipeline", version = "0.9.0" }
socket2      = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true, features = ["std"] }

[dependencies.rustls]
version          = "0.23"
optional         = true
default-features = false
features         = ["std", "ring"]

[dependencies.rustls-native-certs]
version  = "0.8"
optional = true

[dev-dependencies]
tst-core = { path = "../tst-core", features = ["conformance"] }
tst-test-helpers = { path = "../tst-test-helpers" }
libc = { workspace = true }
# Self-signed cert + key generator for TLS loopback integration tests
# (tests/net_tls_hostname.rs). Matches the version used in tst-rtp.
rcgen = "0.14"
# Tempdir for PEM fixture files (cert.pem / key.pem / ca.pem) written to
# std::env::temp_dir() — auto-cleaned on drop after the test completes.
tempfile = "3"

[lints]
workspace = true
