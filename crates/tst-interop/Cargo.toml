[package]
name = "tst-interop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tst-core = { path = "../tst-core" }
tst-test-helpers = { path = "../tst-test-helpers" }
tst-pipeline = { path = "../tst-pipeline" }
tst-srt = { path = "../tst-srt" }
tst-udp = { path = "../tst-udp" }
tst-tcp = { path = "../tst-tcp" }
tst-rist = { path = "../tst-rist" }
tst-rtp = { path = "../tst-rtp" }
tst-hls = { path = "../tst-hls" }
tst-webrtc = { path = "../tst-webrtc" }
socket2 = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sha2 = "0.11"
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
