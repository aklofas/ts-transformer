[package]
name = "tst-udp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Raw MPEG-TS over UDP (unicast + multicast) for the tstrans pipeline"
keywords = ["udp", "multicast", "mpeg-ts", "streaming"]
