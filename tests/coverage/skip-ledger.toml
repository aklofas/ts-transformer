# Skip ledger — one entry per intentional Rust `#[ignore]`, with a class and
# rationale. Kept in sync with the tree by scripts/check/repo/skip-ledger-sync.sh:
#
#   * every active `#[ignore]` test function must have a NON-resolved entry here
#     whose `test` is the exact function name;
#   * every non-resolved entry must still correspond to a real active `#[ignore]`
#     (a `#[ignore]` that was removed must be marked `resolved`, not left dangling);
#   * placeholder/blocked_bug entries must carry a future-dated `expires_after`
#     (or `resolved`).
#
# Module-level Python skips are out of scope for the sync checker for now: the
# two that exist (test_demux_audio_gil, test_contract_collection) are
# `pytest.mark.skipif` capability guards that fail open when a fixture/parser is
# absent, not deferrals — tracking them here would add friction without value.
#
# class ∈ { placeholder | external_tool | environmental | slow | diagnostic | blocked_bug }
#   placeholder   — stub awaiting real coverage (expires_after REQUIRED)
#   external_tool — needs ffmpeg/ffprobe/tsduck/dav1d/vlc on PATH
#   environmental — timing/scheduler/network sensitive; flaky off the happy path
#   slow          — too slow for PR CI (soak, long fuzz)
#   diagnostic    — produces artifacts / informational matrices for a human
#   blocked_bug   — disabled pending a fix (expires_after REQUIRED, or resolved)

# --- Resolved (history; no longer an active skip) ---------------------------

