# Platform-capability manifest. Declares platform-specific test gates and
# per-platform capability status as first-class records, so a deferral cannot
# hide in a scattered `#[cfg(...)]` comment and a soft-promotion window cannot
# silently lapse.
#
# Kept in sync with the tree by scripts/check/repo/platform-capabilities.sh:
#   1. every test-level platform cfg-gate (a `crates/*/tests/**.rs` file with a
#      top-level `#[cfg(not(target_os = "windows"))]` / `#[cfg(target_os = "linux")]`
#      / `#[cfg(unix)]` / etc.) has a NON-resolved [[platform_skip]] whose `file`
#      matches;
#   2. every NON-resolved [[platform_skip]] still corresponds to a real gate
#      (removed gate -> mark `resolved`, don't leave dangling);
#   3. every NON-resolved blocked_bug [[platform_skip]] has a future expires_after;
#      every A-soft / gating-pending [[capability]] carries a future soft_until.
#
# platform_skip.class ∈ { blocked_bug | gap | portability | environmental }
#   blocked_bug  — upstream/vendored bug; expires_after REQUIRED (or resolved)
#   gap          — our code doesn't yet support it on this platform
#   portability  — low-level compile/portability cfg, not a behavioral deferral
#   environmental — timing/runner sensitive (live-socket, OS-scheduler dependent)
# capability.status ∈ { A | A-soft | gating-pending }
#   A-soft / gating-pending — soft_until REQUIRED (forces a promotion decision)

# ─── test-level platform gates (one per gated file) ────────────

