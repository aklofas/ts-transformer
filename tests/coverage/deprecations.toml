# Deprecation manifest: every deprecated public name, live or already removed.
#
# A deprecation promises a removal no earlier than some release. The promise
# is written here, and scripts/check/repo/deprecations.sh keeps the code, the
# CHANGELOG and the docs saying the same thing:
#
#   * every deprecation in the code (a Rust `#[deprecated]`, a Java
#     `@Deprecated` / Javadoc `@deprecated`, a Python DeprecationWarning,
#     `@deprecated` decorator or "deprecated alias" comment; the rail's header
#     defines the markers) has a live row, and every live row has such a site
#     whose `since`, where the language states one, equals the row's;
#   * a live row's `earliest_removal` is later than the workspace version, and
#     a removal version written at the site ("removed in X.Y.Z", "remove at
#     X.Y") or beside the name in the docs is exactly `earliest_removal`;
#   * a removed row's name is gone from the code, and the CHANGELOG lists it
#     under a `### Removed` heading of the release `removed_in` names (under
#     `[Unreleased]` until that release is cut).
#
#   lang              rust | python | java | c
#   symbol            the name as a user of that language writes it, fully
#                     qualified: `tst_srt::socket::Socket`,
#                     `tstrans.mpegts.DemuxEvent.Klv`, `org.tstrans.srt.Sender`.
#                     A trailing `()` names a constructor.
#   since             the release that deprecated it
#   replacement       what to use instead
#   earliest_removal  the first release that may remove it (X.Y.Z)
#   removed_in        the release that removed it; absent while the name lives
#
# A removed row stays as the record. A Rust name has one row, at the module
# path that declared it; its re-exports (the crate root, another crate) went
# with it and have no row of their own. A removed class's row covers its
# members.

# ─── live ────────────────────────────────────────────────────────────────────

