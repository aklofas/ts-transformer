# RTSP push client (ANNOUNCE / SETUP mode=record / RECORD over TCP-interleaved
# RTP). Unit tests against a scripted server in push/tests.rs; the
# integration tests against the library's RtspServer in tests/rtsp_push/;
# the Python and JVM twins in test_rtsp_push.py and RtspPushTest.java. The
# bindings push in one call (RtspClient.push), so the stepwise announce /
# setup_record / record have no twin there. The Transport impl of RtspPush
