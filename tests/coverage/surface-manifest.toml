# Surface-to-test ownership manifest (L3).
#
# Every MAPPABLE entry across the 8 public-api.txt baselines is a [[surface]]
# row (item -> owning tests + per-binding columns), an [[exempt]] row with a
# reason, or one of the un-catalogued items the rail pins by count and digest
# (`bash scripts/check/repo/surface-manifest.sh --list-unaudited` prints them).
# Enforced by scripts/check/repo/surface-manifest.sh:
#   (a) every owning_tests path exists;
#   (b) every binding column symbol resolves in that binding's source
#       (feature-tagged entries are skipped when the feature is not built);
#   (b2) every [[surface]] row carries all five binding columns (below);
#   (c) closure: the un-catalogued set equals the rail's pinned baseline.
#
# Binding column prefixes are IDENTIFIERS, not filesystem paths:
#   c:<symbol>       -> grepped in bindings/c/include/tstrans.h
#   python:<name>    -> a DEFINITION in bindings/python/python/tstrans/ (.pyi/.py):
#                       function | Class | Class.member, optionally prefixed
#                       tstrans.<module>. — a method always carries its class,
#                       and a name several modules define carries its module.
#                       A row for `Owner::leaf` whose Owner has a Python class
#                       must name that class or one of its members.
#   java:<dotted>    -> grepped in bindings/jvm/src/main/java/** (tst-jni surface-port)
#   swift:/kotlin:<symbol> [feature=X] -> tst-uniffi (not shipped; presence-only)
# Five-column rule (rule b2): EVERY [[surface]] row lists all five prefixes.
# Do not omit a column — an omitted column is indistinguishable from a
# forgotten one. Three sentinels stand in for a symbol, and none is resolved:
#   "<prefix>:unaudited"  nobody has checked whether a twin exists. This is
#                         the value the 2026-09 bulk migration wrote into the
#                         c:/python:/java: columns of every pre-existing row;
#                         it is a TODO, not a claim. Replace it with a real
#                         symbol, :deferred or :n/a when you check the row.
#   "<prefix>:deferred"   no twin in that binding today (a real, checked gap).
#   "<prefix>:n/a"        no twin by design.
# swift:/kotlin: are :deferred everywhere: tst-uniffi does not exist yet.
# The optional " [feature=X]" suffix marks a symbol absent from builds without X
# (X in {srt,rtp,udp,tcp,hls,rist}); the ratchet skips resolving it unless X is built.

# --- Seed: key mappable surface items ------------------------------------
