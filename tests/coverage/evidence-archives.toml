# The soak, stress and corpus archives the evidence page cites, with the verdict each
# recorded. `overall_pass` is the harness verdict as the run printed it and is never
# rewritten; `note` summarises what the page says.
# A failed row may carry an `[archive.waiver]` table, the maintainer's disposition beside
# the raw verdict: `verdicts` (the failed verdict names it covers), `reason`, `reviewer`,
# `date` (YYYY-MM-DD) and `fixed_in` (the release that fixes the cause). A release needs a
# raw pass, so the release gate refuses a waived row; a mid-cycle collect may admit one.
# A corpus row may also carry eight integer counts (files, identical, changed_explained,
# invariant_failures, parse_failures, replay_files, replay_paths, replay_failed); they are
# all-or-none and belong to corpus rows only.
# A corpus row may also carry `baseline_manifest_sha256`, the SHA-256 of the baseline manifest
# its sweep compared with (the corpus tool's archive row carries it); the release gate refuses a
# chosen corpus row without it.
# A soak row may also carry `legs`, the legs the run declared (`report soak` prints them on
# its last line): a list of distinct names from srt, rist, rtsp-publish, rtsp-publish-es,
# whep. The judge validates only the declared legs, so the release gate requires the
# chosen release soak to name all five. Soak rows only.
# A soak or stress row may carry `arch`, `x86_64` or `aarch64` (`uname -m`); a row dated
# 2026-11-04 or later must, and an older row without it is x86_64. The release gate judges
# each architecture's soak rows on their own; from 0.11.0 a release needs a passing
# release soak on both (in 0.10.0 the aarch64 soak row was recorded beside the x86_64 one).
# Rendered into the qualification block by scripts/gen/qualification.sh.
schema_version = 0

# The number of distinct `.ts` captures the release VM must sweep (the maintainer's corpus;
# derived re-encodes beside the notebooks excluded). A release-mode corpus row must have
# swept exactly this many files.
[corpus]
expected_files = 251

# The release soak's required length in seconds. A soak row qualifies as a release soak
# when its expected_duration_s is at least this; the gate judges the newest such row that
# stands for the tree. 48 hours from 0.9.1: hours are a proxy for event counts,
# which the launcher's cadence knobs raise instead. The 0.9.0 rows keep 259200.
[soak]
required_duration_s = 172800

