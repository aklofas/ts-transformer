# `experimental`, `internal`: distinct broken item paths of that release's
# cargo-semver-checks report, from `scripts/gen/api_churn.py tally`) or a `note` saying
# why there are none. A counted row may also carry a `note` that replaces the Basis cell.
schema_version = 0

