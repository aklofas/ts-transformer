# cargo-nextest configuration.
#
# Two things we rely on, neither of which `cargo test` (libtest) can do:
#
#   1. Per-test timeouts (`terminate-after`): nextest runs each test in its own
#      process and KILLS one that exceeds its deadline, reports it as a failure,
#      and continues the run. A hung test can't stall the whole job, and every
#      failure surfaces in one run.
#
#   2. Concurrency control per test-group: the bulk of the suite runs at full
#      parallelism, while network/loopback tests are funnelled through a
#      single-threaded group so they never contend on 127.0.0.1 ports or CPU
#      timing. The capped group does NOT hold back the rest — non-network tests
#      keep filling the other worker threads.

[profile.default]
# Full parallelism for the bulk (nextest defaults test-threads to num-cpus).
# Global safety net: any test still running after 60s (2 x 30s) is terminated
# and reported as a failure. Non-network tests finish in well under a second,
# so this only ever fires on a genuine hang.
slow-timeout = { period = "30s", terminate-after = 2 }

[test-groups]
# Network/loopback tests bind 127.0.0.1 ports and are timing-sensitive; run
# them one-at-a-time across the whole workspace so cross-test port/CPU
# contention can't cause flakes. Cost is small (serialising fast tests is
# negligible; only the ~handful of multi-second loopback tests actually
# serialise), and they overlap with the parallel non-network tests.
network = { max-threads = 1 }

[[profile.default.overrides]]
# Windows CI runners are the slowest and most load-variable platform for the
# loopback/network tests (known flake class: loopback connects overrunning
# the per-test kill under runner load — see the git history of
# docs/project/deferred-features.md). Double the network group's budget
# there. NOTE: the RTSP max-sessions burst test is NOT a flake class — its
# 2026-06 failures were a real cap race, fixed by the CAS reserve in the
# accept loop (2026-08-01); a cap-assert failure there is a regression to
# investigate, never a rerun case. Sets ONLY slow-timeout: test-group still
# resolves from the generic network override below — KEEP THIS FILTER IN
# SYNC WITH IT.
platform = 'cfg(windows)'
filter = """
    binary(loopback) | binary(loopback_multicast) | binary(pipeline_round_trip)
  | binary(hls_e2e) | binary(pipeline) | binary(stats) | binary(receiving)
  | binary(muxing) | binary(transports) | binary(url_open) | binary(rtp)
  | binary(rtcp) | binary(rtsp_client) | binary(rtsp_server)
  | binary(tls_hostname) | binary(conformance)
  | test(loopback) | test(round_trip) | test(roundtrip) | test(pairing)
  | test(multicast) | test(reconnect) | test(rtsp) | test(live_pair)
"""
slow-timeout = { period = "20s", terminate-after = 2 }

[[profile.default.overrides]]
# Assign network tests to the capped group + give them a tight timeout (20s;
# the slowest legitimate loopback is an SRT/RIST encrypted handshake at ~1-5s).
# Matched broadly by the integration binaries that do loopback plus loopback-
# style test names: over-matching a fast test is harmless (it just serialises),
# missing a network test is not (it would contend). `binary(...)` / `test(...)`
# are substring matches.
filter = """
    binary(loopback) | binary(loopback_multicast) | binary(pipeline_round_trip)
  | binary(hls_e2e) | binary(pipeline) | binary(stats) | binary(receiving)
  | binary(muxing) | binary(transports) | binary(url_open) | binary(rtp)
  | binary(rtcp) | binary(rtsp_client) | binary(rtsp_server)
  | binary(tls_hostname) | binary(conformance)
  | test(loopback) | test(round_trip) | test(roundtrip) | test(pairing)
  | test(multicast) | test(reconnect) | test(rtsp) | test(live_pair)
"""
test-group = "network"
slow-timeout = { period = "10s", terminate-after = 2 }

[profile.sanitizer]
# Sanitizer runs (.github/workflows/sanitizers.yml): ASan is ~2x slower and
# TSan 5-15x, so the default profile's budgets would kill healthy tests.
# Custom profiles layer on top of [profile.default] (and test-groups are
# global), so the network single-threading still applies — only the time
# budgets change. Global safety net scaled to the TSan worst case:
# 120s x 2 = 240s hard kill.
slow-timeout = { period = "120s", terminate-after = 2 }

[[profile.sanitizer.overrides]]
# Network/loopback budget under sanitizers: the slowest legitimate loopback
# is an encrypted handshake at ~1-5s, so 15x TSan puts it near ~75s — give
# the group 60s x 2. This block is REQUIRED even though the default profile
# already has a network override: profile-specific overrides take precedence
# over [[profile.default.overrides]], but without one here the default 10s
# budget would still match and kill healthy tests under TSan. Filter
# duplicated from the default network override — KEEP THIS FILTER IN SYNC
# WITH IT.
filter = """
    binary(loopback) | binary(loopback_multicast) | binary(pipeline_round_trip)
  | binary(hls_e2e) | binary(pipeline) | binary(stats) | binary(receiving)
  | binary(muxing) | binary(transports) | binary(url_open) | binary(rtp)
  | binary(rtcp) | binary(rtsp_client) | binary(rtsp_server)
  | binary(tls_hostname) | binary(conformance)
  | test(loopback) | test(round_trip) | test(roundtrip) | test(pairing)
  | test(multicast) | test(reconnect) | test(rtsp) | test(live_pair)
"""
test-group = "network"
slow-timeout = { period = "60s", terminate-after = 2 }
