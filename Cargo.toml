[workspace]
resolver = "2"
members = [
    "crates/mbedtls-src",
    "crates/rist-sys",
    "crates/srt-sys",
    "bindings/c",
    "bindings/c/core",
    "crates/tst-core",
    "crates/tst-hls",
    "crates/tst-integration",
    "crates/tst-interop",
    "crates/tst-pipeline",
    "bindings/python",
    "bindings/jvm",
    "crates/tst-rist",
    "crates/tst-rtp",
    "crates/tst-srt",
    "crates/tst-tcp",
    "crates/tst-test-helpers",
    "crates/tst-udp",
    "examples",
]
exclude = ["embedded/baremetal-qemu", "embedded/baremetal-qemu-c"]

[workspace.package]
version      = "0.7.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
authors      = ["Andrew Klofas <aklofas@gmail.com>"]
repository   = "https://github.com/aklofas/ts-transformer"

[workspace.dependencies]
libc          = "0.2"
os_socketaddr = "0.2"
bindgen       = "0.72"
cbindgen      = "0.29"
cc            = "1.0"
cmake         = "0.1"
pkg-config    = "0.3"
thiserror     = { version = "2", default-features = false }
secrecy       = "0.10"
socket2       = "0.5"
tracing       = { version = "0.1", default-features = false, features = ["std"] }
proptest      = "1"
criterion     = "0.5"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
