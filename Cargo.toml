[workspace]
resolver = "2"
members = [
    "crates/mbedtls-src",
    "crates/rist-sys",
    "crates/srt-sys",
    "bindings/c",
    "bindings/c/core",
    "crates/tst-binding-gen",
    "crates/tst-core",
    "crates/tst-hls",
    "crates/tst-integration",
    "crates/tst-interop",
    "crates/tst-pipeline",
    "bindings/python",
    "bindings/jvm",
    "crates/tst-rist",
    "crates/tst-rtp",
    "crates/tst-srt",
    "crates/tst-tcp",
    "crates/tst-test-helpers",
    "crates/tst-udp",
    "examples",
]
exclude = ["embedded/baremetal-qemu", "embedded/baremetal-qemu-c"]

[workspace.package]
version      = "0.8.0"
edition      = "2024"
rust-version = "1.93"
license      = "MIT OR Apache-2.0"
authors      = ["Andrew Klofas <aklofas@gmail.com>"]
repository   = "https://github.com/aklofas/ts-transformer"

[workspace.dependencies]
libc          = "0.2"
os_socketaddr = "0.2"
bindgen       = "0.73"
# bindgen 0.73 accepts prettyplease 0.2-0.3 and syn 2-3 but builds only with prettyplease 0.3 + syn 3; pin the pair
prettyplease  = "0.3"
syn           = "3"
# 0.29.3+ emits C23-only `enum X : int32_t` syntax into tstrans.h, which must stay C11 (no opt-out exists)
cbindgen      = ">=0.29.2, <0.29.3"
cc            = "1.9"
cmake         = "0.1"
pkg-config    = "0.3"
thiserror     = { version = "2", default-features = false }
secrecy       = "0.10"
socket2       = "0.6"
tracing       = { version = "0.1", default-features = false, features = ["std"] }
proptest      = "1"
criterion     = "0.8"

# The lint floor every member inherits (`[lints] workspace = true`). Stricter
# lints are listed at "allow" and are raised one per change.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "allow"
unreachable_pub = "allow"
rust_2018_idioms = { level = "allow", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tst_lint_fixture)"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
# Methods listed in a crate's clippy.toml `disallowed-methods`
# (bindings/c/core, bindings/python).
disallowed_methods = "deny"
undocumented_unsafe_blocks = "allow"
expect_used = "allow"
unwrap_used = "allow"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
