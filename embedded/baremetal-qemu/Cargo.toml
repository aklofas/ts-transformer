[package]
name = "baremetal-qemu"
version = "0.0.0"
edition = "2021"
publish = false
description = "no_std QEMU runtime smoke test for the tst-core muxer + tst-pipeline MuxSender (in-memory + smoltcp UDP loopback transports), excluded from the workspace"

# Empty [workspace] table detaches this package from the main ts-transformer
# workspace. The root Cargo.toml also lists it under `exclude`, but that path
# is relative to the root it lives in: from a nested `git worktree` (e.g.
# .claude/worktrees/<x>/) cargo walked past the worktree's excluded root and
# bound the crate to the PARENT checkout's workspace ("current package
# believes it's in a workspace when it's not"), so no embedded gate could run
# there. Same shape as embedded/freertos-srt/example/host.
[workspace]

[[bin]]
name = "baremetal-qemu"
test = false
bench = false

[dependencies]
tst-core = { path = "../../crates/tst-core", default-features = false }
tst-pipeline = { path = "../../crates/tst-pipeline", default-features = false }
# no_std lock backend for the in-memory `Sink` Transport. `Transport: Send`
# (unconditional), so the single-threaded sink must use a Send/Sync cell:
# `Arc<spin::Mutex<_>>`, not `Rc<RefCell<_>>` (which is !Send).
spin = { version = "0.9", default-features = false, features = ["spin_mutex"] }
# no_std UDP/IP stack for the off-MCU transport proof (Check 3). 0.12.0 has
# MSRV 1.80 (fits the repo's pinned 1.85; 0.13+ needs 1.91). `alloc` is
# required for the phy::Loopback VecDeque and the owned packet buffers, and
# does NOT pull std in 0.12. `Instant::now()` is std-only — Check 3 uses a
# manual Instant::from_millis counter instead.
smoltcp = { version = "0.12.0", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "socket-udp",
] }
embedded-alloc = "0.5"

# Arch-specific runtime/semihosting/panic-handler crates. `panic-semihosting`
# and `cortex-m*` are ARM-only (panic-semihosting's crate root is literally
# `#![cfg(target_arch = "arm")]` — built for any other arch it compiles to an
# empty crate with no `#[panic_handler]`, so it must NOT be a plain
# unconditional dependency). The riscv32 leg gets its own hand-written
# semihosting panic handler in `main.rs` mirroring panic-semihosting's exact
# behavior (see the `#[panic_handler]` there), since no published
# riscv-semihosting-backed panic crate exists.
[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m-rt = "0.7"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-semihosting = "0.5"
panic-semihosting = { version = "0.6", features = ["exit"] }

[target.'cfg(target_arch = "riscv32")'.dependencies]
# "memory" turns on riscv-rt's `INCLUDE memory.x` line in its generated
# link.x, the same seam cortex-m-rt's link.x uses (see build.rs).
riscv-rt = { version = "0.18", default-features = false, features = ["memory"] }
riscv-semihosting = "0.2"
# Explicit dependency (riscv-rt already pulls `riscv` transitively, but
# without this feature) purely to register a `critical-section` impl for the
# single-hart QEMU `virt` target — the riscv32 mirror of cortex-m's
# `critical-section-single-core`. `embedded-alloc`'s `Heap` needs one.
riscv = { version = "0.16", default-features = false, features = ["critical-section-single-hart"] }

[profile.release]
opt-level = "s"
lto = true
