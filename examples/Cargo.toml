[package]
name = "tst-examples"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
publish = false
description = "Runnable examples for the ts-transformer libraries. Not published."

[dependencies]
tst-core = { path = "../crates/tst-core" }
tst-pipeline = { path = "../crates/tst-pipeline" }
tst-rist = { path = "../crates/tst-rist" }
tst-rtp = { path = "../crates/tst-rtp" }
tst-srt = { path = "../crates/tst-srt" }
tst-tcp = { path = "../crates/tst-tcp" }
tst-hls = { path = "../crates/tst-hls" }
tst-udp = { path = "../crates/tst-udp" }

