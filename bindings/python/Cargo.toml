[package]
name        = "tst-py"
description = "MPEG-TS video + MISB KLV streaming via PyO3 — mux/demux, typed KLV, codec parsers, and live SRT/RTP/UDP/TCP/RIST transports"
publish     = false
# tst-py versions independently from the rest of the workspace
# (per spec: docs/specs/2026-05-22-tst-py-design.md — "tst-py crate
# version is independent of the rest of the workspace; v1 starts at
# 0.1.0"). Keep this in sync with pyproject.toml's `[project] version`.
version     = "0.6.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
name       = "tstrans_native"
crate-type = ["cdylib", "rlib"]
doctest    = false

[features]
# `hls` is default-on and ships in published wheels alongside the other
# transports. A `--no-default-features` source build (or explicit feature
# selection without `hls`) is the only way to omit it. See
# docs/project/deferred-features.md.
default = ["rtp", "srt", "udp", "tcp", "rist", "pipeline", "hls", "tls"]
# `rtp` pulls tst-rtp + secrecy (for RtspClientBuilder::auth + server-side
# auth password wrapping). The `MuxSender<RtpTransport>` /
# `DemuxReceiver<RtpRecvTransport>` convenience wrappers come from
# tst-pipeline, which is an unconditional dependency (see `pipeline` below).
# `tst-rtp?/rtsp-server` — tst-py ships the RTSP push server (mounts), so
# this forwards tst-rtp's default-on server feature explicitly (tst-py
# itself sets `default-features = false` on tst-rtp below).
rtp     = ["dep:tst-rtp", "dep:secrecy", "tst-rtp?/rtsp-server"]
# `srt` pulls tst-srt + secrecy
# (for passphrase wrapping in SocketBuilder; matches the rtp pattern of
# wrapping user-passed passwords in `SecretString` before handing them
# to the Rust builder).
srt     = ["dep:tst-srt", "dep:secrecy"]
# Plan A5b — udp / tcp / hls / rist transports (all default-on, matching
# rtp/srt; PyPI wheels ship everything). `hls` pulls tst-hls (with its
# `serve` feature for the built-in HTTP server; the MuxPublisher shell comes
# from the unconditional tst-pipeline). `rist` pulls secrecy for AES PSK
# wrapping AND tst-rist's `mbedtls`
# so `EncryptionKey` PSKs actually encrypt (without it every encrypted
# config raises RistError(ENCRYPTION_DISABLED) at build time).
udp     = ["dep:tst-udp"]
tcp     = ["dep:tst-tcp"]
hls     = ["dep:tst-hls", "tst-hls?/serve"]
rist    = ["dep:tst-rist", "tst-rist/mbedtls", "dep:secrecy"]
# `pipeline` gates the ext::pairing PairingDemuxer composite. tst-pipeline
# itself is an UNCONDITIONAL dependency since Arc 2 WP-B2: `src/raise.rs`
# (the one Rust->Python raise path) and the mux / demux / klv / codec error
# mappers use `tst_pipeline::binding` in every build, transports or not.
pipeline = []
# `tls` (default-on, ships in wheels) lights up the rustls-backed encrypted
# variants of whichever transports are also enabled (weak deps — it never
# pulls a transport in by itself): `rtsps://` client + server (tst-rtp),
# `tcps://` caller + listener (tst-tcp), and `hlss://` HTTPS serving
# (tst-hls). The direct rustls + rustls-pemfile deps parse
# `RtspClientConfig.tls_root_certs_pem` into the RootCertStore that
# `RtspClientBuilder::tls_root_certs` takes (private-CA `rtsps://`
# cameras). Omit the feature (`--no-default-features --features tcp,...`)
# for a plaintext-only build. `tst-rtp?/rtsp-server-tls` ships the RTSP
# server's TLS acceptor too (tst-py ships server TLS — PRs #110/#114);
# `tst-rtp?/rtsp-server-tls` already implies `tst-rtp/tls`, so
# `tst-rtp?/tls` is redundant here — kept as the explicit-both-features form
# for clarity (tst-py's `rtp` feature always forwards `tst-rtp?/rtsp-server`,
# so there's no reachable tst-py build with tst-rtp present but
# `rtsp-server` off).
tls = ["tst-rtp?/tls", "tst-rtp?/rtsp-server-tls", "tst-tcp?/tls", "tst-hls?/tls", "dep:rustls", "dep:rustls-pemfile"]

[dependencies]
tst-core     = { path = "../../crates/tst-core" }
tst-pipeline = { path = "../../crates/tst-pipeline" }
tst-rtp      = { path = "../../crates/tst-rtp", default-features = false, optional = true }
tst-srt      = { path = "../../crates/tst-srt", optional = true }
tst-udp      = { path = "../../crates/tst-udp", default-features = false, optional = true }
tst-tcp      = { path = "../../crates/tst-tcp", default-features = false, optional = true }
tst-hls      = { path = "../../crates/tst-hls", default-features = false, optional = true }
tst-rist     = { path = "../../crates/tst-rist", default-features = false, optional = true }
pyo3         = { version = "0.22", features = ["extension-module", "abi3-py310"] }
# Used by the `rtp` feature path — both T21 RtspClientBuilder::auth and
# T22 server-side auth wrap user-passed passwords in `SecretString`
# before handing them to the Rust builder. Optional + gated on
# `feature = "rtp"` so non-rtp builds don't pull it.
secrecy      = { workspace = true, optional = true }
# `TSTRANS_LOG` bridge (Task C7) — the Rust core emits `tracing` events
# that are otherwise silently discarded because nothing installs a
# subscriber inside the Python extension. Not optional/feature-gated:
# the bridge itself is always compiled in, but only installs a
# subscriber at runtime when `TSTRANS_LOG` is set (see `lib.rs`).
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# `tls` feature path — parse `RtspClientConfig.tls_root_certs_pem` into the
# `rustls::RootCertStore` that `RtspClientBuilder::tls_root_certs` takes.
# Version + provider MUST match tst-rtp/tst-tcp/tst-hls (`0.23`, `ring`) so
# the RootCertStore type unifies across the crate boundary.
[dependencies.rustls]
version          = "0.23"
optional         = true
default-features = false
features         = ["std", "ring"]

[dependencies.rustls-pemfile]
version  = "2"
optional = true

[build-dependencies]
# On macOS, PyO3's `extension-module` feature requires the *consuming* crate
# to emit `-undefined dynamic_lookup` so the cdylib links without a Python
# interpreter at link time. `cargo:rustc-cdylib-link-arg` only takes effect
# from the cdylib package's own build script, so PyO3 itself can't do this
# for us. `add_extension_module_link_args()` is the documented helper.
pyo3-build-config = "0.22"
