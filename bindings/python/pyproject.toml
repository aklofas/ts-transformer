[build-system]
requires      = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name            = "tstrans"
version         = "0.7.0"
description     = "MPEG-TS video + MISB KLV streaming — mux/demux, typed KLV (ST 0601/0102/0605/0903), codec parsers, and live SRT/RTP/UDP/TCP/RIST transports"
requires-python = ">=3.10"
license         = { text = "MIT OR Apache-2.0" }
authors         = [{ name = "Andrew Klofas", email = "aklofas@gmail.com" }]
readme          = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
pandas = ["numpy>=1.24", "pandas>=2.0"]
dev    = ["maturin>=1.7,<2.0", "pytest>=7.0", "pytest-cov>=4.0", "pytest-timeout>=2.1", "tomli>=1.1; python_version < '3.11'"]

[project.urls]
Repository = "https://github.com/aklofas/ts-transformer"
Issues     = "https://github.com/aklofas/ts-transformer/issues"

[tool.maturin]
features      = ["pyo3/extension-module"]
python-source = "python"
module-name   = "tstrans._native"

[tool.pytest.ini_options]
markers = [
    "pandas: tests that require the [pandas] extra (skipped by default)",
]
# --strict-markers / --strict-config: an unknown or typo'd mark (or a config
# option from a plugin that isn't installed) becomes a hard ERROR instead of a
# silently-ignored warning. This is what turns "@pytest.mark.timeout silently
# does nothing because pytest-timeout isn't installed" into an immediate failure.
addopts = "-m 'not pandas' --strict-markers --strict-config"
# Hang safety net (requires the pytest-timeout plugin, in the `dev` extra): any
# test exceeding this is killed and reported as a failure instead of stalling
# the job. Per-test `@pytest.mark.timeout(N)` overrides this default. Mirrors
# the nextest `terminate-after` on the Rust side. Without the plugin the
# `@pytest.mark.timeout` marks are silently ignored (PytestUnknownMarkWarning).
timeout = 60
