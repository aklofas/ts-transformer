# Read by clippy for tst-py only (nearest clippy.toml above the crate).
# A native call that can park releases the GIL through
# util::allow_threads_parking, so a thread that wakes after interpreter
# finalisation parks instead of aborting the process.
disallowed-methods = [
    { path = "pyo3::marker::Python::allow_threads", reason = "use crate::util::allow_threads_parking; a bounded in-memory call states why with #[expect]" },
]
