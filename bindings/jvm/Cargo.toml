[package]
name        = "tst-jni"
description = "JVM (JNI) bindings for the ts-transformer MPEG-TS + KLV + codec parsers"
publish     = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
# cdylib output is `libtstjni.so` (lib name `tstjni`); JNI symbol mangling
# resolves `Java_org_tstrans_Version_versionString` from this object.
name       = "tstjni"
# `rlib` alongside the cdylib (as tst-py does): a cdylib-only lib makes
# `cargo test --doc --workspace` warn "doc tests are not supported for crate
# type(s) `cdylib`" on every run, and `doctest = false` alone does not silence
# it. Nothing links the rlib.
crate-type = ["cdylib", "rlib"]
doctest    = false

[features]
# Compiles the test-only panic probes (bindings/jvm/src/test_hooks.rs + the RTSP
# probes in src/rtp/server.rs) used by PanicIsolationTest + RtspPanicPoisoningTest.
# Default-OFF; never enabled for the published cdylib.
jni-test-hooks = []

[dependencies]
# jni-rs: self-contained JNI bindings. Compiling the cdylib needs no JDK/JVM;
# the JVM is only present at runtime when Java `System.load`s the library.
jni = "0.21"

# tst-core (pure Rust, no libsrt) backs the mpegts-demux keystone (Demuxer +
# DemuxEvent). tst-pipeline/tst-srt/tst-rtp are added by their respective module
# waves, not before.
tst-core = { path = "../../crates/tst-core" }

# tst-pipeline (Sender/Receiver shells) + tst-srt (Socket/Listener/SrtTransport,
# vendored libsrt + mbedTLS) back the org.tstrans.srt surface. First non-pure-Rust
# JVM dep — cargo builds now link libsrt; set SRT_FORCE_VENDORED=1 (build.gradle +
# CI). srt is unconditional in the JVM binding (single cdylib).
tst-pipeline = { path = "../../crates/tst-pipeline" }
tst-srt      = { path = "../../crates/tst-srt" }

# tst-rtp (pure Rust: RTP-over-UDP + RTSP) backs the org.tstrans.rtp surface.
# `tls` is ON: rtsps:// client (custom-CA roots via RtspClientConfig) and
# rtsps:// server (cert/key paths) ship in the JAR — parity with tst-py's
# wheels. The direct rustls + rustls-pemfile deps below parse
# RtspClientConfig.tlsRootCertsPem into the rustls::RootCertStore that
# RtspClientBuilder::tls_root_certs takes (same shape as tst-py). Server
# support (RtspServer + mounts) is on by default in tst-rtp, so
# `rtsp-server-tls` (which implies `rtsp-server`) is what actually gates the
# server's TLS acceptor, now that the rtsp-server feature split separates
# the server's TLS acceptor from the client's `tls` feature.
tst-rtp = { path = "../../crates/tst-rtp", default-features = false, features = ["tls", "rtsp-server-tls"] }

# tst-hls backs org.tstrans.hls (HlsPublisher / MuxPublisher). `serve` (the
# built-in hyper server + hls:// URL parsing) and `tls` (hlss://, rustls ring —
# already linked for RTSPS) are both on, matching tst-py's wheels. Unconditional
# like srt/rtp: one cdylib, every platform.
tst-hls = { path = "../../crates/tst-hls", default-features = false, features = ["serve", "tls"] }

# secrecy wraps RTSP auth passwords at the RtspClientBuilder::auth boundary
# (mirrors tst-py's rtp feature: dep:secrecy). Workspace-pinned (0.10).
secrecy = { workspace = true }

# `TSTRANS_LOG` bridge — the Rust core emits `tracing` events
# that are otherwise silently discarded because nothing installs a
# subscriber inside the JVM cdylib. Not optional/feature-gated: the
# bridge itself is always compiled in, but only installs a subscriber
# at runtime when `TSTRANS_LOG` is set (see `lib.rs`). Mirrors tst-py's
# identical dependency.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dependencies.rustls]
version          = "0.23"
default-features = false
features         = ["std", "ring"]

[dependencies.rustls-pemfile]
version = "2"

[dev-dependencies]
# Test-only: `lib.rs`'s init_tracing_bridge test asserts on
# `tracing::dispatcher::has_been_set()`, which needs `tracing` in scope
# (tracing-subscriber does not re-export it). Same version pin as
# tst-rtp/tst-pipeline.
tracing = { version = "0.1", default-features = false, features = ["std"] }
