language = "C"
header = """\
/*
 * tstrans.h — C ABI for ts-transformer (mpeg-ts + KLV + SRT + RTP).
 *
 * This file is GENERATED by cbindgen. Do not edit manually.
 * Source of truth: bindings/c/core/src/ (Rust).
 *
 * Copyright (c) 2026 Andrew Klofas. Licensed under MIT OR Apache-2.0.
 */
"""
include_guard = "TSTRANS_H"
pragma_once   = false
no_includes   = false
sys_includes  = ["stddef.h"]
cpp_compat    = true
documentation = true
documentation_style = "doxy"
usize_is_size_t = true

# Emit items alphabetically by symbol name (default would be source order).
# Decouples header layout from Rust source-file layout so internal reorgs
# (e.g. moving modules between src/ subfolders) don't churn tstrans.h.
sort_by = "Name"

trailer = """
/* Always emit TST_HAS_* defines so consumer C code can #if-test them
 * without prior knowledge of build flavor. cbindgen wraps cfg-gated
 * symbols in #ifdef TST_HAS_SRT / #ifdef TST_HAS_RTP blocks when the
 * corresponding feature is active; these fallback defines ensure the
 * macros are always defined (to 0) even in feature-stripped builds.
 */
#if !defined(TST_HAS_SRT)
#define TST_HAS_SRT 0
#endif
#if !defined(TST_HAS_RTP)
#define TST_HAS_RTP 0
#endif
#if !defined(TST_HAS_UDP)
#define TST_HAS_UDP 0
#endif
#if !defined(TST_HAS_TCP)
#define TST_HAS_TCP 0
#endif
#if !defined(TST_HAS_HLS)
#define TST_HAS_HLS 0
#endif
#if !defined(TST_HAS_RIST)
#define TST_HAS_RIST 0
#endif

/* ABI layout guards — trip the C compiler at consumer-build time if
 * the Rust-side struct sizes drift from their pinned baselines. Layouts
 * are pinned in `bindings/c/core/src/event.rs` and `bindings/c/core/src/stats.rs`
 * via `const _: () = assert!(...)` blocks on the Rust side; this
 * duplicates the guard on the C side so consumers building against an
 * upgraded libtstrans see the mismatch immediately rather than at runtime.
 *
 * The asserts are split by pointer width: the stats structs and
 * tst_klv_link_t carry only fixed-width integer fields, so their sizes
 * hold on any width; the event-view structs carry pointer / size_t
 * fields, so their expected sizes are pinned per width (64-bit hosts and
 * the 32-bit embedded targets the firmware-qemu gate proves). An
 * unrecognized pointer width skips only the pointer-bearing asserts.
 */
#if !defined(TST_SKIP_ABI_ASSERTS) && !defined(_TST_ABI_ASSERTS_DONE)
#define _TST_ABI_ASSERTS_DONE
#define _TST_ABI_ASSERT(c, msg) _Static_assert((c), msg)
/* Pointer-width-independent layouts (fixed-width integer fields only). */
_TST_ABI_ASSERT(sizeof(tst_klv_link_t)             ==  8, "tst_klv_link_t size drift");
_TST_ABI_ASSERT(sizeof(tst_demux_receiver_stats_t) == 48, "tst_demux_receiver_stats_t size drift");
_TST_ABI_ASSERT(sizeof(tst_managed_transport_stats_t) == 48, "tst_managed_transport_stats_t size drift");
_TST_ABI_ASSERT(sizeof(tst_event_t)               <= 256, "tst_event_t exceeds 256 B");
_TST_ABI_ASSERT(sizeof(tst_stream_codec_stats_t)   == 24, "tst_stream_codec_stats_t size drift: expected 24 bytes");
_TST_ABI_ASSERT(sizeof(tst_socket_stats_t)         == 120, "tst_socket_stats_t size drift: expected 120 bytes");
_TST_ABI_ASSERT(sizeof(tst_stream_stats_t)         == 96, "tst_stream_stats_t size drift: expected 96 bytes");
_TST_ABI_ASSERT(sizeof(tst_raw_send_stats_t)       == 16, "tst_raw_send_stats_t size drift: expected 16 bytes");
_TST_ABI_ASSERT(sizeof(tst_raw_recv_stats_t)       == 16, "tst_raw_recv_stats_t size drift: expected 16 bytes");
_TST_ABI_ASSERT(sizeof(tst_receiver_stats_t)       == 32, "tst_receiver_stats_t size drift: expected 32 bytes");
_TST_ABI_ASSERT(sizeof(tst_sender_stats_t)         == 32, "tst_sender_stats_t size drift: expected 32 bytes");
_TST_ABI_ASSERT(sizeof(tst_muxer_stats_t)          == 6176, "tst_muxer_stats_t size drift: expected 6176 bytes");
_TST_ABI_ASSERT(sizeof(tst_mux_sender_stats_t)     == 6192, "tst_mux_sender_stats_t size drift: expected 6192 bytes");
/* Pointer-bearing layouts — expected sizes differ by pointer width. */
#if UINTPTR_MAX == 0xFFFFFFFFFFFFFFFF
_TST_ABI_ASSERT(sizeof(tst_nal_t)                  == 24, "tst_nal_t size drift");
_TST_ABI_ASSERT(sizeof(tst_obu_t)                  == 24, "tst_obu_t size drift");
_TST_ABI_ASSERT(sizeof(tst_descriptor_t)           == 24, "tst_descriptor_t size drift");
_TST_ABI_ASSERT(sizeof(tst_stream_info_t)          == 40, "tst_stream_info_t size drift");
#elif UINTPTR_MAX == 0xFFFFFFFF
_TST_ABI_ASSERT(sizeof(tst_nal_t)                  == 12, "tst_nal_t size drift (32-bit)");
_TST_ABI_ASSERT(sizeof(tst_obu_t)                  == 12, "tst_obu_t size drift (32-bit)");
_TST_ABI_ASSERT(sizeof(tst_descriptor_t)           == 16, "tst_descriptor_t size drift (32-bit)");
_TST_ABI_ASSERT(sizeof(tst_stream_info_t)          == 28, "tst_stream_info_t size drift (32-bit)");
#endif
#endif
"""

[parse]
parse_deps = true
include = ["tst-core", "tst-pipeline", "tst-srt"]

[defines]
# Map cargo features to C preprocessor defines so cbindgen wraps
# cfg-gated symbols in the corresponding #ifdef / #endif block.
"feature = srt" = "TST_HAS_SRT"
"feature = rtp" = "TST_HAS_RTP"
# udp / tcp / hls / rist (all default-off).
"feature = udp"  = "TST_HAS_UDP"
"feature = tcp"  = "TST_HAS_TCP"
"feature = hls"  = "TST_HAS_HLS"
"feature = rist" = "TST_HAS_RIST"

[export]
include = [
    "TstError",
    "TstVideoCodec",
    "TstKlvStreamType",
    "TstTsFramingMode",
    "TstOverflowPolicy",
    "TstReconnectMode",
    "TstVideoStreamHandle",
    "TstKlvStreamHandle",
    "TstAudioStreamHandle",
    "TstSubtitleStreamHandle",
    "TstDataStreamHandle",
    "TstProgramHandle",
    "TST_INVALID_PROGRAM_HANDLE",
    "TstStreamStats",
    "TstMuxerStats",
    "TstMuxSenderStats",
    "TstSenderStats",
    "TstRawSendStats",
    "TstManagedTransportStats",
    "TstRawReceiver",
    "TstManagedRawReceiver",
    "TstRawRecvStats",
    "TstReceiver",
    "TstManagedReceiver",
    "TstReceiverStats",
    "TstSocketStats",
    "TstStreamCodecStats",
    "TstStreamCodecStatsUnion",
    "TstCodecStatsUnknown",
    "TstCodecStatsVideo",
    "TstCodecStatsKlv",
    "TstCodecStatsAudio",
    "TST_CODEC_KIND_UNKNOWN",
    "TST_CODEC_KIND_VIDEO",
    "TST_CODEC_KIND_KLV",
    "TST_CODEC_KIND_AUDIO",
    "TST_STATS_MAX_STREAMS",
    # Demux receiver surface
    "TstDemuxConfig",
    "TstDemuxReceiver",
    "TstManagedDemuxReceiver",
    "TstDemuxReceiverStats",
    "TstEvent",
    "TstEventKind",
    "TstEventBody",
    "TstEventProgramMap",
    "TstEventSample",
    "TstEventMetadata",
    "TstEventDiscontinuity",
    "TstEventNonConformant",
    "TstNal",
    "TstObu",
    "TstDescriptor",
    "TstStreamInfo",
    "TstKlvLink",
    "TstStreamKindTag",
    "TstMetadataKindTag",
    "TstDiscontinuityKindTag",
    "TstNonConformantCode",
    "TstPcrMalformedKind",
    "TstCellFragmentIndication",
    "TstMultiCellAuReason",
    "TstLinkSource",
    "TstStrictMode",
    "TstAudioCodec",
    "TstSubtitleCodec",
    "TstAv1CarriageMode",
    # HLS publisher-kind discriminator (hls feature)
    "TstPublisherKind",
    # RTSP client builder handle (rtp feature — emitted inside #if defined(TST_HAS_RTP))
    "TstRtspClientBuilder",
    # RTP stream-end reason — unconditional (defined outside the rtp
    # module so cbindgen emits it without a per-variant #if; only the
    # two getters that read it are TST_HAS_RTP-gated)
    "TstStreamEndReason",
    # RTSP server stats structs (rtp feature)
    "TstServerStats",
    "TstMountStats",
    # RTSP server cancel handle (rtp feature)
    "TstRtspCancelHandle",
    # ST 0601 KLV decode surface (ABI 21, unconditional)
    "TstSt0601",
    "TstSt0601Geometry",
    "TstSt0601FieldState",
    # Annex B <-> length-prefixed + parameter-set extraction
    # (ABI 21, unconditional)
    "TstParamSets",
]

[export.rename]
# Enums (repr(C)): no _t suffix, so prefix_with_name produces clean TST_* variant prefixes
"TstError"             = "tst_e"
"TstVideoCodec"        = "tst_video_codec"
"TstKlvStreamType"     = "tst_klv_stream_type"
"TstTsFramingMode"     = "tst_ts_framing_mode"
"TstOverflowPolicy"    = "tst_overflow_policy"
"TstReconnectMode"     = "tst_reconnect_mode"
# Opaque handles: idiomatic C _t suffix
"TstMuxer"             = "tst_muxer_t"
"TstMuxConfig"         = "tst_mux_config_t"
"TstMuxSender"         = "tst_mux_sender_t"
"TstManagedMuxSender"  = "tst_managed_mux_sender_t"
"TstSender"            = "tst_sender_t"
"TstManagedSender"     = "tst_managed_sender_t"
"TstRawSender"         = "tst_raw_sender_t"
"TstManagedRawSender"  = "tst_managed_raw_sender_t"
"TstSenderConfig"      = "tst_sender_config_t"
"TstRawSenderConfig"   = "tst_raw_sender_config_t"
"TstReconnectPolicy"   = "tst_reconnect_policy_t"
"TstSenderStats"       = "tst_sender_stats_t"
# Stream handle typedefs (transparent u32; idiomatic C _t suffix)
"TstVideoStreamHandle"    = "tst_video_stream_handle_t"
"TstKlvStreamHandle"      = "tst_klv_stream_handle_t"
"TstAudioStreamHandle"    = "tst_audio_stream_handle_t"
"TstSubtitleStreamHandle" = "tst_subtitle_stream_handle_t"
"TstDataStreamHandle"     = "tst_data_stream_handle_t"
# Program handle typedef
"TstProgramHandle"     = "tst_program_handle_t"
# Stats structs
"TstStreamStats"       = "tst_stream_stats_t"
"TstMuxerStats"        = "tst_muxer_stats_t"
"TstMuxSenderStats"    = "tst_mux_sender_stats_t"
"TstRawSendStats"    = "tst_raw_send_stats_t"
"TstManagedTransportStats" = "tst_managed_transport_stats_t"
# Receiver handles
"TstRawReceiver"       = "tst_raw_receiver_t"
"TstManagedRawReceiver" = "tst_managed_raw_receiver_t"
"TstRawRecvStats"  = "tst_raw_recv_stats_t"
"TstReceiver"          = "tst_receiver_t"
"TstManagedReceiver"   = "tst_managed_receiver_t"
"TstReceiverStats"     = "tst_receiver_stats_t"
"TstSocketStats"       = "tst_socket_stats_t"
# Codec-specific stats
"TstStreamCodecStats"       = "tst_stream_codec_stats_t"
"TstStreamCodecStatsUnion"  = "tst_stream_codec_stats_union_t"
"TstCodecStatsUnknown"      = "tst_codec_stats_unknown_t"
"TstCodecStatsVideo"        = "tst_codec_stats_video_t"
"TstCodecStatsKlv"          = "tst_codec_stats_klv_t"
"TstCodecStatsAudio"        = "tst_codec_stats_audio_t"
# Demux receiver handles + stats
"TstDemuxConfig"            = "tst_demux_config_t"
"TstDemuxReceiver"          = "tst_demux_receiver_t"
"TstManagedDemuxReceiver"   = "tst_managed_demux_receiver_t"
"TstDemuxReceiverStats"     = "tst_demux_receiver_stats_t"
# Event tagged union + subordinate structs
"TstEvent"                  = "tst_event_t"
"TstNal"                    = "tst_nal_t"
"TstObu"                    = "tst_obu_t"
"TstDescriptor"             = "tst_descriptor_t"
"TstStreamInfo"             = "tst_stream_info_t"
"TstKlvLink"                = "tst_klv_link_t"
# Discriminator enums — no _t suffix so prefix_with_name yields
# clean TST_EVENT_KIND_* (not TST_EVENT_KIND_T_*)
"TstEventKind"              = "tst_event_kind"
"TstStreamKindTag"          = "tst_stream_kind"
"TstMetadataKindTag"        = "tst_metadata_kind"
"TstDiscontinuityKindTag"   = "tst_discontinuity_kind"
"TstNonConformantCode"      = "tst_nonconformant_code"
"TstPcrMalformedKind"       = "tst_pcr_malformed_kind"
"TstCellFragmentIndication" = "tst_cell_fragment_indication"
"TstMultiCellAuReason"      = "tst_multi_cell_au_reason"
"TstLinkSource"             = "tst_link_source"
"TstStrictMode"             = "tst_strict_mode"
"TstAudioCodec"             = "tst_audio_codec"
"TstSubtitleCodec"          = "tst_subtitle_codec"
"TstAv1CarriageMode"        = "tst_av1_carriage_mode"
# HLS publisher-kind discriminator — no _t suffix so prefix_with_name
# yields clean TST_PUBLISHER_KIND_* variants
"TstPublisherKind"          = "tst_publisher_kind"
# RTSP client builder opaque handle
"TstRtspClientBuilder"      = "tst_rtsp_client_builder_t"
# RTP stream-end reason discriminator — no _t suffix so prefix_with_name
# yields clean TST_STREAM_END_REASON_* variants
"TstStreamEndReason"        = "tst_stream_end_reason"
# RTSP server stats structs
"TstServerStats"            = "tst_server_stats_t"
"TstMountStats"             = "tst_mount_stats_t"
# RTSP server cancel handle
"TstRtspCancelHandle"       = "tst_rtsp_cancel_handle_t"
# ST 0601 KLV decode surface (ABI 21)
"TstSt0601"                 = "tst_st0601_t"
"TstSt0601Geometry"         = "tst_st0601_geometry_t"
"TstSt0601FieldState"       = "tst_st0601_field_state"
# Annex B <-> length-prefixed + parameter-set extraction (ABI 21)
"TstParamSets"              = "tst_param_sets_t"

[enum]
prefix_with_name = true
rename_variants  = "ScreamingSnakeCase"

[fn]
prefix = ""
rename_args = "None"
