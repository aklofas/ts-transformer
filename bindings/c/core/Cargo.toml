[package]
name        = "tst-c-core"
description = "Embeddable C-ABI core for tst-c (rlib; no_std-capable)"
publish     = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
doctest = false

[features]
# All transports (srt/rtp/udp/tcp/hls/rist) are opt-in. `mbedtls` stays
# default-on but is inert unless `srt` is also enabled (the `tst-srt?/mbedtls`
# forward below only fires when tst-srt is in the dependency graph), so
# `--features srt` is encrypted by default while a bare build pulls neither.
default = ["std", "mbedtls"]
# `std` gates every transport-bearing surface + std-only sinks. The offline
# core (muxer / demuxer / config / error / handle / panic) compiles without it
# (no_std + alloc), for the no_std embedded staticlib path (see
# embedded/baremetal-qemu-c/); `std` gates the transport-bearing surface.
std     = ["tst-pipeline/std", "tst-core/std"]
srt     = ["std", "dep:tst-srt"]
rtp     = ["std", "dep:tst-rtp", "dep:secrecy"]
mbedtls = ["tst-srt?/mbedtls"]
udp     = ["std", "dep:tst-udp"]
tcp     = ["std", "dep:tst-tcp"]
hls     = ["std", "dep:tst-hls", "tst-hls?/serve"]
rist    = ["std", "dep:tst-rist"]

[dependencies]
tst-srt      = { path = "../../../crates/tst-srt", default-features = false, optional = true }
tst-rtp      = { path = "../../../crates/tst-rtp", default-features = false, features = ["rtsp-server"], optional = true }
tst-udp      = { path = "../../../crates/tst-udp", default-features = false, optional = true }
tst-tcp      = { path = "../../../crates/tst-tcp", default-features = false, optional = true }
tst-hls      = { path = "../../../crates/tst-hls", default-features = false, optional = true }
tst-rist     = { path = "../../../crates/tst-rist", default-features = false, optional = true }
tst-pipeline = { path = "../../../crates/tst-pipeline", default-features = false }
tst-core     = { path = "../../../crates/tst-core", default-features = false }
libc         = { workspace = true }
thiserror    = { workspace = true }
secrecy      = { workspace = true, optional = true }
critical-section = "1"
spin         = { version = "0.9", default-features = false, features = ["spin_mutex"] }

[dev-dependencies]
# The no_std plane's last-error slot (error.rs) runs on critical-section, which
# ships no implementation of its own: on a real MCU the firmware glue supplies
# one, and the host `cargo test -p tst-c-core --no-default-features` binary
# gets the crate's std implementation from here. Dev-only, so the library's
# MCU builds stay implementation-free.
critical-section = { version = "1", features = ["std"] }
